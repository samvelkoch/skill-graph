  fillBox(c, B, '#2a1a0f');
  const cell = 19, j0 = Math.floor((B.y0 + oy) / cell) - 5, j1 = Math.ceil((B.y1 + oy) / cell) + 5, i0 = Math.floor((B.x0 + ox) / cell) - 5, i1 = Math.ceil((B.x1 + ox) / cell) + 5;
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
    const x = (i + hsh(i, j, 1)) * cell - ox, y = (j + hsh(j, i, 2)) * cell - oy, a = -Math.PI / 2 + 0.25 + (hsh(i, j, 3) - 0.5) * 1.3, len = 62 + hsh(i, j, 4) * 26, w = 4.4;
    c.save(); c.translate(x, y); c.rotate(a + Math.PI / 2);
    c.beginPath(); c.moveTo(-w, 0); c.lineTo(w, 0); c.lineTo(0.4, -len); c.lineTo(-0.4, -len); c.closePath();
    c.fillStyle = lg(c, 0, 0, 0, -len, [[0, '#24160c'], [0.22, '#7c5733'], [0.42, '#eadcc0'], [0.58, '#4c3322'], [0.78, '#e6d4b0'], [1, '#fff4dc']]);
    c.fill(); c.lineWidth = 0.7; c.strokeStyle = 'rgba(20,10,4,.55)'; c.stroke();
    c.restore();
  }
}
// pangolin: big leaf-shaped scales with fine hair between them
function pangoTex(c, ox, oy, B, pal) {
  const w = pal.w || 54, h = w * 1.15, rh = h * 0.46;
  fillBox(c, B, '#3a281a');
  const j0 = Math.floor((B.y0 + oy) / rh) - 2, j1 = Math.ceil((B.y1 + oy) / rh) + 2;
  const cells = [];
  for (let j = j1; j >= j0; j--) {
    const y = j * rh - oy, o = (j & 1) * w / 2;
    const i0 = Math.floor((B.x0 + ox - o) / w) - 1, i1 = Math.ceil((B.x1 + ox - o) / w) + 1;
    for (let i = i0; i <= i1; i++) {
      const x = i * w + o - ox, base = mix(pal.a, pal.b, hsh(i, j, 21) * 0.8);
      cells.push([x, y]);
      c.beginPath(); c.moveTo(x - w / 2, y - h / 2); c.lineTo(x - w / 2, y + h * 0.05); c.quadraticCurveTo(x - w / 2, y + h / 2, x, y + h / 2 + 5); c.quadraticCurveTo(x + w / 2, y + h / 2, x + w / 2, y + h * 0.05); c.lineTo(x + w / 2, y - h / 2); c.closePath();
      c.fillStyle = lg(c, x - w / 2, y - h / 2, x + w / 2, y + h / 2, [[0, shade(base, 0.3)], [0.5, base], [1, shade(base, -0.35)]]); c.fill();
      c.lineWidth = 2.2; c.strokeStyle = '#3d2a18'; c.stroke();
      c.save(); c.clip(); c.strokeStyle = 'rgba(40,24,10,.38)'; c.lineWidth = 1.1;
      for (let k = -3; k <= 3; k++) { c.beginPath(); c.moveTo(x + k * 1.5, y - h * 0.45); c.lineTo(x + k * w * 0.13, y + h * 0.55); c.stroke(); }
      c.restore();
    }
  }
  c.lineCap = 'round';
  cells.forEach(([x, y]) => {
    for (let k = 0; k < 5; k++) {
      const sx = x - w * 0.34 + k * w * 0.17, sy = y + h * 0.36 + Math.abs(k - 2) * -2 + 6, len = 15 + hsh(x, k, 1) * 6, bend = (hsh(x, y, k) - 0.5) * 10;
      c.beginPath(); c.moveTo(sx, sy); c.quadraticCurveTo(sx - 4 + bend, sy + len * 0.5, sx - 7 + bend, sy + len); c.strokeStyle = k % 2 ? '#e9cf9e' : '#b58a55'; c.lineWidth = 1.7; c.stroke();
    }
  });
}
// moist skin: smooth, wet, with blotches, bumps and glossy highlights
function moistTex(c, ox, oy, B, pal) {
  fillBox(c, B, lg(c, B.x0, B.y0, B.x1, B.y1, [[0, shade(pal.base, 0.15)], [1, shade(pal.base, -0.25)]]));
  const blot = (cell, k, rmin, rmax, col, alpha, prob) => {
    const j0 = Math.floor((B.y0 + oy) / cell) - 1, j1 = Math.ceil((B.y1 + oy) / cell) + 1, i0 = Math.floor((B.x0 + ox) / cell) - 1, i1 = Math.ceil((B.x1 + ox) / cell) + 1;
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
      if (hsh(i, j, k) > prob) continue;
      const x = (i + 0.2 + hsh(i, j, k + 1) * 0.6) * cell - ox, y = (j + 0.2 + hsh(j, i, k + 2) * 0.6) * cell - oy, r = rmin + hsh(i, j, k + 3) * (rmax - rmin);
      c.globalAlpha = alpha; c.beginPath(); E(c, x, y, r, r * (0.6 + hsh(i, j, k + 5) * 0.4), hsh(i, j, k + 6) * 3); E(c, x + r * 0.5, y + r * 0.2, r * 0.6, r * 0.5);
      c.fillStyle = rg(c, x, y, 0, r * 1.2, [[0, col], [1, shade(col, -0.25)]]); c.fill(); c.globalAlpha = 1;
    }
  };
  blot(40, 30, 7, 16, pal.blot, 0.8, 0.85);
  if (pal.spot) blot(56, 50, 10, 19, pal.spot, 1, 0.9);
  c.fillStyle = 'rgba(255,255,255,.16)';
  for (let j = Math.floor((B.y0 + oy) / 9); j <= Math.ceil((B.y1 + oy) / 9); j++) for (let i = Math.floor((B.x0 + ox) / 9); i <= Math.ceil((B.x1 + ox) / 9); i++) {
    c.beginPath(); c.arc((i + hsh(i, j, 60)) * 9 - ox, (j + hsh(j, i, 61)) * 9 - oy, 1.7, 0, TAU); c.fill();
  }
  // wet shine
  const cell = 42, j0 = Math.floor((B.y0 + oy) / cell) - 1, j1 = Math.ceil((B.y1 + oy) / cell) + 1, i0 = Math.floor((B.x0 + ox) / cell) - 1, i1 = Math.ceil((B.x1 + ox) / cell) + 1;
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
    const x = (i + hsh(i, j, 70)) * cell - ox, y = (j + hsh(j, i, 71)) * cell - oy, r = 6 + hsh(i, j, 72) * 7;
    c.beginPath(); E(c, x, y, r * 1.9, r, -0.5); c.fillStyle = rg(c, x, y, 0, r * 2, [[0, 'rgba(255,255,255,.55)'], [1, 'rgba(255,255,255,0)']]); c.fill();
    c.beginPath(); E(c, x - r * 0.3, y - r * 0.25, r * 0.7, r * 0.32, -0.5); c.fillStyle = 'rgba(255,255,255,.9)'; c.fill();
  }
  fillBox(c, B, lg(c, B.x0, B.y0, B.x1, B.y0 + 120, [[0, 'rgba(255,255,255,.2)'], [1, 'rgba(255,255,255,0)']]));
}
// whale: the blowhole and a puff of spray
function blowTex(c) {
  fillBox(c, BIG, lg(c, -100, -100, 100, 100, [[0, '#4d6f93'], [1, '#22364c']]));
  c.strokeStyle = 'rgba(10,20,34,.25)'; c.lineWidth = 2;
  for (let k = 0; k < 9; k++) { c.beginPath(); c.moveTo(-110, -90 + k * 24 + hsh(k, 1) * 8); c.quadraticCurveTo(0, -80 + k * 24 + hsh(k, 2) * 16, 110, -90 + k * 24 + hsh(k, 3) * 8); c.stroke(); }
  c.strokeStyle = 'rgba(200,225,250,.2)'; c.lineWidth = 1.5;
  for (let k = 0; k < 9; k++) { c.beginPath(); c.moveTo(-110, -86 + k * 24 + hsh(k, 1) * 8); c.quadraticCurveTo(0, -76 + k * 24 + hsh(k, 2) * 16, 110, -86 + k * 24 + hsh(k, 3) * 8); c.stroke(); }
  for (const s of [-1, 1]) {
    c.beginPath(); c.moveTo(s * 40, 22); c.quadraticCurveTo(s * 10, 6, s * 6, 56); c.quadraticCurveTo(s * 30, 30, s * 40, 22); c.closePath();
    c.fillStyle = '#060d16'; c.fill(); c.lineWidth = 3; c.strokeStyle = '#6d8fb2'; c.stroke();
  }
  for (let k = 0; k < 34; k++) {
    const x = (hsh(k, 5) - 0.5) * 120, y = -10 - hsh(k, 6) * 80, r = 2 + hsh(k, 7) * 5;
    c.beginPath(); c.arc(x, y, r, 0, TAU); c.fillStyle = rg(c, x - r * 0.3, y - r * 0.3, 0, r * 1.2, [[0, 'rgba(255,255,255,.95)'], [1, 'rgba(180,215,245,.5)']]); c.fill();
  }
}

// a skin laid over a body shape (the caller sets the clip); sc shrinks the design space to animal size
function skinOver(c, kind, sc, x0, y0, x1, y1, ox = 0, oy = 0) {
  c.save(); c.scale(sc, sc); TEX[kind](c, ox, oy, { x0: x0 / sc, y0: y0 / sc, x1: x1 / sc, y1: y1 / sc }); c.restore();
}

  c.fillStyle = '#fff'; c.textAlign = 'left'; c.fillText(text, px + 11, py + ph / 2 + 0.5);
  c.restore();
}
function drawCard(c, cd) {
  c.save(); c.beginPath(); rr(c, cd.x, cd.y, cd.w, cd.h, 24);
  c.fillStyle = lg(c, 0, cd.y, 0, cd.y + cd.h, [[0, '#222c4c'], [1, '#121830']]); c.fill();
  c.clip();
  c.fillStyle = rg(c, cd.x + cd.w * 0.5, cd.y + cd.h * 0.42, 10, cd.w * 0.7, [[0, 'rgba(120,150,230,.28)'], [1, 'rgba(120,150,230,0)']]); c.fillRect(cd.x, cd.y, cd.w, cd.h);
  c.restore();
  c.beginPath(); rr(c, cd.x, cd.y, cd.w, cd.h, 24); c.lineWidth = 1.5; c.strokeStyle = 'rgba(130,145,190,.35)'; c.stroke();
}
function drawCover(c, cd) {
  c.beginPath(); rr(c, cd.x, cd.y, cd.w, cd.h, 24);
  c.fillStyle = lg(c, cd.x, cd.y, cd.x + cd.w, cd.y + cd.h, [[0, '#3a4672'], [1, '#1c2442']]); c.fill();
  c.save(); c.clip(); c.strokeStyle = 'rgba(170,185,235,.10)'; c.lineWidth = 8;
  for (let k = -cd.h; k < cd.w + cd.h; k += 26) { c.beginPath(); c.moveTo(cd.x + k, cd.y); c.lineTo(cd.x + k - cd.h, cd.y + cd.h); c.stroke(); }
  c.font = '900 120px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = 'rgba(190,205,255,.13)';
  c.fillText('?', cd.x + cd.w * 0.18, cd.y + cd.h * 0.2); c.fillText('?', cd.x + cd.w * 0.84, cd.y + cd.h * 0.8); c.fillText('?', cd.x + cd.w * 0.8, cd.y + cd.h * 0.16);
  c.fillStyle = lg(c, 0, cd.y + cd.h - 14, 0, cd.y + cd.h, [[0, 'rgba(255,255,255,0)'], [1, 'rgba(255,255,255,.25)']]); c.fillRect(cd.x, cd.y + cd.h - 14, cd.w, 14);
  c.restore();
  c.beginPath(); rr(c, cd.x, cd.y, cd.w, cd.h, 24); c.lineWidth = 2; c.strokeStyle = 'rgba(200,215,255,.4)'; c.stroke();
}
function lensScene(c, cd, dt) {
  const q = Q.lens, id = SEQ.lens[q.i], s = Math.min(cd.w / 230, cd.h / 190), cx = cd.x + cd.w / 2, cy = cd.y + cd.h * 0.46, e = ease(q.p);
  const R0 = Math.min(cd.w * 0.39, cd.h * 0.33, 150), R2 = Math.min(50, cd.w * 0.15);
  if (q.p > 0) drawAnimal(c, id, cx, cy, s * (0.94 + 0.06 * backOut(q.p)));
  if (q.p < 1) { c.save(); c.beginPath(); rr(c, cd.x, cd.y, cd.w, cd.h, 24); c.clip(); c.translate(0, -e * (cd.h + 30)); drawCover(c, cd); c.restore(); }
  const px = clamp(cd.x + cd.w * S.fx, cd.x + R0 * 0.5, cd.x + cd.w - R0 * 0.5), py = clamp(cd.y + cd.h * S.fy, cd.y + R0 * 0.5, cd.y + cd.h - R0 * 0.5);
  const lx = lerp(px, cd.x + cd.w - R2 - 16, e), ly = lerp(py, cd.y + cd.h - R2 - 16, e), R = lerp(R0, R2, e);
  G.lens = q.pick === null && !q.done ? { x: px, y: py, R: R0 } : null;
  drawLens(c, lx, ly, R, id, S.ox, S.oy, 1 - e);
  if (q.p === 0) pill(c, T[lang].hint, cd.x + cd.w / 2, cd.y + 24);
}
function trickScene(c, cd) {
  const q = Q.trick, id = SEQ.trick[q.i], it = ITEMS[id], s = Math.min(cd.w / 230, cd.h / 200), cx = cd.x + cd.w / 2, cy = cd.y + cd.h * 0.52;
  drawAnimal(c, id, cx, cy, s);
  if (q.p <= 0) return;
  const Rf = Math.min(cd.w * 0.155, 54), R = Rf * backOut(q.p);
  const lx = clamp(cx + it.lx * s, cd.x + Rf + 6, cd.x + cd.w - Rf - 6), ly = clamp(cy + it.ly * s, cd.y + Rf + 6, cd.y + cd.h - Rf - 34);
  const ax = cx + it.ax * s, ay = cy + it.ay * s;
  c.save(); c.globalAlpha = ease(q.p); c.setLineDash([5, 5]); c.lineWidth = 2; c.strokeStyle = 'rgba(255,255,255,.75)';
  c.beginPath(); c.moveTo(ax, ay); c.lineTo(lx, ly); c.stroke(); c.setLineDash([]);
  c.beginPath(); c.arc(ax, ay, 6, 0, TAU); c.fillStyle = '#ff3b30'; c.fill(); c.lineWidth = 2; c.strokeStyle = '#fff'; c.stroke(); c.restore();
  drawLens(c, lx, ly, R, id, S.ox, S.oy, 0);
  if (q.p > 0.6) { c.save(); c.globalAlpha = ease((q.p - 0.6) / 0.4); pill(c, T[lang].tag[id], lx, ly + Rf + 20 > cd.y + cd.h - 20 ? ly - Rf - 20 : ly + Rf + 20); c.restore(); }
}
function doneScene(c, cd) {
  const v = lab.view, q = Q[v], seq = SEQ[v], n = seq.length, cols = n > 6 ? 5 : 3, rows = Math.ceil(n / cols);
  const tw = (cd.w - 24) / cols, th = Math.min(tw * 1.1, (cd.h - 24) / rows), ox = cd.x + 12, oy = cd.y + (cd.h - th * rows) / 2;
  seq.forEach((id, k) => {
    const x = ox + (k % cols) * tw, y = oy + Math.floor(k / cols) * th, ok = q.res[k];
    c.beginPath(); rr(c, x + 4, y + 4, tw - 8, th - 8, 14); c.fillStyle = 'rgba(10,14,30,.55)'; c.fill();
    c.lineWidth = 2.5; c.strokeStyle = ok ? '#3ddc97' : '#ff6a5e'; c.stroke();
    drawAnimal(c, id, x + tw / 2, y + th / 2, Math.min(tw / 250, th / 190));
    c.save(); c.font = '900 14px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.beginPath(); c.arc(x + tw - 14, y + 14, 10, 0, TAU); c.fillStyle = ok ? '#3ddc97' : '#ff6a5e'; c.fill(); c.fillStyle = '#0a0c14'; c.fillText(ok ? '✓' : '✗', x + tw - 14, y + 14.5); c.restore();
  });
}
function secScene(c, cd, t) {
  if (S.sec === 'a') {
    const s = Math.min(cd.w / 230, cd.h / 200) * 0.95, cx = cd.x + cd.w / 2, cy = cd.y + cd.h * 0.4;
    drawAnimal(c, 'platypus', cx, cy, s);
    const R = Math.min(54, cd.w * 0.16), lx = cd.x + cd.w - R - 16, ly = cd.y + cd.h - R - 16;
    drawLens(c, lx, ly, R, 'platypus', 20, 30, 0);
    pill(c, T[lang].furTag, lx, ly - R - 18);
    if (S.egg) {
      const pe = clamp((performance.now() - S.eggT) / 900, 0, 1), k = backOut(pe), nx = cd.x + cd.w * 0.3, ny = cd.y + cd.h * 0.8;
      c.save(); c.translate(nx, ny); c.scale(0.5 + 0.5 * ease(pe), 0.5 + 0.5 * ease(pe));
      path(c, () => E(c, 0, 10, 62, 20), lg(c, 0, -10, 0, 30, [[0, '#d6b266'], [1, '#7a5a22']]), '#4a3410', 1.5);
      c.strokeStyle = 'rgba(70,45,10,.5)'; c.lineWidth = 1.4; for (let m = 0; m < 14; m++) { c.beginPath(); c.moveTo(-52 + m * 8, 6 + hsh(m, 1) * 8); c.lineTo(-40 + m * 8, 16 + hsh(m, 2) * 8); c.stroke(); }
      [[-16, -6, -0.2], [16, -4, 0.2]].forEach(([x, y, r]) => { c.save(); c.translate(x, y - (1 - k) * 30); c.scale(Math.max(0, k), Math.max(0, k));
        path(c, () => E(c, 0, 0, 15, 20, r), rg(c, -5, -8, 1, 24, [[0, '#fffdf2'], [0.6, '#efe3c0'], [1, '#b8a778']]), '#8a7a4a', 1.2);
        path(c, () => E(c, -5, -9, 4, 6, r), 'rgba(255,255,255,.8)'); c.restore(); });
      c.restore();
      pill(c, T[lang].eggTag, nx, ny - 54);
    }
    return;
  }
  const R = Math.min(cd.w * 0.31, cd.h * 0.3, 130), cx = cd.x + cd.w * 0.58, cy = cd.y + cd.h * 0.48;
  drawLens(c, cx, cy, R, 'leg', 0, 0, 0.7);
  pill(c, T[lang].legTag[0], cd.x + 14, cy - R * 0.55, 'left');
  pill(c, T[lang].legTag[1], cd.x + 14, cy + R * 0.5, 'left');
}
canvasLoop($('cv'), (c, w, h, dt, t) => {
  G.w = w; G.h = h;
  const v = lab.view;
  if (v === 'houses' && !S.sec) return;
  const cd = { x: 10, y: 10, w: w - 20, h: h - 20 }; G.cd = cd; G.lens = null;
  drawCard(c, cd);
  if (S.sec) return secScene(c, cd, t);
  const q = Q[v];
  if (q.pick !== null) q.p = Math.min(1, q.p + dt / 0.9);
  if (q.done) return doneScene(c, cd);
  if (v === 'lens') lensScene(c, cd, dt); else trickScene(c, cd);
});

// --- dragging the magnifier ---------------------------------------------------------------------------------------
const cv = $('cv');
cv.addEventListener('pointerdown', (ev) => {
  if (lab.view !== 'lens' || S.sec || !G.lens) return;
  const r = cv.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  if (Math.hypot(x - G.lens.x, y - G.lens.y) > G.lens.R * 1.15) return;
  S.drag = { x, y }; cv.setPointerCapture(ev.pointerId); ev.preventDefault();
});
cv.addEventListener('pointermove', (ev) => {
  if (!S.drag || !G.lens) return;
  const r = cv.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, cd = G.cd, R = G.lens.R;
  const nfx = clamp(S.fx + (x - S.drag.x) / cd.w, R * 0.5 / cd.w, 1 - R * 0.5 / cd.w), nfy = clamp(S.fy + (y - S.drag.y) / cd.h, R * 0.5 / cd.h, 1 - R * 0.5 / cd.h);
  const m = R / 100;
  S.ox += (nfx - S.fx) * cd.w / m; S.oy += (nfy - S.fy) * cd.h / m;
  S.fx = nfx; S.fy = nfy; S.drag = { x, y };
});
const endDrag = () => { S.drag = null; };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

// --- controls ----------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('skH').addEventListener('click', (ev) => {
  const b = ev.target.closest('.sk-h'); if (!b || b.disabled) return;
  const v = lab.view, q = Q[v];
  if (q.pick !== null || q.done) return;
  const id = SEQ[v][q.i], ok = b.dataset.g === ITEMS[id].g;
  q.pick = b.dataset.g; q.p = 0; q.res[q.i] = ok; (ok ? sfx.good : sfx.bad)();
  setTimeout(showStage, 250); render();
});
$('skNext').addEventListener('click', () => {
  const v = lab.view, q = Q[v], n = SEQ[v].length;
  if (q.done) Q[v] = mkQ();
  else if (q.pick !== null) { if (q.i + 1 >= n) q.done = true; else { q.i++; q.pick = null; q.p = 0; } }
  sfx.click(); newRound(); render();
});
$('skPropChips').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-p]'); if (!b) return;
  S.prop = S.prop === b.dataset.p ? null : b.dataset.p; sfx.tick(); render();
});
$('skSecChips').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-sec]'); if (!b) return;
  if (!secret.unlocked()) return secret.open();
  const k = b.dataset.sec;
  if (S.sec === k) S.sec = null;
  else {
    S.sec = k; S.egg = false; sfx.click();
    if (k === 'a') setTimeout(() => { if (S.sec === 'a') { S.egg = true; S.eggT = performance.now(); sfx.good(); render(); } }, 1800);
    setTimeout(showStage, 150);
  }
  render();
});

// --- one render per change ---------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  const quiz = (v === 'lens' || v === 'trick') && !sec, houses = v === 'houses' && !sec;
  document.body.dataset.v = sec ? 'sec' : v;
  $('skQ').style.display = quiz ? '' : 'none';
  $('skProps').style.display = houses ? '' : 'none';
  cardsEl.style.display = houses ? '' : 'none';
  $('cv').style.display = houses ? 'none' : '';
  const open = secret.unlocked();
  $('skSecChips').innerHTML = [['a', '🥚'], ['b', '🪶']].map(([k, emo]) =>
    `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-sec="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  if (sec) renderSec(t); else if (quiz) renderQuiz(t, v); else renderHouses(t);
}
function renderSec(t) {
  const a = S.sec === 'a';
  $('cv').style.touchAction = 'pan-y';
  lab.setReadout(esc(a ? t.an2.platypus : t.secrets.b[0]), '', '', '#4ea8ff');
  lab.setFacts([]);
  if (a) lab.setState({ emo: '🥚', title: t.pl.t, lead: S.egg ? t.pl.l2 : t.pl.l1, body: S.egg ? t.pl.b2 : '' });
  else lab.setState({ emo: '🪶', title: t.lg.t, lead: t.lg.l, body: t.lg.b });
}
function renderQuiz(t, v) {
  const q = Q[v], seq = SEQ[v], n = seq.length, emo = v === 'lens' ? '🔍' : '🎭';
  $('cv').style.touchAction = v === 'lens' && q.pick === null && !q.done ? 'none' : 'pan-y';
  lab.setFacts(t.facts[v]);
  const score = q.res.filter(Boolean).length;
  const nx = $('skNext');
  if (q.done) {
    const [ti, le, bo] = t.end(score, n);
    $('skH').style.display = 'none';
    nx.textContent = t.again; $('skNextRow').style.display = '';
    lab.setReadout(esc(t.of(score, n)), t.rightSub, '', '#3ddc97');
    lab.setState({ emo: '🏆', title: ti, lead: le, body: bo });
    return;
  }
  const id = seq[q.i], ok = q.pick !== null && q.pick === ITEMS[id].g, gr = ITEMS[id].g;
  $('skH').style.display = '';
  $('skH').innerHTML = GK.map((g) => {
    const cls = q.pick === null ? '' : g === gr ? 'ok' : g === q.pick ? 'bad' : 'dim';
    return `<button class="sk-h ${cls}" data-g="${g}" ${q.pick !== null ? 'disabled' : ''}><span class="e">${GEMO[g]}</span>${esc(t.groups[g])}</button>`;
  }).join('');
  $('skNextRow').style.display = q.pick !== null ? '' : 'none';
  nx.textContent = q.i + 1 >= n ? t.result : t.next;
  if (q.pick === null) {
    const qq = v === 'lens' ? t.q1 : t.q2;
    lab.setReadout(esc(t.of(q.i + 1, n)), `✓ ${score}`, '', '#4ea8ff');
    lab.setState({ emo, title: qq[0], lead: qq[1], body: '' });
  } else {
    lab.setReadout(esc(t.of(q.i + 1, n)), `✓ ${score}`, t.groups[gr], GCOL[gr]);
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.right : t.wrong, lead: `${t.an[id]} → ${t.groups[gr]}`, body: t.clue[id] });
  }
}
function renderHouses(t) {
  $('cv').style.touchAction = 'pan-y';
  const p = S.prop, hit = (g) => !p || HOUSE_PROPS[g].includes(p);
  $('skPropChips').innerHTML = Object.keys(t.props).map((k) => `<button class="chip ${p === k ? 'on' : ''}" data-p="${k}">${esc(t.props[k])}</button>`).join('');
  cardsEl.innerHTML = GK.map((g) => {
    const h = t.houses[g];
    return `<div class="sk-card ${p ? (hit(g) ? 'hit' : 'dim') : ''}" style="border-left:6px solid ${GCOL[g]}"><canvas class="sk-sw" data-t="${HOUSE_TEX[g]}" width="128" height="128"></canvas>
      <div><h3>${GEMO[g]} ${esc(t.groups[g])}</h3><p><b>${esc(t.cardLbl[0])}:</b> ${esc(h[0])}</p><p><b>${esc(t.cardLbl[1])}:</b> ${esc(h[1])}</p><p><b>${esc(t.cardLbl[2])}:</b> ${esc(h[2])}</p></div></div>`;
  }).join('');
  cardsEl.querySelectorAll('canvas.sk-sw').forEach((cvs) => { const c = cvs.getContext('2d'); c.scale(2, 2); drawLens(c, 32, 32, 27, cvs.dataset.t, 0, 0, 0); });
  lab.setReadout(esc(t.hs[0]), '', '', '#4ea8ff');
  lab.setFacts(t.facts.houses);
  if (p) lab.setState({ emo: '🏠', title: t.props[p], lead: t.hsShare(GK.filter(hit).map((g) => t.groups[g]).join(', ')), body: '' });
  else lab.setState({ emo: '🏠', title: t.hs[0], lead: t.hs[1], body: '' });
}
newRound();
render();
