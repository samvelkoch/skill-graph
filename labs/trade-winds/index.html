const rg = (c, x, y, r0, r1, stops) => { const g = c.createRadialGradient(x, y, Math.max(0, r0), x, y, Math.max(0, r1)); for (const [o, col] of stops) g.addColorStop(o, col); return g; };

const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const FONT = '800 12px Nunito, system-ui, sans-serif';
let VW = 0, VH = 0;
function pill(c, txt, x, y, o = {}) { // dark (or parchment) pill with text, clamped inside the canvas
  c.save(); c.font = FONT;
  const w = c.measureText(txt).width + 18, hh = 22, al = o.align || 'c';
  let x0 = al === 'l' ? x : al === 'r' ? x - w : x - w / 2, y0 = y - hh / 2;
  x0 = clamp(x0, 4, Math.max(4, VW - w - 4)); y0 = clamp(y0, 4, Math.max(4, VH - hh - 4));
  c.beginPath(); c.roundRect(x0, y0, w, hh, 11);
  c.fillStyle = o.fill || 'rgba(8,14,24,.82)'; c.fill();
  if (o.stroke) { c.strokeStyle = o.stroke; c.lineWidth = o.lw || 1.2; c.stroke(); }
  c.fillStyle = o.color || '#f3ead2'; c.textBaseline = 'middle'; c.textAlign = 'left';
  c.fillText(txt, x0 + 9, y0 + hh / 2 + .5); c.restore();
  return { x: x0, y: y0, w, h: hh };
}

  for (let i = 0; i < 4; i++) { const cx = ((i * w * .33 + time * 3 + 40) % (w + 160)) - 80, cy = hz * (.25 + .15 * (i % 3)); c.fillStyle = 'rgba(255,255,255,.3)'; c.beginPath(); c.ellipse(cx, cy, Math.max(0, 46), Math.max(0, 7), 0, 0, Math.PI * 2); c.ellipse(cx + 20, cy - 4, Math.max(0, 28), Math.max(0, 6), 0, 0, Math.PI * 2); c.fill(); }
  c.fillStyle = lg(c, 0, hz, 0, h, [[0, '#4a7b8e'], [.3, '#2d5b72'], [1, '#12364a']]); c.fillRect(0, hz, w, h - hz);
  c.fillStyle = 'rgba(255,240,210,.3)'; c.fillRect(0, hz - 1, w, 2);
  for (let i = 0; i < 16; i++) { // glitter column of the sun
    const yy = hz + 6 + i * (h - hz) * .055, ww = 8 + i * 3.2, jx = Math.sin(time * 1.2 + i * 1.9) * (3 + i * .6);
    c.fillStyle = `rgba(255,240,200,${.34 - i * .015})`; c.beginPath(); c.ellipse(sx + jx, yy, Math.max(0, ww), Math.max(0, 1.2), 0, 0, Math.PI * 2); c.fill();
  }
  const sc = clamp(w / 220, 1.4, 2.6), shx = w * .42, wy = hz + (h - hz) * .42;
  const bob = Math.sin(time * .8) * 1.4, tilt = Math.sin(time * .7) * .012;
  c.save(); c.translate(0, 2 * wy + 6); c.scale(1, -1); c.globalAlpha = .2; drawShip(c, shx, wy + bob, sc, 1, -tilt, 0, 1, time, 0, '#ff7a90', 1, 0); c.restore();
  for (let i = 0; i < 3; i++) { const p = ((time * .25 + i / 3) % 1); c.strokeStyle = `rgba(255,255,255,${.3 * (1 - p)})`; c.lineWidth = 1.2; c.beginPath(); c.ellipse(shx, wy + 5 * sc, Math.max(0, 24 * sc * (.6 + p)), Math.max(0, 3 * sc * (.6 + p)), 0, 0, Math.PI * 2); c.stroke(); }
  drawShip(c, shx, wy + bob, sc, 1, tilt, 0, 1, time, 0, '#ff7a90', 1, 0);
  parch(c, T[lang].dayN(Math.floor(S.dold)), 8, 19);
}

// --- controls ------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function startRace(v) { S.race[v] = { ...mkRace(), running: true }; S.dirs = [1, 1, 1]; }
function pick(i) {
  const v = lab.view; if (S.guess[v] !== null) return;
  S.guess[v] = i; sfx.click();
  if (v === 'columbus') { S.u = 0; S.play = true; (i === ANS.columbus ? sfx.good : sfx.bad)(); } else startRace(v);
  showStage(); render();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, v = lab.view;
  if (a === 'opt') return pick(+b.dataset.i);
  if (a === 'again') { if (S.sec === 'a') S.magP = 0; else startRace(v); sfx.click(); }
  else if (a === 'newg') { S.guess[v] = null; S.u = 0; S.play = false; if (S.race[v]) S.race[v] = mkRace(); sfx.click(); }
  else if (a === 'play') { if (S.u >= 1) S.u = 0; S.play = !S.play; sfx.click(); }
  else if (a === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; if (S.sec === 'a') S.magP = 0; if (S.sec === 'b') S.dold = 0; sfx.click();
  }
  render();
});
$('twRng').addEventListener('input', (ev) => { S.u = +ev.target.value / 1000; S.play = false; render(); });

// --- one render per change ---------------------------------------------------------------------------------------
function legIndex(u) { return u < LEGU[0] ? 0 : u < LEGU[1] ? 1 : u < LEGU[2] ? 2 : 3; }
function lastPin(u) { let p = PINS[0]; for (const q of PINS) if (u >= q.u - 1e-6) p = q; return p; }
function render() {
  const t = T[lang], v = lab.view, sec = S.sec, open = secret.unlocked();
  lab.setGlow('rgba(60, 150, 205, .28)');
  const mode = sec || v, pred = !sec && S.guess[v] === null;
  $('twQ').style.display = !sec ? '' : 'none'; $('twOpts').style.display = !sec ? '' : 'none';
  const key = v === 'columbus' ? 'col' : v;
  const A = t.ask[key];
  $('twQ').textContent = A ? A.q : '';
  // options
  let html = '', ver = '', verCol = 'var(--ok)';
  if (!sec) {
    const g = S.guess[v], R = S.race[v], decided = v === 'columbus' ? g !== null : !!R?.won;
    html = A.o.map((lab_, i) => {
      const L = 'ABC'[i], cls = g === null ? '' : decided ? (i === ANS[v] ? 'good' : i === g ? 'bad' : '') : i === g ? 'sel' : '';
      return `<button class="tw-opt ${cls}" data-act="opt" data-i="${i}"${g !== null ? ' disabled' : ''}><b class="tw-l" style="background:${v === 'columbus' ? '#aebbd8' : COL[L]}">${L}</b><span>${esc(lab_)}</span></button>`;
    }).join('');
    if (decided) { ver = g === ANS[v] ? t.right : t.wrong; verCol = g === ANS[v] ? 'var(--ok)' : 'var(--wip)'; }
  }
  $('twOpts').innerHTML = html; $('twVer').textContent = ver; $('twVer').style.color = verCol;
  // timeline
  const col = !sec && v === 'columbus' && S.guess.columbus !== null;
  $('twSl').hidden = !col; $('twPlay').textContent = S.play ? t.act.pause : t.act.play; $('twRng').setAttribute('aria-label', t.act.voyage);
  if (document.activeElement !== $('twRng')) $('twRng').value = Math.round(S.u * 1000);
  // actions
  const acts = [];
  if (sec === 'a') acts.push(['again', t.act.again]);
  else if (!sec && v !== 'columbus' && S.guess[v] !== null) acts.push(['again', t.act.again], ['newg', t.act.newg]);
  else if (!sec && v === 'columbus' && S.guess.columbus !== null) acts.push(['newg', t.act.newg]);
  $('twAct').innerHTML = acts.map(([a, l]) => `<button class="chip" data-act="${a}">${esc(l)}</button>`).join(''); $('twAct').style.display = acts.length ? '' : 'none';
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('twSecRow').innerHTML = sc('a', '🌍') + sc('b', '😶');
  // readout, state card and facts
  let st, ro, facts;
  if (sec === 'a') {
    ro = [String(1519 + Math.round(S.magP * 3)), '', '']; st = { emo: '🌍', title: t.secrets.a[0], lead: t.secrets.a[1], body: t.mag.body }; facts = [t.facts.mag];
  } else if (sec === 'b') {
    ro = [t.dayN(Math.floor(S.dold)), '', '']; st = { emo: '😶', title: t.secrets.b[0], lead: t.secrets.b[1], body: t.dold }; facts = [];
  } else if (v === 'columbus') {
    const g = S.guess.columbus;
    if (g === null) { ro = ['?', '', '']; st = { emo: '🧭', title: A.q, lead: t.predLead, body: '' }; }
    else {
      const p = lastPin(S.u), li = legIndex(S.u);
      ro = [p.d ? t.col.d[p.d] : t.pl[p.n], t.pl[p.n], t.col.legs[li]];
      st = { emo: '⛵', title: t.col.legs[li], lead: t.whyCol, body: p.d ? `${t.pl[p.n]} · ${t.col.d[p.d]}` : t.pl[p.n] };
    }
    facts = [t.facts.columbus];
  } else {
    const g = S.guess[v], R = S.race[v], routes = ROUTES[v];
    const winner = routes.reduce((a, r) => (r.sim.total < a.sim.total ? r : a), routes[0]);
    if (g === null) { ro = ['?', '', '']; st = { emo: '🧭', title: A.q, lead: t.predLead, body: '' }; }
    else {
      const dn = Math.floor(Math.min(R.days, Math.max(...routes.map((r) => r.sim.total))));
      ro = [t.dayN(dn), '', R.won ? t.first(winner.id) : ''];
      if (!R.won) st = { emo: '⛵', title: t.sail, lead: '', body: '' };
      else {
        const list = R.done ? routes.map((r) => `${t.route(r.id)}: ${t.days(Math.round(r.sim.total))}`).join(' · ') : '';
        st = { emo: g === ANS[v] ? '✅' : '🤔', title: g === ANS[v] ? t.right : t.wrong, lead: v === 'out' ? t.whyOut : t.whyHome, body: list, extra: esc(t.model) };
      }
    }
    facts = [t.facts[v]];
  }
  lab.setReadout(ro[0], ro[1], ro[2], '#4ea8ff');
  lab.setState({ extra: '', ...st });
  lab.setFacts(facts);
  S.sig = sigNow();
}
function sigNow() {
  const v = lab.view;
  if (S.sec === 'a') return `a:${Math.round(S.magP * 3)}:${S.magP >= 1}`;
  if (S.sec === 'b') return `b:${Math.floor(S.dold)}`;
  if (v === 'columbus') { const p = lastPin(S.u); return `c:${legIndex(S.u)}:${p.n}:${p.u}`; }
  const R = S.race[v]; return `r:${Math.floor(R.days)}`;
}

canvasLoop($('cv'), (c, w, h, dt, time) => {
  VW = w; VH = h; setProj(w, h);
  const v = lab.view;
  if (S.sec === 'a') drawWorld(c, w, h, dt, time);
  else if (S.sec === 'b') drawDold(c, w, h, dt, time);
  else drawAtlantic(c, w, h, dt, time, v);
  if (sigNow() !== S.sig) render();
});
render();
</script>
</body>
