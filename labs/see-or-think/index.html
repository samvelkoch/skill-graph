  lab.setReadout(`${Math.min(sh.clue + 1, 3)} / 3`, a.clues, sh.results.length ? a.score(n, sh.results.length) : '', '#b79bff');
  const st = last || sh.mode === 'lifting' || sh.mode === 'lifted' ? a.stLast : a.stGuess;
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: '', extra: '' });
}
function shadowAct(act, b) {
  const sh = S.sh;
  if (act === 'pick' && (sh.mode === 'guess')) { sh.guess = +b.dataset.i; sfx.click(); }
  else if (act === 'turn' && sh.mode === 'guess' && sh.guess !== null && sh.clue < 2) {
    sh.gs[sh.clue] = sh.guess; sh.turn = { t0: now(), dur: 1, from: sh.clue, to: sh.clue + 1 }; sh.mode = 'turning'; sfx.push();
    setTimeout(() => { sh.clue++; sh.turn = null; sh.mode = 'guess'; render(); }, 1020);
  } else if (act === 'lift' && sh.mode === 'guess' && sh.guess !== null && sh.clue === 2) {
    sh.gs[2] = sh.guess; sh.mode = 'lifting'; sh.liftTgt = 1; sh.results = [...sh.results, SH[sh.obj].ok === sh.guess]; sfx.snap(); showStage();
    setTimeout(() => { sh.mode = 'lifted'; (SH[sh.obj].ok === sh.guess ? sfx.good : sfx.tick)(); render(); }, 1250);
  } else if (act === 'nextobj' && sh.mode === 'lifted') { S.sh = freshSh(sh.obj < 2 ? sh.obj + 1 : 0, sh.obj < 2 ? sh.results : []); sfx.click(); }
  render();
}

function renderMilk(t) {
  const mk = S.mk, a = t.mk, done = mk.clue >= 5;
  let h = '';
  if (mk.clue === 0) h += `<div class="so-clue"><span class="e">🥛</span><div class="so-card drop">${esc(a.stStart[2])}</div></div>`;
  else h += `<div class="so-step">${esc(a.clueN(mk.clue, 5))}</div><div class="so-clue"><span class="e">${['🐾', '🪟', '🚗', '🐱', '💬'][mk.clue - 1]}</span><div class="so-card drop">${esc(a.clues[mk.clue - 1])}</div></div>`;
  if (mk.clue > 0) h += `<div class="so-step">${esc(mk.tok === null ? a.first : a.q)}</div><div class="so-who">${a.sus.map((s, i) => `<button class="so-big ${mk.tok === i ? 'on' : ''}" data-act="tok" data-i="${i}"><span class="e">${s[2]}</span>${esc(s[0])}</button>`).join('')}</div>`;
  if (done) h += `<p class="so-note">${esc(mk.tok === 1 ? a.finOk : a.finKeep)} ${esc(mk.changes === 0 ? a.chg0 : a.chg(mk.changes))}</p>`;
  const label = done ? '↺ ' + a.again : mk.clue === 0 ? a.start + ' →' : a.next + ' →';
  h += `<button class="so-big go" data-act="mnext"${mk.clue > 0 && !done && mk.tok === null ? ' disabled' : ''}>${esc(label)}</button>`;
  $('vMilk').innerHTML = h;
  lab.setReadout(`${mk.clue} / 5`, a.sub, mk.clue ? a.pill(mk.changes) : '', '#f5c84c');
  const st = mk.clue === 0 ? a.stStart : [a.stClue[0], a.clueN(mk.clue, 5), a.clues[mk.clue - 1]];
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: mk.clue ? a.stClue[2] : '', extra: '' });
}
function placeToken(k) {
  const mk = S.mk;
  if (mk.clue < 1 || mk.tok === k) return;
  if (mk.tok !== null) mk.changes++;
  mk.tok = k; sfx.snap(); render();
}

function hansStatus(t) {
  const hs = S.hans, a = t.hans;
  const q = HQ[Math.min(hs.step, 3)];
  let h = '';
  const ask = (act, label) => `<button class="so-big go" data-act="${act}"${hs.busy ? ' disabled' : ''}>${esc(label)}</button>`;
  let st = a.st0;
  if (hs.step <= 2) {
    h += `<div class="so-step">${esc(a.q(q[0]))}</div>`;
    if (hs.answered) h += `<p class="so-msg ok">${esc(a.right(q[1]))}</p>${ask('hnext', a.next + ' →')}`;
    else h += ask('hask', '🐴 ' + a.ask);
  } else if (hs.step === 3) {
    h += `<div class="so-step">${esc(a.predict)}</div><div class="so-baskets"><button class="so-big ${hs.guess === 'yes' ? 'on' : ''}" data-act="hguess" data-k="yes">${esc(a.yes)}</button><button class="so-big ${hs.guess === 'no' ? 'on' : ''}" data-act="hguess" data-k="no">${esc(a.no)}</button></div>`;
    if (hs.guess) h += ask('hhide', '🎭 ' + a.hide);
    st = a.st1;
  } else {
    st = hs.answered ? a.st2 : a.st1;
    h += `<div class="so-step">${esc(a.q(HQ[3][0]))}</div>`;
    if (hs.answered) h += `<p class="so-msg no">${esc(a.wrong(5))}</p><p class="so-note">${esc(a.end)}</p>`;
  }
  $('vHans').innerHTML = h;
  lab.setReadout('🐴', t.secrets.hans[0], '', '#e0b050');
  lab.setState({ emo: st[0], title: st[1], lead: st[2], body: '', extra: '' });
}
function hansAct(act, b) {
  const hs = S.hans;
  const tap = (n, hidden) => { hs.busy = true; hs.tap = { t0: now(), n, hidden }; setTimeout(() => { hs.busy = false; hs.answered = true; render(); }, (.4 + .5 * n + .7) * 1000); };
  if (act === 'hask' && !hs.busy) { sfx.click(); tap(HQ[hs.step][1], false); }
  else if (act === 'hnext') { hs.step++; hs.answered = false; hs.tap = null; sfx.click(); }
  else if (act === 'hguess') { hs.guess = b.dataset.k; sfx.click(); }
  else if (act === 'hhide' && !hs.busy) { hs.step = 4; hs.answered = false; hs.tap = null; hs.curTgt = 1; hs.busy = true; sfx.push(); setTimeout(() => { hs.busy = false; tap(5, true); }, 1000); }
  render();
}
function renderMoon(t) {
  const a = t.moon, i = S.moon.i;
  $('vMoon').innerHTML = `<div class="so-step">${esc(a.see)}: ${esc(a.seeT[i])}</div>
    <div class="so-opts" style="grid-template-columns:repeat(4,1fr)">${['🌒', '🌓', '🌔', '🌕'].map((e, k) => `<button class="so-big ${i === k ? 'on' : ''}" data-act="moon" data-i="${k}"><span class="e">${e}</span>${esc(a.days[k])}</button>`).join('')}</div>
    <p class="so-note"><b>💭 ${esc(a.think)}:</b> ${esc(a.thinkT)}</p>`;
  lab.setReadout('🌙', a.days[i], '', '#d9c88a');
  lab.setState({ emo: a.st[0], title: a.st[1], lead: a.st[2], body: '', extra: '' });
}

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k;
    if (S.sec === 'hans') S.hans = freshHans();
    if (S.sec) sfx.click();
    render(); if (S.sec) showStage();
    return;
  }
  if (act === 'basket') sortCard(b.dataset.k);
  else if (act === 'story') { const tr = S.tr; if (tr.phase === 'story') tr.story[0] = +b.dataset.i; else tr.story[1] = +b.dataset.i; sfx.click(); render(); }
  else if (act === 'go') {
    const tr = S.tr; sfx.click();
    if (tr.phase === 'next') { tr.strip = 1; tr.idx = 0; tr.phase = 'sort'; tr.tgt[1] = 1; tr.msg = null; tr.msgOk = null; tr.ring = null; }
    else if (tr.phase === 'story' && tr.story[0] !== null) { tr.strip = 2; tr.idx = 0; tr.phase = 'sort'; tr.tgt[2] = 1; tr.msg = null; tr.msgOk = null; tr.ring = null; }
    else if (tr.phase === 'story2') { tr.phase = 'end'; tr.ring = null; (tr.story[1] !== tr.story[0] ? sfx.good : sfx.tick)(); }
    else if (tr.phase === 'end') S.tr = freshTr();
    render(); showStage();
  } else if (['pick', 'turn', 'lift', 'nextobj'].includes(act)) shadowAct(act, b);
  else if (act === 'tok') placeToken(+b.dataset.i);
  else if (act === 'mnext') {
    const mk = S.mk; sfx.click();
    if (mk.clue >= 5) S.mk = freshMk(); else { mk.clue++; showStage(); }
    render();
  } else if (act.startsWith('h')) hansAct(act, b);
  else if (act === 'moon') { S.moon.i = +b.dataset.i; sfx.click(); render(); }
});
$('cv').addEventListener('pointerdown', (ev) => {
  if (S.sec || lab.view !== 'milk' || S.mk.clue < 1) return;
  const r = $('cv').getBoundingClientRect(), x = (ev.clientX - r.left - geo.ox) / geo.s, y = (ev.clientY - r.top - geo.oy) / geo.s;
  const k = SUS_POS.findIndex(([sx, sy]) => Math.hypot(x - sx, y - sy) < 46);
  if (k >= 0) placeToken(k);
});

canvasLoop($('cv'), (c, w, h, dt, time) => {
  if (S.sec === 'hans') drawHans(c, w, h, dt, time);
  else if (S.sec === 'moon') drawMoon(c, w, h, dt, time);
  else if (lab.view === 'tracks') drawTracks(c, w, h, dt, time);
  else if (lab.view === 'shadow') drawShadow(c, w, h, dt, time);
  else drawMilk(c, w, h, dt, time);
});

function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  const on = { vTracks: !sec && v === 'tracks', vShadow: !sec && v === 'shadow', vMilk: !sec && v === 'milk', vHans: sec === 'hans', vMoon: sec === 'moon' };
  for (const [id, show] of Object.entries(on)) $(id).style.display = show ? '' : 'none';
  const open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('secChips').innerHTML = sc('hans', '🐴') + sc('moon', '🌙');
  if (sec === 'hans') hansStatus(t); else if (sec === 'moon') renderMoon(t);
  else if (v === 'tracks') renderTracks(t); else if (v === 'shadow') renderShadow(t); else renderMilk(t);
  lab.setFacts(t.facts[sec === 'hans' ? 'milk' : sec === 'moon' ? 'shadow' : v]);
}
render();
</script>
</body>
</html>
