// --- state ---------------------------------------------------------------------------------------------------
const REL = [0, 1, 2, 0, 1, 2, 0, 1].map((_, i) => [2, 1, 0, 2, 1, 2, 0, 1][i]); // 0 same, 1 more, 2 opposite
const HOT = { 0: { x: 106, y: 121, r: 46 }, 3: { x: 252, y: 40, r: 38 }, 5: { x: 252, y: 124, r: 62 }, 7: { x: 120, y: 112, r: 48 } };
const CLUES = [0, 3, 5, 7];
const ORD = [[1, 0, 2], [0, 2, 1], [2, 0, 1]];
const RELICON = ['🟰', '➕', '🔄'];
const S = { si: 0, pred: null, right: [], end: false, cr: 0, cmiss: 0, cfound: false, cfirst: 0, cend: false, marks: [], fi: 0, fpick: null, fdone: false, fend: false, sec: null, dia: false, look: false, anim: false, artKey: '' };

const lab = shell({ key: 'picture-text', T, topics: TOPICS, views: ['read', 'clue', 'funny'], onLang: render, onView: () => { S.sec = null; S.dia = false; S.look = false; snapFlap(); render(); } });
const secret = secretLab('picture-text', () => ({
  secrets: [{ emo: '🫀', title: T[lang].secrets.a[0], desc: T[lang].secrets.a[1] }, { emo: '🙈', title: T[lang].secrets.b[0], desc: T[lang].secrets.b[1] }],
  questions: T[lang].quiz,
}), () => render());

$('ctrlBody').innerHTML = `

const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function snapFlap() {
  const f = $('ptFlap'); f.classList.add('nt'); f.classList.remove('up'); void f.offsetWidth; f.classList.remove('nt');
}
function setFlap(up) {
  const f = $('ptFlap');
  if (f.classList.contains('up') === up) return;
  if (S.anim) { f.classList.toggle('up', up); return; }
  f.classList.add('nt'); f.classList.toggle('up', up); void f.offsetWidth; f.classList.remove('nt');
}

// --- interactions --------------------------------------------------------------------------------------------
$('ptRels').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-pred]'); if (!b || S.pred !== null || S.end || S.sec) return;
  S.pred = +b.dataset.pred; const ok = S.pred === REL[S.si]; S.right[S.si] = ok;
  S.anim = true; (ok ? sfx.good : sfx.bad)(); render(); showStage();
});
$('ptNext').addEventListener('click', () => {
  sfx.click(); snapFlap();
  if (S.end) { S.si = 0; S.right = []; S.end = false; S.pred = null; } else if (S.si === 7) S.end = true; else { S.si++; S.pred = null; }
  render();
});
$('ptIn').addEventListener('click', (ev) => {
  if (lab.view !== 'clue' || S.sec || S.cfound || S.cend) return;
  const r = $('ptIn').getBoundingClientRect();
  const x = (ev.clientX - r.left) / r.width * 320, y = (ev.clientY - r.top) / r.height * 240, h = HOT[CLUES[S.cr]];
  if (Math.hypot(x - h.x, y - h.y) <= h.r) { S.cfound = true; if (S.cmiss === 0) S.cfirst++; S.anim = false; sfx.good(); } else { S.cmiss++; S.marks.push({ x, y }); sfx.bad(); }
  render();
});
$('ptNext2').addEventListener('click', () => {
  sfx.click();
  if (S.cend) { S.cr = 0; S.cfirst = 0; S.cend = false; } else if (S.cr === 3) S.cend = true; else S.cr++;
  S.cmiss = 0; S.cfound = false; S.marks = []; render();
});
$('ptPicks').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-pk]'); if (!b || S.fdone || S.fend || S.sec) return;
  const k = +b.dataset.pk; S.fpick = k; S.anim = true;
  if (k === S.fi) { S.fdone = true; sfx.good(); } else sfx.bad();
  render(); showStage();
});
$('ptNext3').addEventListener('click', () => {
  sfx.click(); snapFlap();
  if (S.fend) { S.fi = 0; S.fend = false; } else if (S.fi === 2) S.fend = true; else S.fi++;
  S.fpick = null; S.fdone = false; render();
});
$('ptDia').addEventListener('click', () => { S.dia = !S.dia; sfx.click(); render(); });
$('ptLook').addEventListener('click', () => { S.look = !S.look; S.anim = S.look; if (!S.look) snapFlap(); sfx.click(); render(); showStage(); });
$('ptSecs').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-sec]'); if (!b) return;
  if (b.dataset.sec === 'back') { S.sec = null; S.dia = false; S.look = false; snapFlap(); render(); return; }
  if (!secret.unlocked()) return secret.open();
  S.sec = S.sec === b.dataset.sec ? null : b.dataset.sec; S.dia = false; S.look = false; snapFlap(); sfx.click(); render();
});

// --- render --------------------------------------------------------------------------------------------------
const art = (i, t) => ART[i](t);
function render() {
  const t = T[lang], v = lab.view;
  const sec = S.sec;
  $('ptRead').hidden = sec || v !== 'read';
  $('ptClue').hidden = sec || v !== 'clue';
  $('ptFunny').hidden = sec || v !== 'funny';
  $('ptSecA').hidden = sec !== 'a';
  $('ptSecB').hidden = sec !== 'b';
  const st = sec === 'a' ? renderSecA(t) : sec === 'b' ? renderSecB(t) : v === 'read' ? renderRead(t) : v === 'clue' ? renderClue(t) : renderFunny(t);
  lab.setFacts([{ emo: FEMO[v], text: t.facts[v], src: FSRC[v] }]);
  $('ptTxt').innerHTML = st.text; $('ptNo').textContent = st.no || '';
  const key = st.up ? `${st.artKey}:${lang}` : '';
  if (key !== S.artKey) { S.artKey = key; $('ptArt').innerHTML = st.up ? st.art : ''; }
  $('ptOv').innerHTML = st.ov || '';
  $('ptFlapT').textContent = st.flapT || '';
  setFlap(!!st.up);
  const open = secret.unlocked(), chip = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-sec="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('ptSecs').innerHTML = chip('a', '🫀') + chip('b', '🙈') + (sec ? `<button class="chip" data-sec="back">← ${esc(t.views[v].replace(/^\S+\s/, ''))}</button>` : '');
  S.anim = false;
}

function renderRead(t) {
  const i = S.si, r = t.read, rv = S.pred !== null, k = S.right.filter(Boolean).length;
  lab.setGlow('rgba(224, 160, 90, .26)');
  $('ptQ').textContent = S.end ? '' : r.q;
  $('ptRels').innerHTML = [0, 1, 2].map((j) => {
    const cls = rv && !S.end ? `${j === REL[i] ? 'good' : j === S.pred ? 'bad' : ''} ${j === S.pred ? 'pick' : ''}` : '';
    return `<button class="pt-rel ${cls}" data-pred="${j}"${rv || S.end ? ' disabled' : ''}><i>${RELICON[j]}</i>${esc(t.rel[j])}</button>`;
  }).join('');
  $('ptRels').style.display = S.end ? 'none' : '';
  $('ptNext').style.display = rv || S.end ? '' : 'none';
  $('ptNext').textContent = S.end ? r.again : i === 7 ? r.last : r.next;
  if (S.end) {
    lab.setReadout(`${k}/8`, r.endSub, '', '#e0a05a');
    lab.setState({ emo: '🏆', title: r.end(k), lead: r.endLead, body: '', extra: '' });
    return { text: esc(t.theEnd), no: '', up: true, art: art(7, t), artKey: 'a7' };
  }
  if (!rv) {
    lab.setReadout(`${i + 1}/8`, t.page, '', '#e0a05a');
    lab.setState({ emo: '📖', title: r.q, lead: r.lead, body: '', extra: '' });
    return { text: esc(t.sp[i]), no: String(i + 1), up: false, flapT: r.flap };
  }
  lab.setReadout(`${i + 1}/8`, t.page, t.rel[REL[i]], '#e0a05a');
  lab.setState(S.pred === REL[i] ? { emo: '✅', title: r.right, lead: t.why[i], body: '', extra: '' }
    : { emo: '🤔', title: r.wrong(t.rel[S.pred], t.rel[REL[i]]), lead: t.why[i], body: '', extra: '' });
  return { text: esc(t.sp[i]), no: String(i + 1), up: true, art: art(i, t), artKey: 'a' + i };
}

function renderClue(t) {
  const c = t.clue, idx = CLUES[Math.min(S.cr, 3)], h = HOT[idx];
  lab.setGlow('rgba(95, 168, 160, .26)');
  $('ptQ2').textContent = S.cend ? '' : c.q;
  $('ptNext2').style.display = S.cfound || S.cend ? '' : 'none';
  $('ptNext2').textContent = S.cend ? c.again : S.cr === 3 ? c.last : c.next;
  if (S.cend) {
    lab.setReadout(`${S.cfirst}/4`, c.sub, '', '#5fa8a0');
    lab.setState({ emo: '🏆', title: c.end(S.cfirst), lead: c.endLead, body: '', extra: '' });
    return { text: esc(t.theEnd), up: true, art: art(7, t), artKey: 'a7' };
  }
  lab.setReadout(`${S.cr + 1}/4`, c.sub, S.cfound ? '✓' : '', '#5fa8a0');
  let ov = S.marks.map((m) => `<i class="pt-x" style="left:${m.x / 3.2}%;top:${m.y / 2.4}%">✕</i>`).join('');
  if (S.cfound || S.cmiss >= 2) ov += `<svg viewBox="0 0 320 240" preserveAspectRatio="xMidYMid slice"><circle class="pt-ring" cx="${h.x}" cy="${h.y}" r="${Math.max(0, h.r)}" fill="${S.cfound ? 'rgba(255,215,106,.18)' : 'none'}" stroke="#ffd76a" stroke-width="4" ${S.cfound ? '' : 'stroke-dasharray="3 8" stroke-linecap="round"'}/></svg>`;
  if (S.cfound) ov += `<div class="pt-lab">${esc(c.adds)} <b>${esc(c.labs[S.cr])}</b></div>`;
  if (S.cfound) lab.setState({ emo: '✅', title: c.found, lead: `${c.adds} ${c.labs[S.cr]}`, body: t.why[idx], extra: '' });
  else if (S.cmiss) lab.setState({ emo: '🤔', title: c.miss, lead: S.cmiss >= 2 ? c.ring : c.lead, body: '', extra: '' });
  else lab.setState({ emo: '🔍', title: c.q, lead: c.lead, body: '', extra: '' });
  return { text: esc(t.sp[idx]), no: String(idx + 1), up: true, art: art(idx, t), artKey: 'a' + idx, ov };
}

function renderFunny(t) {
  const f = t.funny, fi = S.fi, pk = S.fpick;
  lab.setGlow('rgba(217, 130, 95, .26)');
  $('ptQ3').textContent = S.fend ? '' : f.goalQ[fi];
  $('ptPicks').style.display = S.fend ? 'none' : '';
  $('ptPicks').innerHTML = ORD[fi].map((k, n) => {
    const cls = pk === k ? (S.fdone ? 'good' : 'bad') : '';
    return `<button class="pt-pk ${cls}" data-pk="${k}" aria-label="${'ABC'[n]}"${S.fdone ? ' disabled' : ''}>${DOGS[k]()}<b>${'ABC'[n]}</b></button>`;
  }).join('');
  $('ptNext3').style.display = S.fdone || S.fend ? '' : 'none';
  $('ptNext3').textContent = S.fend ? f.again : fi === 2 ? f.last : f.next;
  if (S.fend) {
    lab.setReadout('3/3', f.sub, '', '#d9825f');
    lab.setState({ emo: '🏆', title: f.endT, lead: f.endL, body: '', extra: '' });
    return { text: esc(f.sent), up: true, art: DOGS[2](), artKey: 'd2' };
  }
  lab.setReadout(`${fi + 1}/3`, f.goalS[fi], '', '#d9825f');
  if (pk === null) {
    lab.setState({ emo: '🐶', title: f.goalQ[fi], lead: f.sent, body: '', extra: '' });
    return { text: esc(f.sent), no: String(fi + 1), up: false, flapT: f.flap };
  }
  lab.setState(S.fdone ? { emo: '✅', title: t.read.right, lead: f.okMsg[fi], body: '', extra: '' }
    : { emo: '🤔', title: f.notThis, lead: f.kind[pk], body: '', extra: '' });
  return { text: esc(f.sent), no: String(fi + 1), up: true, art: DOGS[pk](), artKey: 'd' + pk };
}

function renderSecA(t) {
  const a = t.sa, d = S.dia;
  lab.setGlow('rgba(210, 80, 100, .26)');
  $('ptDia').textContent = d ? a.hide : a.show;
  lab.setReadout(d ? '2/2' : '1/2', a.sub, '', '#e0405a');
  const key = d ? `<div class="pt-key"><span><span class="pt-dot" style="background:#d93a3a"></span>${esc(a.red)}</span><span><span class="pt-dot" style="background:#2f6fd0"></span>${esc(a.blue)}</span></div>` : '';
  lab.setState({ emo: d ? '🫀' : '📝', title: d ? a.t1 : a.t0, lead: d ? a.l1 : a.l0, body: '', extra: key });
  return { text: esc(a.text), no: '', up: true, art: d ? HEART(t) : BLANK(t), artKey: d ? 'heart' : 'blank' };
}

function renderSecB(t) {
  const b = t.sb, lk = S.look, n = lk ? 5 : 2;
  lab.setGlow('rgba(95, 140, 208, .26)');
  $('ptLook').textContent = lk ? b.cover : b.look;
  lab.setReadout(`${n}/5`, b.sub, '', '#5f8fd0');
  const items = b.known.map((x, i) => (i < n ? `<li>✓ ${esc(x)}</li>` : `<li class="no">· ${esc(b.unknown)}</li>`)).join('');
  lab.setState({ emo: lk ? '🖼️' : '📝', title: lk ? b.t1 : b.t0, lead: lk ? b.l1 : b.l0, body: '',
    extra: `<b>${esc(b.meter)}</b><div class="pt-meter"><i style="width:${n * 20}%"></i></div><ul class="pt-known">${items}</ul>` });
  return { text: esc(t.sp[3]), no: '', up: lk, art: art(3, t), artKey: 'a3', flapT: b.look };
}
render();
</script>
