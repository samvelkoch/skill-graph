function chevrons(c, P, phase, flow, n, size, color) {

function updateBottle(dt) {
  const b = S.b;
  if (b.demo) {
    b.demo.t += dt; S.p = demoP(b.demo.t); S.pv = 0;
    if (b.demo.t >= DEMO_LEN) { b.demo = null; S.p = 0; S.pv = 0; endBottleDemo(); }
  } else if (!S.drag) {
    S.pv += (-70 * S.p - 9 * S.pv) * dt; S.p += S.pv * dt;
    if (S.p < -.12) { S.p = -.12; if (S.pv < 0) S.pv = 0; }
    if (Math.abs(S.p) < .002 && Math.abs(S.pv) < .02) { S.p = 0; S.pv = 0; }
  }
  const dp = (S.p - S.lastP) / Math.max(dt, .001); S.lastP = S.p;
  S.flow += (clamp(dp * 1.1, -1.4, 1.4) - S.flow) * Math.min(1, dt * 9);
  S.ph += S.flow * dt * .9;
  if (b.step === 'free' && !b.demo) {
    if (S.p > .6) S.up = true;
    if (S.up && S.p < .2) { S.up = false; S.n++; render(); }

const sprites = {};
function ballSprite(color) {

  const s = 48, cv = document.createElement('canvas'); cv.width = cv.height = s; const g = cv.getContext('2d');
  const gr = g.createRadialGradient(s * .36, s * .32, 2, s / 2, s / 2, s / 2);

}
// 100 balls per jar, mixed; a few are put in the lowest rows so the "swap" is easy to see
function mix(spec, seed, color, spots) {
  const a = [], r = rng(seed);
  for (const [col, n] of spec) for (let i = 0; i < n; i++) a.push(col);
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  for (const k of spots) {
    if (a[k] === color) continue;
    const j = a.findIndex((v, idx) => v === color && !spots.includes(idx));
    if (j >= 0) [a[k], a[j]] = [a[j], a[k]];
  }
  return a;
}

    c.restore();
  }
  if (fl > .96) pill(c, T[lang].sec.area, fcx, fcy - fh / 2 + 22, { size: 15, alpha: ease((fl - .96) / .04), bg: 'rgba(10,12,24,.88)' });
}

// --- secret: breath makes your voice ----------------------------------------------------------------------------
const VPIPE = mkPath([[110, 312], [110, 150], [118, 126], [148, 112], [262, 112]]);
function drawVoice(c, w, h, dt) {
  const k = S.voice, f = lerp(2.2, 7, k), lam = lerp(38, 13, k);
  S.vph += dt * f * Math.PI * 2; S.wph += dt * 60; S.ph += dt * .8;
  const u = Math.max(.3, Math.min((w - 14) / 380, (h - 14) / 330, 1.5)), ox = (w - 380 * u) / 2, oy = (h - 330 * u) / 2;
  c.save(); c.translate(ox, oy); c.scale(u, u); c.lineJoin = 'round'; c.lineCap = 'round';
  // a soft head behind the airway
  let g = c.createLinearGradient(80, 0, 280, 0); g.addColorStop(0, 'rgba(248,213,187,.20)'); g.addColorStop(1, 'rgba(237,184,150,.12)');
  c.fillStyle = g; c.strokeStyle = 'rgba(244,203,174,.45)'; c.lineWidth = 2.5;
  c.beginPath(); c.ellipse(175, 100, 95, 92, 0, 0, Math.PI * 2); c.fill(); c.stroke();
  c.beginPath(); c.rect(88, 170, 96, 160); c.fill();
  c.beginPath(); c.ellipse(272, 86, 13, 10, 0, 0, Math.PI * 2); c.fill(); c.stroke();
  c.fillStyle = '#fff'; c.beginPath(); c.ellipse(234, 64, 6.5, 7.5, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#2B2140'; c.beginPath(); c.arc(236, 65, 3.8, 0, Math.PI * 2); c.fill(); c.fillStyle = '#fff'; c.beginPath(); c.arc(237.2, 63.6, 1.2, 0, Math.PI * 2); c.fill();

  // the airway from the lungs, a widening for the voice box, and the mouth
  const pipe = () => { c.beginPath(); VPIPE.pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); };
  const box = (grow) => { c.beginPath(); c.roundRect(62 - grow, 180 - grow, 96 + grow * 2, 78 + grow * 2, 22 + grow); };
  pipe(); c.lineWidth = 56; c.strokeStyle = '#5D9BD0'; c.stroke(); box(3); c.fillStyle = '#5D9BD0'; c.fill();
  pipe(); c.lineWidth = 50; c.strokeStyle = '#A8D8FF'; c.stroke(); box(0); c.fillStyle = '#A8D8FF'; c.fill();
  pipe(); c.lineWidth = 42; c.strokeStyle = '#222850'; c.stroke(); box(-5); c.fillStyle = '#222850'; c.fill();
  // air moving up
  chevrons(c, VPIPE, S.ph, 1, 9, 7, 'rgba(160,210,255,1)');
  // vocal folds: two pads that wiggle and open and close with the air
  const gap = 9 + 5.5 * Math.sin(S.vph), rip = 3 * Math.sin(S.vph * 2 + 1);
  for (const sd of [-1, 1]) {
    const wx = 110 + sd * 42, tip = 110 + sd * gap / 2;
    g = c.createLinearGradient(wx, 205, tip, 218); g.addColorStop(0, '#E8577E'); g.addColorStop(1, '#FF9EB5');
    c.beginPath(); c.moveTo(wx, 205); c.quadraticCurveTo((wx + tip) / 2, 205 + rip, tip, 217 - rip * .5);
    c.quadraticCurveTo((wx + tip) / 2, 231 - rip, wx, 231); c.closePath();
    c.fillStyle = g; c.fill(); c.lineWidth = 1.8; c.strokeStyle = '#B53A5E'; c.stroke();
    c.strokeStyle = 'rgba(255,255,255,.4)'; c.lineWidth = 1.4; c.beginPath(); c.moveTo(wx - sd * 4, 209); c.quadraticCurveTo((wx + tip) / 2, 208 + rip, tip - sd * 1.5, 217 - rip * .5); c.stroke();
  }
  // lips
  for (const [cy, ry, top] of [[100, 8, 1], [124, 9, 0]]) {
    g = c.createLinearGradient(0, cy - ry, 0, cy + ry); g.addColorStop(0, top ? '#F0606F' : '#E8475A'); g.addColorStop(1, top ? '#C93349' : '#B32D41');
    c.beginPath(); c.ellipse(268, cy, 13, ry, 0, 0, Math.PI * 2); c.fillStyle = g; c.fill(); c.lineWidth = 1.5; c.strokeStyle = '#8F2234'; c.stroke();
    c.fillStyle = 'rgba(255,255,255,.35)'; c.beginPath(); c.ellipse(264, cy - ry * .35, 5, 1.6, 0, 0, Math.PI * 2); c.fill();
  }
  // sound waves leave the mouth; tighter folds make waves that sit closer together
  const R = 92;
  for (let r = lam - (S.wph % lam); r < R; r += lam) {
    if (r < 4) continue;
    c.strokeStyle = `rgba(255,236,190,${(1 - r / R) * .9})`; c.lineWidth = 2.8;
    c.beginPath(); c.arc(284, 112, r, -.95, .95); c.stroke();
  }
  c.restore();
}

// --- pointer: drag the knot -----------------------------------------------------------------------------------
const cv = $('cv'), canDrag = () => lab.view === 'bottle' && !S.sec && S.b.step === 'free' && !S.b.demo;
const locate = (ev) => { const r = cv.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; };
cv.addEventListener('pointerdown', (ev) => {
  if (!canDrag() || !S.geo) return;
  const [x, y] = locate(ev), g = S.geo, ky = g.ty + (232 + 60 * S.p) * g.u;
  if (!(Math.hypot(x - g.bx, y - ky) < 48 || (Math.abs(x - g.bx) < 72 * g.u && y > g.ty + 210 * g.u))) return;
  S.drag = true; S.dragOff = ky - y; S.pv = 0;
  try { cv.setPointerCapture(ev.pointerId); } catch { /* not capturable */ }
  ev.preventDefault(); sfx.push();
});
cv.addEventListener('pointermove', (ev) => {
  if (!S.drag || !S.geo) return;
  const [, y] = locate(ev), g = S.geo;
  S.p = clamp((y + S.dragOff - (g.ty + 232 * g.u)) / (60 * g.u), 0, 1); S.pv = 0;
});
const endDrag = () => { S.drag = false; };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

// --- the loop --------------------------------------------------------------------------------------------------
canvasLoop(cv, (c, w, h, dt, time) => {
  W = w; H = h;
  const v = lab.view;
  if (v === 'bottle') {
    if (S.sec === 'sacs') drawSacs(c, w, h, dt);
    else if (S.sec === 'voice') drawVoice(c, w, h, dt);
    else { updateBottle(dt); drawBottleScene(c, w, h, dt, time); }
  } else if (v === 'air') drawAir(c, w, h, dt, time);
  else drawTubes(c, w, h, dt, time);
});

// --- controls --------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, i = +b.dataset.i;
  if (act === 'b1') { S.b.pick[0] = i; S.b.step = 'r1'; S.b.demo = { t: 0 }; showStage(); }
  else if (act === 'bnext') { S.b.step = 'q2'; sfx.click(); }
  else if (act === 'b2') { S.b.pick[1] = i; S.b.step = 'r2'; S.b.demo = { t: 0 }; showStage(); }
  else if (act === 'a1') { S.a.pick = i; S.a.t = 0; showStage(); }
  else if (act === 'act') { S.a.act = i; sfx.tick(); }
  else if (act === 't1') { S.t.pick[0] = i; S.t.step = 'r1'; S.t.demo = { kind: 'bite', t: 0 }; showStage(); }
  else if (act === 'tnext') { S.t.step = 'q2'; sfx.click(); }
  else if (act === 't2') { S.t.pick[1] = i; S.t.step = 'r2'; S.t.demo = { kind: 'air', t: 0 }; showStage(); }
  else if (act === 'replay') { S.t.demo = { kind: b.dataset.k, t: 0 }; sfx.click(); showStage(); }
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k;
    S.sec = S.sec === k ? null : k; S.drag = false;
    if (S.sec === 'sacs') { S.unfGo = false; S.unf = 0; S.zoom = 0; }
    sfx.click(); showStage();
  } else if (act === 'unfold') { S.unfGo = true; sfx.click(); }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id !== 'vSl') return;
  S.voice = clamp(+ev.target.value / 100, 0, 1); readout();
});

// --- one render per change: controls, readout and the state card -----------------------------------------------
const opts = (arr, pick, ok, done, act) => arr.map((o, i) => {
  let cls = 'qo' + (pick === i ? ' pick' : '');
  if (done) { if (i === ok) cls += ' good'; else if (i === pick) cls += ' bad'; }
  return `<button class="${cls}" data-act="${act}" data-i="${i}"${pick !== null ? ' disabled' : ''}>${esc(o)}</button>`;
}).join('');
const fb = (t, good, text) => `<div class="fb ${good ? 'ok' : 'no'}"><b>${esc(good ? t.right : t.wrong)}</b>${esc(text)}</div>`;
const chip = (t, k, emo) => { const open = secret.unlocked(); return `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`; };

function htmlBottle(t) {
  const b = S.b, tt = t.b, chips = `<div class="row2"><div class="chips">${chip(t, 'sacs', '🫧')}${chip(t, 'voice', '🎵')}</div></div>`;
  if (S.sec === 'sacs') return `<div class="row2" style="margin-top:0"><button class="btn" data-act="unfold"${S.unfGo ? ' disabled' : ''}>${esc(t.sec.unfold)}</button></div>${chips}`;
  if (S.sec === 'voice') return `<div class="ends"><span>${esc(t.sec.loose)}</span><span>${esc(t.sec.tight)}</span></div>
    <input class="big" id="vSl" type="range" min="0" max="100" value="${Math.round(S.voice * 100)}" aria-label="${esc(t.sec.tight)} / ${esc(t.sec.loose)}" style="--track: linear-gradient(90deg, #5FA8FF, #FF9F5A)">${chips}`;
  let h;
  if (b.step === 'q1' || b.step === 'r1') {
    h = `<div class="q">${esc(tt.q1)}</div><div class="qopts">${opts(tt.o1, b.pick[0], 0, b.done[0], 'b1')}</div>`;
    if (b.done[0]) h += fb(t, b.pick[0] === 0, tt.r1) + `<button class="btn nx" data-act="bnext">${esc(t.next)}</button>`;
  } else {
    h = `<div class="q">${esc(tt.q2)}</div><div class="qopts">${opts(tt.o2, b.pick[1], 0, b.done[1], 'b2')}</div>`;
    if (b.done[1]) h += fb(t, b.pick[1] === 0, tt.r2) + `<p class="hint">${esc(tt.drag)}</p>`;
  }
  return h + chips;
}
function htmlAir(t) {
  const a = S.a, ta = t.a, g = ta.gases;
  let h = `<div class="q">${esc(ta.q)}</div><div class="qopts">${opts(ta.o, a.pick, 1, a.done, 'a1')}</div>`;
  if (a.done) h += fb(t, a.pick === 1, ta.r);
  if (a.done) h += `<div class="legend">${[['n', C.n], ['o', C.o], ['c', C.c], ['x', C.x]].map(([k, col]) => `<span><i style="background:${col}"></i>${esc(g[k])}</span>`).join('')}</div>`;
  if (a.done) h += `<div class="card seg small act">${ta.act.map((l, i) => `<button class="${i === a.act ? 'on' : ''}" data-act="act" data-i="${i}">${esc(l)}</button>`).join('')}</div><p class="hint">${esc(ta.actText)}</p>`;
  return h;
}
function htmlTubes(t) {
  const x = S.t, tt = t.t;
  let h;
  if (x.step === 'q1' || x.step === 'r1') {
    h = `<div class="q">${esc(tt.q1)}</div><div class="qopts">${opts(tt.o1, x.pick[0], 1, x.done[0], 't1')}</div>`;
    if (x.done[0]) h += fb(t, x.pick[0] === 1, tt.r1) + `<button class="btn nx" data-act="tnext">${esc(t.next)}</button>`;
  } else {
    h = `<div class="q">${esc(tt.q2)}</div><div class="qopts">${opts(tt.o2, x.pick[1], 1, x.done[1], 't2')}</div>`;
    if (x.done[1]) h += fb(t, x.pick[1] === 1, tt.r2) + `<div class="row2"><button class="chip sbtn" data-act="replay" data-k="bite" aria-label="🍞">🍞</button><button class="chip sbtn" data-act="replay" data-k="air" aria-label="💨">💨</button></div>`;
  }
  return h;
}

function stateCard(t) {
  if (lab.view === 'bottle' && S.sec === 'sacs') return { emo: '🫧', title: t.secrets.sacs[0], lead: t.sec.sacsText };
  if (lab.view === 'bottle' && S.sec === 'voice') return { emo: '🎵', title: t.secrets.voice[0], lead: t.sec.voiceText };
  const v = lab.view, done = v === 'bottle' ? S.b.done[0] : v === 'air' ? S.a.done : S.t.done[0];
  const [emo, title, lead] = t.st[v === 'bottle' ? 'b' : v === 'air' ? 'a' : 't'][done ? 1 : 0];
  return { emo, title, lead };
}
function readout() {
  const t = T[lang], v = lab.view;
  if (v === 'bottle') {
    if (S.sec === 'sacs') lab.setReadout('🫧', '', '', '#FF9EB5');
    else if (S.sec === 'voice') lab.setReadout('♪'.repeat(1 + Math.round(S.voice * 2)), '', '', '#FF9F5A');
    else lab.setReadout(esc(t.b.breaths(S.n)), '', '', '#E8577E');
  } else if (v === 'air') {
    const a = S.a;
    lab.setReadout(a.done ? ['🧍', '🚶', '🏃'][a.act] : '?', a.done ? t.a.bpm(BPM[a.act]) : '', '', '#5FA8FF');
  } else lab.setReadout(`${S.t.done.filter(Boolean).length}/2`, '', '', '#A8D8FF');
}
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  document.body.toggleAttribute('data-drag', canDrag());
  lab.setGlow(v === 'bottle' ? 'rgba(232, 87, 126, .24)' : v === 'air' ? 'rgba(95, 168, 255, .26)' : 'rgba(168, 216, 255, .22)');
  $('ctrlBody').innerHTML = v === 'bottle' ? htmlBottle(t) : v === 'air' ? htmlAir(t) : htmlTubes(t);
  readout();
  lab.setState({ ...stateCard(t), body: '', extra: v === 'air' && S.a.done ? `<div class="fine">${esc(t.fine)}</div>` : '' });
}
render();
</script>
</body>
