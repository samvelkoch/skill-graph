// --- the fold engine ---------------------------------------------------------------------------------------
// A net is a list of flat faces. Each face hangs on its parent along a shared edge (the hinge) and turns up by
// `t * ang` around it, in its parent's frame. The faces of a folded net are found by applying the hinges from the
// face itself up to the root. Nothing about "does it close" is stored: it is computed from where the faces land.
// ENGINE START
const sm = (x) => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const EPS = 1e-6;
const HALF = Math.PI / 2;

function hingeOf(par, ch) {
  const same = (a, b) => Math.abs(a[0] - b[0]) < EPS && Math.abs(a[1] - b[1]) < EPS;
  const n = ch.poly.length, m = par.poly.length;
  for (let i = 0; i < n; i++) {
    const A = ch.poly[i], B = ch.poly[(i + 1) % n];
    for (let j = 0; j < m; j++) {
      const C = par.poly[j], D = par.poly[(j + 1) % m];
      if ((same(A, C) && same(B, D)) || (same(A, D) && same(B, C))) {
        // unit direction pointing from the hinge into the child; the axis u turns that direction up (+z)
        const ex = B[0] - A[0], ey = B[1] - A[1], el = Math.hypot(ex, ey), dx = ex / el, dy = ey / el;
        let nx = ch.cx - (A[0] + B[0]) / 2, ny = ch.cy - (A[1] + B[1]) / 2;
        const k = nx * dx + ny * dy; nx -= k * dx; ny -= k * dy;
        const nl = Math.hypot(nx, ny); nx /= nl; ny /= nl;
        return { A, u: [ny, -nx], ang: ch.ang };
      }
    }
  }
  throw new Error('faces share no edge');
}
// turn point p about the hinge by th (Rodrigues; the axis lies in the floor plane)
function rot(p, h, th) {
  const x = p[0] - h.A[0], y = p[1] - h.A[1], z = p[2], [ux, uy] = h.u, c = Math.cos(th), s = Math.sin(th), d = ux * x + uy * y;
  return [h.A[0] + x * c + uy * z * s + ux * d * (1 - c), h.A[1] + y * c - ux * z * s + uy * d * (1 - c), z * c + (ux * y - uy * x) * s];
}
function foldPoint(net, i, p, t) {
  let q = p;
  for (const h of net.faces[i].chain) q = rot(q, h, t * h.ang);
  return q;
}
// faces: [{ poly: [[x, y], ...], kind, par, ang }]; par = -1 for the root
function finishNet(faces, root) {
  for (const f of faces) {
    f.cx = f.poly.reduce((a, p) => a + p[0], 0) / f.poly.length;
    f.cy = f.poly.reduce((a, p) => a + p[1], 0) / f.poly.length;
    const [p0, p1, p2] = f.poly;
    f.sgn = Math.sign((p1[0] - p0[0]) * (p2[1] - p0[1]) - (p1[1] - p0[1]) * (p2[0] - p0[0])) || 1;
  }
  faces.forEach((f) => { if (f.par >= 0) f.hinge = hingeOf(faces[f.par], f); });
  faces.forEach((f, i) => { f.chain = []; for (let j = i; faces[j].par >= 0; j = faces[j].par) f.chain.push(faces[j].hinge); });
  const net = { faces, root }, xs = faces.flatMap((f) => f.poly.map((p) => p[0])), ys = faces.flatMap((f) => f.poly.map((p) => p[1]));
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const F = faces.flatMap((f, i) => f.poly.map((p) => foldPoint(net, i, [p[0], p[1], 0], 1)));
  const sp = (k) => Math.max(...F.map((p) => p[k])) - Math.min(...F.map((p) => p[k]));
  net.L = { cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, fw: x1 - x0, fh: y1 - y0, fd: Math.hypot(sp(0), sp(1), sp(2)) };
  return net;
}
// a net made of unit squares on a grid: cells = [[col, row], ...]; the face list keeps the order of the cells
function cellNet(cells, rootIdx = 0) {
  const key = (c, r) => `${c},${r}`, at = new Map(cells.map(([c, r], i) => [key(c, r), i]));
  const faces = cells.map(([c, r]) => ({ poly: [[c, r], [c + 1, r], [c + 1, r + 1], [c, r + 1]], kind: 'square', par: -1, ang: HALF }));
  const seen = new Set([rootIdx]), queue = [rootIdx];
  while (queue.length) {
    const i = queue.shift(), [c, r] = cells[i];
    for (const [dc, dr] of [[1, 0], [0, 1], [-1, 0], [0, -1]]) {
      const j = at.get(key(c + dc, r + dr));
      if (j === undefined || seen.has(j)) continue;
      seen.add(j); faces[j].par = i; queue.push(j);

}
// Where the faces of a net of squares land at t = 1. It closes into a cube iff the six centres are six different
// points; faces that share a centre overlap, and the cube sides nobody covers are the holes.
const centreKey = (p) => p.map((v) => Math.round(v * 2)).join(',');

  keys.forEach((k) => count.set(k, (count.get(k) || 0) + 1));
  const r = net.faces[net.root], C = [r.cx, r.cy, 0.5], missing = [], opp = [];
  for (let a = 0; a < 3; a++) for (const sg of [-1, 1]) {
    const p = [...C]; p[a] += sg * 0.5;
    if (count.has(centreKey(p))) continue;
    const [b, c] = [0, 1, 2].filter((k) => k !== a);
    missing.push([[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([i, j]) => { const q = [...p]; q[b] += i * 0.5; q[c] += j * 0.5; return q; }));
  }
  cen.forEach((p, i) => { opp[i] = keys.indexOf(centreKey(p.map((v, k) => 2 * C[k] - v))); });
  return { valid: count.size === net.faces.length, dup: new Set(keys.map((k, i) => (count.get(k) > 1 ? i : -1)).filter((i) => i >= 0)), missing, opp };
}
// ENGINE END
const analysis = (net) => (net.an ??= analyze(net));

// start the current scene from its beginning

  else if (m === 'dice') Object.assign(S.d, { mode: 'edit', res: '' }), A.p = A.to = 0;

const showStage = () => { // on a phone the controls sit below the stage: bring the reveal into view

// --- drawing helpers -----------------------------------------------------------------------------------------

const inside = (x, y, pts) => { // point in polygon

// the 5 x 5 grid of the "make your own net" secret
function drawGrid(c, w, h) {

// --- the loop ------------------------------------------------------------------------------------------------
const wrapPi = (a) => a - 2 * Math.PI * Math.round(a / (2 * Math.PI));
let ptr = null;

  const d = A.to - A.p, step = dt / 1.6; // 1.6 s from flat to folded
  A.p = Math.abs(d) <= step ? A.to : A.p + Math.sign(d) * step;
  if (A.p === A.to && A.cb) { const f = A.cb; A.cb = null; f(); }

  else cam.yaw = wrapPi(cam.yaw) * Math.exp(-dt * 6);

  if (m === 'fold') {
    const F = S.f, net = FNETS[F.order[F.r]];
    drawNet(c, w, h, net, t, time, { cell: true, hits: true, fill: () => FACE, flash: A.p >= 1 && F.ans !== null });
  } else if (m === 'opposite') {
    const O = S.o, { net, red } = OPP[O.r], opp = O.checked ? analysis(net).opp[red] : -1;
    drawNet(c, w, h, net, t, time, { cell: true, hits: true, fill: (i) => (i === red ? RED : FACE),
      outline: (i) => (O.checked && i === opp ? { c: GREEN, w: 4 } : i === O.sel ? { c: BLUE, w: 4 } : null) });
  } else if (m === 'build') {
    if (S.b.mode === 'edit') drawGrid(c, w, h);

  } else if (m === 'dice') {
    drawNet(c, w, h, DICE_NET, t, time, { cell: true, hits: true, fill: () => IVORY, pips: (i) => S.d.nums[i] });
  } else {

    else if (sol.id === 'cone') drawCone(c, w, h, u);

  }
});

// --- touch: tap a face or a cell; drag to turn a folded solid --------------------------------------------------
const turnable = () => sm(A.p) > 0.02;
$('cv').addEventListener('pointerdown', (ev) => { $('cv').setPointerCapture?.(ev.pointerId); ptr = { x: ev.clientX, y: ev.clientY, last: ev.clientX, moved: false }; });
$('cv').addEventListener('pointermove', (ev) => {
  if (!ptr) return;
  if (Math.abs(ev.clientX - ptr.x) > 6) ptr.moved = true;
  if (ptr.moved && turnable()) { cam.yaw += (ev.clientX - ptr.last) * 0.012; cam.hold = performance.now(); }
  ptr.last = ev.clientX;

  tap(ev.clientX - r.left, ev.clientY - r.top);

  if (m === 'opposite' && !S.o.checked && hit !== undefined && hit !== OPP[S.o.r].red) { S.o.sel = hit; sfx.tick(); render(); }
  else if (m === 'dice' && S.d.mode === 'edit' && hit !== undefined) {

    else if (here) { D.sel = here; D.nums[hit] = 0; sfx.tick(); }

    else if (S.b.cells.size < 6) { S.b.cells.add(k); sfx.click(); }

}

// --- controls ------------------------------------------------------------------------------------------------
const connected = (cells) => { // are the cells one piece, touching at edges?
  const set = new Set(cells.map(([c, r]) => `${c},${r}`)), seen = new Set([`${cells[0][0]},${cells[0][1]}`]), queue = [cells[0]];
  while (queue.length) {
    const [c, r] = queue.shift();
    for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const k = `${c + dc},${r + dr}`;
      if (set.has(k) && !seen.has(k)) { seen.add(k); queue.push([c + dc, r + dr]); }
    }
  }
  return seen.size === cells.length;
};
// the same net turned or flipped is the same net: the smallest of the 8 spellings names the class
const canon = (cells) => [(c, r) => [c, r], (c, r) => [-c, r], (c, r) => [c, -r], (c, r) => [-c, -r], (c, r) => [r, c], (c, r) => [-r, c], (c, r) => [r, -c], (c, r) => [-r, -c]]
  .map((f) => { const p = cells.map(([c, r]) => f(c, r)), x0 = Math.min(...p.map((q) => q[0])), y0 = Math.min(...p.map((q) => q[1]));
    return p.map(([c, r]) => [c - x0, r - y0]).sort((a, b) => a[1] - b[1] || a[0] - b[0]).join(';'); }).sort()[0];

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, k = b.dataset.k, t = T[lang];
  if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k; sfx.click(); enter(); return;
  }
  if (act === 'yes' || act === 'no') { // view 1: the answer, then the fold
    const F = S.f, net = FNETS[F.order[F.r]];
    if (F.ans !== null) return;
    F.ans = act; F.done = false; sfx.click();
    go(1, () => { F.done = true; ((act === 'yes') === analysis(net).valid ? sfx.good : sfx.bad)(); render(); });
    showStage();
  } else if (act === 'check' && lab.view === 'opposite' && !S.sec) {
    const O = S.o; if (O.sel === null || O.checked) return;
    O.checked = true; O.done = false; sfx.click();
    go(1, () => { O.done = true; (O.sel === analysis(OPP[O.r].net).opp[OPP[O.r].red] ? sfx.good : sfx.bad)(); render(); });
    showStage();
  } else if (act === 'check') { // view 3, step 2
    const Z = S.s, sol = solid(); if (!Z.picks.size || Z.checked) return;
    const pick = [...Z.picks].sort().join(), ok = sol.ok.some((set) => [...set].sort().join() === pick);
    Z.checked = true; Z.done = false; Z.ok = ok; sfx.click();
    const finish = () => { Z.done = true; (ok ? sfx.good : sfx.bad)(); render(); };
    if (sol.id === 'sphere') { Z.shakeAt = performance.now() / 1000; setTimeout(finish, 800); } else go(0, finish);
    showStage();
  } else if (act === 'next') {
    if (lab.view === 'fold') { const F = S.f; F.r++; if (F.r >= 8) { F.r = 0; F.order = shuffle([0, 1, 2, 3, 4, 5, 6, 7]); } }
    else if (lab.view === 'opposite') S.o.r = (S.o.r + 1) % OPP.length;
    else { const Z = S.s; Z.r = (Z.r + 1) % 7; if (!Z.r) shuffle(Z.order); }
    sfx.click(); enter(); return;
  } else if (act === 'toggle') { go(A.to === 1 ? 0 : 1); sfx.click(); }
  else if (act === 'name') { // view 3, step 1
    if (+k === 1) { S.s.step = 2; S.s.bad = -1; sfx.good(); } else { S.s.bad = +k; sfx.bad(); }
  } else if (act === 'flat') {
    const P = S.s.picks;
    if (S.s.checked) return;
    if (k === 'none') { const had = P.has('none'); P.clear(); if (!had) P.add('none'); }
    else { P.delete('none'); if (P.has(k)) P.delete(k); else P.add(k); }
    sfx.tick();
  } else if (act === 'bgo') { // secret: build your own net
    const B = S.b;
    if (B.mode === 'fold') { go(0, () => { B.mode = 'edit'; B.msg = ''; render(); }); sfx.click(); }
    else {
      const cells = [...B.cells].map((s) => s.split(',').map(Number)).sort((p, q) => p[1] - q[1] || p[0] - q[0]);
      if (cells.length !== 6 || !connected(cells)) { B.msg = t.sec.notSix; sfx.bad(); }
      else {
        B.net = cellNet(cells); B.mode = 'fold'; B.msg = ''; sfx.click(); A.p = 0;
        go(1, () => {
          if (analysis(B.net).valid) {
            const found = store.get('nets:found', []), key = canon(cells);
            if (!found.includes(key)) { found.push(key); store.set('nets:found', found); }
            B.msg = t.sec.found(found.length); sfx.good();
          } else { B.msg = t.f.overlap; sfx.bad(); }
          render();
        });
        showStage();
      }
    }
  } else if (act === 'bclear') { S.b.cells.clear(); S.b.msg = ''; sfx.click(); }
  else if (act === 'dnum') { // secret: a die
    const D = S.d, n = +k;
    if (D.mode !== 'edit') return;
    const at = D.nums.indexOf(n); if (at >= 0) D.nums[at] = 0;
    D.sel = n; sfx.tick();
  } else if (act === 'dgo') {
    const D = S.d;
    if (D.mode === 'fold') { go(0, () => { D.mode = 'edit'; D.res = ''; render(); }); sfx.click(); }
    else if (D.nums.every(Boolean)) {
      D.mode = 'fold'; D.res = ''; sfx.click();
      go(1, () => {
        const opp = analysis(DICE_NET).opp, bad = [];
        D.nums.forEach((n, i) => { if (i < opp[i] && n + D.nums[opp[i]] !== 7) bad.push(`${n}–${D.nums[opp[i]]}`); });
        D.res = bad.length ? t.sec.diceWrong(bad.join(', ')) : t.sec.diceRight; D.bad = bad.length > 0;
        (bad.length ? sfx.bad : sfx.good)(); render();
      });
      showStage();
    }
  }
  render();
});

// --- render: controls, readout and the state card, once per change -----------------------------------------------
const verdict = (ok, head, line) => `<p class="verd ${ok ? 'good' : 'bad'}">${esc(head)}</p><p class="note">${esc(line)}</p>`;
const foldRow = (t, next = true) => `<div class="row2"><button class="chip" data-act="toggle">${esc(A.to === 1 ? t.unfold : t.foldBtn)}</button>${next ? `<button class="btn push" data-act="next">${esc(t.next)}</button>` : ''}</div>`;

function render() {
  const t = T[lang], m = mode(), v = lab.view;
  lab.setGlow('rgba(95, 150, 220, .26)');
  let html = '';
  if (m === 'fold') html = ctrlFold(t);
  else if (m === 'opposite') html = ctrlOpp(t);
  else if (m === 'solids') html = ctrlSolids(t);
  else if (m === 'build') html = ctrlBuild(t);
  else html = ctrlDice(t);
  if (v === 'fold') {
    const open = secret.unlocked();
    const chip = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
    html += `<div class="row2"><div class="chips">${chip('build', '✏️')}${chip('dice', '🎲')}</div></div>`;
  }
  $('ctrlBody').innerHTML = html;
  const card = m === 'build' ? ['✏️', t.secrets.build[0], t.secrets.build[1], ''] : m === 'dice' ? ['🎲', t.secrets.dice[0], t.secrets.dice[1], ''] : t.card[m];
  lab.setState({ emo: card[0], title: card[1], lead: card[2], body: card[3], extra: `<div class="fine">${esc(t.fine)}</div>` });
}

function ctrlFold(t) {
  const F = S.f, net = FNETS[F.order[F.r]], q = t.f;
  lab.setReadout('6 □', q.faces, '', '#7aa2e0');
  const btn = (k, label) => `<button class="btn ${F.ans === k ? 'on' : F.ans ? 'ghost' : ''}" data-act="${k}"${F.ans ? ' disabled' : ''}>${esc(label)}</button>`;
  const ask = `<p class="q">${esc(q.q)}</p><div class="opts">${btn('yes', q.yes)}${btn('no', q.no)}</div>`;
  if (!F.done) return ask;
  const valid = analysis(net).valid, ok = (F.ans === 'yes') === valid;
  return verdict(ok, ok ? q.right : q.wrong, valid ? q.folds : q.overlap) + foldRow(t);
}
function ctrlOpp(t) {
  const O = S.o, o = t.o, { net, red } = OPP[O.r];
  lab.setReadout('6 □', t.f.faces, '', '#7aa2e0');
  const hint = `<p class="note" style="margin-top:10px">${esc(o.hint)}</p>`;
  if (!O.checked) return `<p class="q">${esc(o.q)}</p><button class="btn" data-act="check"${O.sel === null ? ' disabled' : ''}>${esc(t.check)}</button>${hint}`;
  if (!O.done) return `<p class="q">${esc(o.q)}</p>${hint}`;
  const ok = O.sel === analysis(net).opp[red];
  return verdict(ok, ok ? o.right : o.wrong, '') + foldRow(t) + hint;
}
function ctrlSolids(t) {
  const Z = S.s, sol = solid(), q = t.s, name = q.names[sol.id], opts = q.opts[sol.id];
  const flatNames = ['square', 'rectangle', 'circle', 'triangle'].map((k) => q.flat[k]);
  if (Z.step === 1) {
    lab.setReadout('?', '', '', '#7aa2e0');
    const btns = Z.perm.map((k) => `<button class="nm ${Z.bad === k ? 'bad' : ''}" data-act="name" data-k="${k}">${esc(opts[k])}</button>`).join('');
    const trap = Z.bad >= 0 && flatNames.includes(opts[Z.bad]) ? `<p class="note" style="margin-top:10px">${esc(q.flatTrap)}</p>` : '';
    return `<p class="q">${esc(q.q1)}</p><div class="opts">${btns}</div>${trap}`;
  }
  const chips = ['square', 'rectangle', 'circle', 'triangle', 'none'].map((k) =>
    `<button class="chip pick ${Z.picks.has(k) ? 'on' : ''}" data-act="flat" data-k="${k}"${Z.checked ? ' disabled' : ''}>${esc(q.flat[k])}</button>`).join('');
  if (!Z.done) {
    lab.setReadout(esc(name), '', '', '#7aa2e0');
    return `<p class="q">${esc(q.q2)}</p><div class="chips">${chips}</div><div class="row2"><button class="btn" data-act="check"${Z.picks.size && !Z.checked ? '' : ' disabled'}>${esc(t.check)}</button></div>`;
  }
  lab.setReadout(esc(name), q.counts(sol.f, sol.e, sol.v), '', '#7aa2e0');
  const more = sol.id === 'cylinder' ? q.curved : sol.id === 'cone' ? q.curvedCone : sol.id === 'sphere' ? q.sphere : '';
  return verdict(Z.ok, Z.ok ? q.right : q.wrong, more) + (sol.id === 'sphere' ? `<div class="row2"><button class="btn push" data-act="next">${esc(t.next)}</button></div>` : foldRow(t)) +
    `<div class="chips" style="margin-top:10px">${chips}</div>`;
}
function ctrlBuild(t) {
  const B = S.b, n = B.cells.size, s = t.sec;
  lab.setReadout(`${n} □`, t.f.faces, '', '#7aa2e0');
  const msg = B.msg ? `<p class="verd ${B.mode === 'fold' && B.msg === t.f.overlap ? 'bad' : B.mode === 'fold' ? 'good' : 'bad'}">${esc(B.msg)}</p>` : `<p class="note">${esc(s.tap)}</p>`;
  return `${msg}<div class="row2"><button class="btn" data-act="bgo">${esc(B.mode === 'fold' ? t.unfold : t.foldBtn)}</button>${B.mode === 'edit' ? `<button class="chip" data-act="bclear">${esc(t.clear)}</button>` : ''}</div>`;
}
function ctrlDice(t) {
  const D = S.d, s = t.sec;
  lab.setReadout('6 □', t.f.faces, '', '#7aa2e0');
  const nums = [1, 2, 3, 4, 5, 6].map((n) => `<button class="chip num ${D.nums.includes(n) ? 'used' : ''} ${D.sel === n ? 'on' : ''}" data-act="dnum" data-k="${n}"${D.mode === 'edit' ? '' : ' disabled'}>${n}</button>`).join('');
  const msg = D.res ? `<p class="verd ${D.bad ? 'bad' : 'good'}">${esc(D.res)}</p>` : `<p class="note">${esc(s.diceTap)}</p>`;
  return `${msg}<div class="chips">${nums}</div><div class="row2"><button class="btn" data-act="dgo"${D.mode === 'edit' && !D.nums.every(Boolean) ? ' disabled' : ''}>${esc(D.mode === 'fold' ? t.unfold : t.foldBtn)}</button></div>`;
}
render();
</script>
</body>
</html>
