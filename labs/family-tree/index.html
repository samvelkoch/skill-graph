  lab.setGlow('rgba(180, 138, 90, .26)');
  $('thenFine').textContent = t.b.vary;
  const fin = thenDone(), idx = fin && S.bsel !== null ? S.bsel : S.bi, sel = fin && S.bsel !== null && S.bsel !== S.bi;
  // after the last round a tapped card shows its own story; the question block keeps the round's answer
  $('thenQA').innerHTML = qaHTML(t, { q: t.b.q, opts: t.b.o[S.bi], ok: OK_B[S.bi], pick: S.bpick, text: t.b.why[idx], last: S.bi === 3, verdict: !sel });
  if (S.bpick === null) lab.setReadout('?', '', '', '#B48A5A');
  else { const L = OBJ_LEVEL[idx]; lab.setReadout(esc(t.gen[['you', 'parents', 'grand', 'great'][L]]), L ? t.t.bornAbout(born10(S.born) - 30 * L) : '', '', '#B48A5A'); }
  setCard(t, 'then', fin);
}

let lastRO = '';
function countReadout() { // also called from the loop: the number runs while the people appear
  const t = T[lang];
  let val, sub = '';
  if (S.cfree) {
    const yrs = 2026 - S.cyear, lo = Math.floor(yrs / 30), hi = Math.max(Math.round(yrs / 25), lo + 1);
    val = esc(t.c.gens(lo, hi)); sub = t.c.years(fmt(Math.round(yrs)));
  } else if (S.cpick === null) val = '?';
  else { val = String(Math.floor(S.cn)); sub = t.c.years(fmt(LBL[S.cq])); }
  const key = `${val}|${sub}|${lang}`;
  if (key === lastRO) return;
  lastRO = key; lab.setReadout(val, sub, '', '#4FA3E0');
}
function renderCount(t) {
  lab.setGlow('rgba(79, 163, 224, .26)');
  $('countQA').innerHTML = qaHTML(t, { q: t.c.q[S.cq], opts: t.c.o[S.cq], ok: OK_C[S.cq], pick: S.cpick, text: t.c.why[S.cq], last: S.cq === 2 });
  const fin = countDone();
  $('freeBox').style.display = fin ? '' : 'none';
  $('yrLbl').textContent = `${t.c.year} ${S.cyear <= 0 ? t.c.bc(1 - S.cyear) : S.cyear}`;
  $('jCastle').textContent = '🏰 1000';
  $('jPyr').textContent = `🔺 ${t.c.bc(2560)}`;
  countReadout();
  setCard(t, 'count', fin);
}
render();
</script>
