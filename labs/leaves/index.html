const TAU = Math.PI * 2;
const c01 = (x) => Math.min(1, Math.max(0, x));
const ease = (t) => { t = c01(t); return t * t * (3 - 2 * t); };
const backOut = (t) => { t = c01(t); const s = 1.70158; return 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); };
const now = () => performance.now() / 1000;
const hex = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const toHex = (a) => '#' + a.map((v) => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, '0')).join('');
const mix = (a, b, t) => { const x = hex(a), y = hex(b); return toHex(x.map((v, i) => v + (y[i] - v) * t)); };
const shade = (h, k) => (k >= 0 ? mix(h, '#000000', k) : mix(h, '#ffffff', -k)); // k > 0 darker, k < 0 lighter
const rgba = (h, a) => { const [r, g, b] = hex(h); return `rgba(${r},${g},${b},${a})`; };
const rng = (seed) => () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

// text on a dark pill, clamped inside the canvas
let CW = 400;
function pill(c, text, x, y, o = {}) {
  c.save();
  const fs = o.fs || 13;
  c.font = `800 ${fs}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
  const tw = c.measureText(text).width + 20, ph = fs + 12, px = clamp(x - tw / 2, 4, Math.max(4, CW - tw - 4));
  c.globalAlpha = 1; c.fillStyle = o.bg || 'rgba(20,30,24,.82)'; c.beginPath(); c.roundRect(px, y - ph / 2, tw, ph, ph / 2); c.fill();
  c.fillStyle = o.fg || '#fff'; c.fillText(text, px + tw / 2, y + 1);
  c.restore();
}

// --- leaf geometry: a unit frame, the tip at y = -1, widths are half-widths --------------------------------
function resample(P, ds) {
  const out = [P[0]]; let carry = 0;
  for (let i = 1; i < P.length; i++) {
    const [x0, y0] = P[i - 1], [x1, y1] = P[i], d = Math.hypot(x1 - x0, y1 - y0);
    if (d === 0) continue;
    let s = ds - carry;
    while (s <= d) { const f = s / d; out.push([x0 + (x1 - x0) * f, y0 + (y1 - y0) * f]); s += ds; }
    carry = d - (s - ds);
  }
  out.push(P[P.length - 1]);

    const R = clamp(Math.min(w, h) * .22, 50, 100), lp = ease((rt - .4) / 1.0), [fx, fy] = leafPt(Pn, 0, -.5), lx = lerp(w + R, fx, lp), ly = lerp(h * .95, fy, lp);
    drawLens(c, lx, ly, R, (cc) => {
      const sk = cc.createRadialGradient(lx - R * .2, ly - R * .2, R * .1, lx, ly, R * .62); sk.addColorStop(0, '#F3F8E8'); sk.addColorStop(1, '#9CC4DC');
      cc.fillStyle = sk; cc.beginPath(); cc.arc(lx, ly, R * .62, 0, TAU); cc.fill();
      cc.strokeStyle = 'rgba(40,70,100,.5)'; cc.lineWidth = 1.5; cc.stroke();
      const gr = cc.createRadialGradient(lx - R * .15, ly - R * .15, R * .05, lx, ly, R * .5); gr.addColorStop(0, mix(GREEN, YEL, .2)); gr.addColorStop(1, shade(DARK, .1));
      cc.fillStyle = gr; cc.beginPath(); cc.arc(lx, ly, R * .5, 0, TAU); cc.fill();
      cc.fillStyle = '#F3F8E8'; cc.strokeStyle = shade(DARK, .3); cc.beginPath(); cc.arc(lx, ly, R * .1, 0, TAU); cc.fill(); cc.stroke();
      cc.strokeStyle = 'rgba(255,255,255,.75)'; cc.lineWidth = Math.max(2, R * .045); cc.lineCap = 'round'; cc.beginPath(); cc.arc(lx, ly, R * .56, Math.PI * 1.1, Math.PI * 1.45); cc.stroke();
    }, .5 + .5 * lp, mix(BGD, DARK, .5));
  }
}
function drawYears(c, w, h, dt, time, rt) {
  const t = T[lang], H = h * .7, x = w * .5, by = h * .82, yr = rt < 0 ? 1 : Math.min(4, 1 + Math.floor(rt / 2.2)), u = rt < 0 ? 0 : rt >= 8.8 ? 1 : (rt % 2.2) / 2.2;
  drawPark(c, w, h, { t: time });
  drawTree(c, 'pine', x, by, H, { t: time });
  const bl = TREES.pine.blobs, P = (ux, uy) => [x + ux * H, by + uy * H];
  c.save(); c.lineCap = 'round';
  for (let y = 1; y <= yr; y++) {
    const grow = y < yr ? 1 : ease((u - .15) / .4);
    c.strokeStyle = y < yr ? shade(DARK, -.08) : mix(GREEN, YEL, .4); c.lineWidth = Math.max(1.8, H * .012);
    for (const tp of TIPS[y - 1]) {
      const b = bl[Math.floor(tp.bi * bl.length)], ux = b.x + Math.cos(tp.a) * b.r, uy = b.y + Math.sin(tp.a) * b.r * b.sy, [px, py] = P(ux, uy), len = H * .05 * grow;
      for (const da of [-.5, 0, .5]) { c.beginPath(); c.moveTo(px, py); c.lineTo(px + Math.cos(tp.a + da) * len, py + Math.sin(tp.a + da) * len); c.stroke(); }
    }
  }
  // old needles turn brown and fall, a few at a time; they pile up under the tree
  c.strokeStyle = mix(GOLD, '#ffffff', .1); c.lineWidth = Math.max(1.6, H * .008);
  for (let y = 1; y <= yr; y++) {
    NEEDLES[y - 1].forEach((n) => {
      const b = bl[Math.floor(n.bi * bl.length)], [sx, sy] = P(b.x, b.y), [ex, ey] = P(n.ex, n.ey);
      let px = ex, py = ey, vis = true;
      if (y === yr) { const p = (u - .45 - n.d * .3) / .35; if (p <= 0) vis = false; else { const q = Math.min(1, p), e2 = q * q; px = lerp(sx, ex, q) + Math.sin(q * 8 + n.d * 9) * H * .03 * (1 - q); py = lerp(sy, ey, e2); } }
      if (!vis) return;
      const L = H * .05, a = n.rot;
      c.beginPath(); c.moveTo(px - Math.cos(a) * L / 2, py - Math.sin(a) * L / 2); c.lineTo(px + Math.cos(a) * L / 2, py + Math.sin(a) * L / 2); c.moveTo(px - Math.cos(a + .15) * L / 2, py - Math.sin(a + .15) * L / 2 + 2); c.lineTo(px + Math.cos(a + .15) * L / 2, py + Math.sin(a + .15) * L / 2 + 2); c.stroke();
    });
  }
  c.restore();
  pill(c, t.w.year(yr), w / 2, 26, { fs: 15 });
}

// --- main loop ------------------------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, time) => {
  CW = w; S.dim.w = w; S.dim.h = h;
  c.lineJoin = 'round'; c.lineCap = 'round';
  const v = lab.view;
  if (v === 'match') drawMatch(c, w, h, dt, time); else if (v === 'look') drawLook(c, w, h, dt, time); else drawWinter(c, w, h, dt, time);
});

// --- controls ---------------------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function pickM(j) {
  const M = S.m; if (M.picked !== null) return;
  const { w, h } = S.dim; M.from = matchPose(w, h, parkGeo(w, h, 3, true), now());
  M.picked = j; M.rt0 = now(); (j === ROUNDS[M.i].right ? sfx.good : sfx.bad)(); render(); showStage();
}
function pickL(j) {
  const Lk = S.l; if (Lk.picked !== null) return;
  Lk.picked = j; Lk.rt0 = now(); (j === LROUNDS[Lk.i].right ? sfx.good : sfx.bad)(); render(); showStage();
}
function pickW(j) {
  const W = S.w; if (W.picked !== null) return;
  W.picked = j; W.rt0 = now(); (j === W_RIGHT[W.i] ? sfx.good : sfx.bad)();
  if (W.i === 0) W.anim = { from: 0, to: 2, dur: 8.5, t0: now() };
  else { W.scene = W.i === 1 ? 'needle' : 'years'; W.sceneT0 = now(); S.drops = []; }
  render(); showStage();
}
function next() {
  const v = lab.view;
  if (v === 'match') {
    const M = S.m;
    if (M.i < 3) { M.i++; M.picked = null; M.t0 = now(); M.from = null; } else { M.free = true; M.F = []; M.matched = 0; clearHits(); }
  } else if (v === 'look') { const Lk = S.l; Lk.i++; Lk.picked = null; }
  else {
    const W = S.w; W.scene = 'park'; S.drops = [];
    if (W.i < 2) { W.i++; W.picked = null; if (W.p > .01) W.anim = { from: W.p, to: 0, dur: 1.6, t0: now(), ease: true }; } else { W.free = true; W.picked = null; if (W.p > .01) W.anim = { from: W.p, to: 0, dur: 1.6, t0: now(), ease: true }; }
  }
  sfx.click(); render();
}
function again() {
  const v = lab.view;
  if (v === 'match') { S.m = newM(); S.sec = null; clearHits(); } else if (v === 'look') S.l = newL(); else S.w = newW();
  clearParts(); sfx.click(); render();
}
function onView() { clearParts(); clearHits(); if (lab.view === 'match' && S.m.picked === null && !S.m.free) S.m.t0 = now(); render(); }
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, v = lab.view;
  if (act === 'pick') { const j = +b.dataset.j; if (v === 'match') pickM(j); else if (v === 'look') pickL(j); else pickW(j); }
  else if (act === 'next') next();
  else if (act === 'again') again();
  else if (act === 'shake') shake();
  else if (act === 'sec') {
    if (!secret.unlocked()) return secret.open();
    const k = b.dataset.k; S.sec = S.sec === k ? null : k; S.sp = 0; S.sa = 0; clearParts(); clearHits(); sfx.click(); render();
  }
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id !== 'lfRange') return;
  const val = +ev.target.value;
  if (lab.view === 'winter') { S.w.p = val / 100; S.w.anim = null; } else if (S.sec === 'larch') S.sp = val / 100; else S.sa = val / 100;
  sliderReadout();
});
$('cv').addEventListener('click', (ev) => {
  if (lab.view !== 'look' || S.l.picked !== null) return;
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, hit = S.l.hit.find((q) => x >= q.x && x <= q.x + q.w && y >= q.y && y <= q.y + q.h);
  if (hit) pickL(hit.j);
});

// --- one render per change: controls, readout and the state card ----------------------------------------------------
const seasonIdx = (p) => clamp(Math.round(p), 0, 3);
function sliderReadout() {
  const t = T[lang], v = lab.view, label = v === 'winter' ? t.w.seasons[seasonIdx(S.w.p)] : S.sec === 'larch' ? t.w.seasons[seasonIdx(S.sp)] : t.sec.slide;
  lab.setReadout(esc(label), '', '', '#F2C94C');
  const el = $('lfSl'); if (el) el.textContent = label;
}
function readout() {
  const t = T[lang], M = S.m;
  if (lab.view === 'match' && M.free && !S.sec) lab.setReadout(esc(t.m.sorted(M.matched, 5)), '', '', GREEN);
}
const setCard = (key, which, extra = {}) => { const a = T[lang].cards[key][which]; lab.setState({ emo: a[0], title: a[1], lead: a[2], body: a[3], ...extra }); };
const qBlock = (t, q, opts, picked, right, nextLabel, nextAct) => {
  const done = picked !== null;
  return `<div class="lf-q">${esc(q)}</div><div class="lf-opts">${opts.map((o, j) => `<button class="lf-o${!done ? '' : j === right ? ' right' : j === picked ? ' wrong' : ' dim'}" data-act="pick" data-j="${j}"${done ? ' disabled' : ''}>${esc(o)}</button>`).join('')}</div>`
    + (done ? `<div class="row2"><b class="lf-v ${picked === right ? 'ok' : 'no'}">${esc(picked === right ? t.right : t.wrong)}</b><button class="btn lf-push" data-act="${nextAct}">${esc(nextLabel)}</button></div>` : '');
};
const chipsHtml = (t) => {
  const open = secret.unlocked();
  return `<div class="row2"><div class="chips">${[['larch', '🌲'], ['yellow', '🍂']].map(([k, e]) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('')}</div></div>`;
};
const sliderHtml = (label, val, max) => `<div class="row2"><span class="lf-lab" id="lfSl">${esc(label)}</span></div><div class="row2" style="margin-top:6px"><input class="lf-range" id="lfRange" type="range" min="0" max="${max}" value="${val}" aria-label="${esc(label)}"></div>`;
const verdictCard = (t, ok, why, last, key) => (last ? setCard(key, 'f', { body: why }) : lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.right : t.wrong, lead: why, body: '' }));

function renderMatch(t) {
  const M = S.m, body = $('ctrlBody');
  lab.setGlow('rgba(94,158,62,.26)');
  if (S.sec) {
    const k = S.sec;
    body.innerHTML = sliderHtml(k === 'larch' ? t.w.seasons[seasonIdx(S.sp)] : t.sec.slide, Math.round((k === 'larch' ? S.sp : S.sa) * 100), k === 'larch' ? 300 : 100) + chipsHtml(t);
    sliderReadout();
    lab.setState({ emo: k === 'larch' ? '🌲' : '🍂', title: t.secrets[k][0], lead: t.sec[k + 'Text'], body: '' });
  } else if (M.free) {
    body.innerHTML = `<div class="row2" style="margin-top:0"><button class="btn" data-act="shake">${esc(t.m.shake)}</button><button class="chip" data-act="again">${esc(t.again)}</button></div>${chipsHtml(t)}`;
    readout(); setCard('match', 'f');
  } else {
    const r = ROUNDS[M.i], ok = M.picked === r.right;
    body.innerHTML = qBlock(t, t.m.q, t.m.o[M.i], M.picked, r.right, t.next, 'next');
    lab.setReadout(`${M.i + 1}/4`, '', '', GREEN);
    if (M.picked === null) setCard('match', 'n'); else verdictCard(t, ok, t.m.why[M.i], M.i === 3, 'match');
  }
}
function renderLook(t) {
  const Lk = S.l, i = Lk.i, r = LROUNDS[i], ok = Lk.picked === r.right, last = i === 2;
  lab.setGlow('rgba(242,201,76,.22)');
  $('ctrlBody').innerHTML = qBlock(t, t.l.q[i], t.l.o[i], Lk.picked, r.right, last ? t.again : t.next, last ? 'again' : 'next');
  lab.setReadout(`${i + 1}/3`, '', '', YEL);
  if (Lk.picked === null) setCard('look', 'n'); else verdictCard(t, ok, t.l.why[i], last, 'look');
}
function renderWinter(t) {
  const W = S.w, i = W.i, body = $('ctrlBody');
  lab.setGlow('rgba(150,190,230,.24)');
  if (W.free) {
    body.innerHTML = sliderHtml(t.w.seasons[seasonIdx(W.p)], Math.round(W.p * 100), 300) + `<div class="row2"><button class="chip" data-act="again">${esc(t.again)}</button></div>`;
    sliderReadout(); setCard('winter', 'f');
    return;
  }
  const q = [t.w.q1, t.w.q2, t.w.q3][i], o = [t.w.o1, t.w.o2, t.w.o3][i], why = [t.w.r1, t.w.r2, t.w.r3][i], ok = W.picked === W_RIGHT[i];
  body.innerHTML = qBlock(t, q, o, W.picked, W_RIGHT[i], t.next, 'next');
  lab.setReadout(`${i + 1}/3`, '', '', '#9CC4DC');
  if (W.picked === null) setCard('winter', 'n'); else verdictCard(t, ok, why, i === 2, 'winter');
}
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = v;
  if (v !== 'match' || S.m.free === false || S.sec) clearHits();
  if (v === 'match') renderMatch(t); else if (v === 'look') renderLook(t); else renderWinter(t);
}
render();
</script>
</body>
