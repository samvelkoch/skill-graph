const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

const hx = (s) => [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16));
const mix = (a, b, t) => { const A = hx(a), B = hx(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
const rgba = (h, a) => { const [r, g, b] = hx(h); return `rgba(${r},${g},${b},${a})`; };
const rng = (seed) => () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

    if (ia !== null) {
      const path = () => { c.beginPath(); c.moveTo(ia, yi); for (let x = ia; x <= ib; x += 4) c.lineTo(x, yi + Math.sin(x * 0.09) * 1.2); c.lineTo(ib, yi); for (let x = ib; x >= ia; x -= 2) c.lineTo(x, gy(x)); c.closePath(); };
      c.save(); c.shadowColor = 'rgba(30,60,90,.35)'; c.shadowBlur = 8; g = c.createLinearGradient(0, yi, 0, 250); g.addColorStop(0, '#d3ecf8'); g.addColorStop(0.35, C.ice1); g.addColorStop(1, C.ice2);
      path(); c.fillStyle = g; c.fill(); c.restore();

      for (const f of [0.3, 0.6]) { c.beginPath(); for (let x = ia; x <= ib; x += 5) { const y = yi + (240 - yi) * f * 0.6 + Math.sin(x * 0.05 + f * 9) * 2; x === ia ? c.moveTo(x, y) : c.lineTo(x, y); } c.stroke(); }
      c.fillStyle = C.crev;
      for (const f of [0.28, 0.5, 0.72]) { const x = lerp(ia, ib, f); if (ib - ia < 60) continue; c.beginPath(); c.moveTo(x - 1.6, yi); c.lineTo(x + 0.5, yi + 9); c.lineTo(x - 0.8, yi + 17); c.lineTo(x + 0.4, yi + 26); c.lineTo(x + 1.8, yi + 14); c.lineTo(x + 2, yi); c.closePath(); c.fill(); }
      for (const q of embed) { const x = lerp(ia, ib, q.f), y0 = yi + 4, y1 = gy(x) - 3, y = lerp(y0, Math.max(y0, y1), q.d); c.fillStyle = '#5a4f46'; c.beginPath(); c.arc(x, y, q.r, 0, 6.3); c.fill(); }
      c.restore();
      c.lineJoin = 'round'; path(); c.strokeStyle = 'rgba(79,141,179,.9)'; c.lineWidth = 1.4; c.stroke();
      c.strokeStyle = '#fff'; c.lineWidth = 3; c.beginPath(); for (let x = ia; x <= ib; x += 4) { const y = yi - 1 + Math.sin(x * 0.09) * 1.2; x === ia ? c.moveTo(x, y) : c.lineTo(x, y); } c.stroke();
    }
  }
  // the stray boulder rides in on the ice and is left on the floor
  const ca = sstep(0.5, 0.62, S.maxIce);
  if (ca > 0.01) {
    const yi = lerp(240, 86, ease(ice)), ground = gy(XB), bot = Math.min(ground, S.ice > 0.01 ? yi : ground), rx = 16, ry = 12;
    c.globalAlpha = ca; granite(c, XB, bot - ry * 0.85, rx, ry); c.globalAlpha = 1;
    if (ice < 0.03 && e > 0.9 && ca >= 1) pill(c, t.boulder, XB - 8, bot - ry * 2 - 14, 'c');
  }
}

// --- secrets -----------------------------------------------------------------------------------------------------
function drawRace(c, time) {
  const t = T[lang], { xl, xr, yb } = V;
  // snowy ground strip
  const g = c.createLinearGradient(0, 40, 0, 300); g.addColorStop(0, '#eaf3fa'); g.addColorStop(1, '#c9dcec');
  c.fillStyle = g; c.fillRect(xl, 30, xr - xl, yb - 30);
  const cyc = time % 8, f = clamp01(cyc / 5);
  // a day: sun to moon
  const bx0 = 40, bx1 = 320;
  c.fillStyle = 'rgba(79,141,179,.25)'; c.beginPath(); c.roundRect(bx0, 38, bx1 - bx0, 6, 3); c.fill();
  c.fillStyle = C.melt; c.beginPath(); c.roundRect(bx0, 38, (bx1 - bx0) * f, 6, 3); c.fill();
  c.font = '18px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#000';
  c.fillText(f < 0.75 ? '☀️' : '🌙', lerp(bx0, bx1, f), 41);
  const lanes = [{ d: 207.36, e: '🐌' }, { d: 0.5, e: '🏔️' }, { d: 46, e: '🧊' }];
  const track = (m) => 40 + (m / 250) * 280;
  lanes.forEach((ln, i) => {
    const ly = 96 + i * 54;
    pill(c, t.raceNames[i], 36, ly - 22, 'l');
    c.fillStyle = '#fff'; c.strokeStyle = 'rgba(79,141,179,.55)'; c.lineWidth = 1; c.beginPath(); c.roundRect(36, ly + 8, 290, 12, 6); c.fill(); c.stroke();
    const d = ln.d * f, x = track(d);
    c.fillStyle = rgba(C.ice2, 0.5); c.beginPath(); c.roundRect(36, ly + 8, Math.max(3, x - 36), 12, 6); c.fill();
    c.font = '26px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#000'; c.fillText(ln.e, Math.max(48, x), ly - 4);
    pill(c, `${fmt(d, d < 10 ? 1 : 0)} ${t.unitM}`, 326, ly - 22, 'r', '#ffd166', '#1d2433');
  });
  // finish line and axis
  c.setLineDash([4, 4]); c.strokeStyle = '#e8664d'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(track(250), 66); c.lineTo(track(250), 244); c.stroke(); c.setLineDash([]);
  c.strokeStyle = 'rgba(40,60,90,.6)'; c.lineWidth = 1; c.beginPath(); c.moveTo(40, 250); c.lineTo(320, 250);
  for (let m = 0; m <= 250; m += 50) { c.moveTo(track(m), 246); c.lineTo(track(m), 254); } c.stroke();
  c.font = `800 ${12 / V.sc}px Nunito, sans-serif`; c.fillStyle = '#27405a'; c.textAlign = 'center'; c.textBaseline = 'middle';
  for (let m = 0; m <= 250; m += 50) c.fillText(m === 250 ? `250 ${t.unitM}` : String(m), Math.min(track(m), V.xr - 22 / V.sc), 266);
  return { d: 46 * f };
}
function drawAletsch(c, time) {
  const t = T[lang], { xl, xr, yb } = V;
  const kmx = (k) => 22 + 12.1 * k;
  const bedB = (x) => { if (x >= 310) return 178 + (x - 310) * 0.02; const u = clamp01((x - 14) / 296); return 56 + 122 * (1 - Math.pow(1 - u, 1.7)); };
  const thB = (x) => { const u = clamp01((x - 22) / (kmx(23) - 22)); if (u <= 0 || u >= 1) return 0; return (8 + 13 * Math.pow(Math.sin(Math.PI * Math.pow(u, 0.75)), 0.7)) * Math.pow(1 - Math.pow(u, 6), 0.6); };
  let g = c.createLinearGradient(0, 20, 0, 170); g.addColorStop(0, '#a9c5dc'); g.addColorStop(1, '#d3e4f0');
  c.fillStyle = g; c.beginPath(); c.moveTo(xl - 5, yb); c.lineTo(xl - 5, 140);
  for (const [x, y] of [[26, 60], [52, 34], [78, 56], [108, 26], [140, 62], [180, 90], [232, 112], [290, 140]]) c.lineTo(x, y);
  c.lineTo(xr + 5, 150); c.lineTo(xr + 5, yb); c.closePath(); c.fill();
  c.fillStyle = 'rgba(255,255,255,.9)'; for (const [x, y] of [[52, 34], [108, 26]]) { c.beginPath(); c.moveTo(x, y); c.lineTo(x + 12, y + 15); c.lineTo(x + 4, y + 12); c.lineTo(x - 3, y + 17); c.lineTo(x - 12, y + 14); c.closePath(); c.fill(); }
  g = c.createLinearGradient(0, 60, 0, 300); g.addColorStop(0, C.rock1); g.addColorStop(1, C.rock2);
  c.fillStyle = g; c.beginPath(); c.moveTo(xl - 4, yb + 4); for (let x = xl - 4; x <= xr + 4; x += 4) c.lineTo(x, bedB(x)); c.lineTo(xr + 4, yb + 4); c.closePath(); c.fill();
  // meadow below the glacier
  c.strokeStyle = C.grass; c.lineWidth = 5; c.lineCap = 'round'; c.beginPath(); for (let x = kmx(23) - 6; x <= xr; x += 4) { x <= kmx(23) - 6 ? c.moveTo(x, bedB(x)) : c.lineTo(x, bedB(x)); } c.stroke();
  // the ice tongue
  const ice = () => { c.beginPath(); c.moveTo(22, bedB(22)); for (let x = 22; x <= kmx(23); x += 3) c.lineTo(x, bedB(x) - thB(x)); c.lineTo(kmx(23), bedB(kmx(23))); for (let x = kmx(23); x >= 22; x -= 3) c.lineTo(x, bedB(x)); c.closePath(); };
  c.save(); c.shadowColor = 'rgba(30,60,90,.35)'; c.shadowBlur = 6; g = c.createLinearGradient(0, 50, 0, 190); g.addColorStop(0, '#d3ecf8'); g.addColorStop(1, C.ice2); ice(); c.fillStyle = g; c.fill(); c.restore();
  c.save(); ice(); c.clip(); c.fillStyle = C.crev; c.globalAlpha = 0.7;
  for (let k = 2; k < 22; k += 2) { const x = kmx(k) + 2, ys = bedB(x) - thB(x), dd = thB(x) * 0.6; c.beginPath(); c.moveTo(x - 1.4, ys); c.lineTo(x + 0.4, ys + dd * 0.5); c.lineTo(x - 0.6, ys + dd); c.lineTo(x + 1.6, ys + dd * 0.4); c.lineTo(x + 1.8, ys); c.closePath(); c.fill(); }
  c.restore();
  c.lineJoin = 'round'; ice(); c.strokeStyle = 'rgba(79,141,179,.9)'; c.lineWidth = 1.3; c.stroke();
  c.strokeStyle = '#fff'; c.lineWidth = 3; c.beginPath(); for (let x = 22; x <= kmx(8); x += 3) { const y = bedB(x) - thB(x) - 1; x === 22 ? c.moveTo(x, y) : c.lineTo(x, y); } c.stroke();
  // a city for scale, about 4 km wide on this ruler
  const cx0 = kmx(23) + 8, gyc = bedB(cx0 + 20);
  const bl = [[0, 22], [6, 40], [13, 28], [19, 62], [26, 36], [33, 24], [39, 48], [45, 20]];
  bl.forEach(([dx, h], i) => {
    const w = i % 3 === 0 ? 8 : 6, x = cx0 + dx, bg = c.createLinearGradient(x, gyc - h, x + w, gyc); bg.addColorStop(0, '#6c8197'); bg.addColorStop(1, '#46586c');
    c.fillStyle = bg; c.fillRect(x, gyc - h, w, h + 1);
    c.fillStyle = 'rgba(255,233,166,.85)'; for (let yy = gyc - h + 4; yy < gyc - 3; yy += 6) for (let xx = x + 1.5; xx < x + w - 1; xx += 3) { if (((xx * 7 + yy * 3 + i) | 0) % 3) c.fillRect(xx, yy, 1.3, 1.8); }
  });
  // ruler in km under the rock
  c.fillStyle = 'rgba(16,13,10,.78)'; c.beginPath(); c.roundRect(16, 266, kmx(23) - 8, 24, 12); c.fill();
  c.strokeStyle = 'rgba(255,255,255,.65)'; c.lineWidth = 1; c.beginPath();
  for (let k = 0; k <= 23; k++) { c.moveTo(kmx(k), 267); c.lineTo(kmx(k), 267 + (k % 5 === 0 || k === 23 ? 8 : 4)); } c.stroke();
  c.font = `800 ${12 / V.sc}px Nunito, sans-serif`; c.fillStyle = '#e6e9f2'; c.textAlign = 'center'; c.textBaseline = 'middle';
  for (const k of [0, 5, 10, 15, 20, 23]) c.fillText(k === 23 ? t.km(k) : String(k), kmx(k), 283);
  pill(c, t.aletschLabel, 188, 14, 'c');
}

// --- render ------------------------------------------------------------------------------------------------------------
function labels() {
  const t = T[lang];
  $('glSnowL').textContent = t.snowLbl; $('glSnowV').textContent = t.snowOpts[S.snowI];
  $('glWarmL').textContent = t.warmth; $('glWarmV').textContent = t.warmOpts[S.warmI];
  $('glYrL').textContent = t.years; $('glYrV').textContent = String(Math.round(S.yr));
  $('glIceL').textContent = t.iceAge; $('glIceV').textContent = `${Math.round((S.auto ? S.ice : S.iceT) * 100)} %`;
}
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  const show = (id, on) => { $(id).style.display = on ? 'block' : 'none'; };
  show('glBal', !sec && v === 'balance'); show('glSn', !sec && v === 'snow'); show('glVa', !sec && v === 'valley');
  const open = secret.unlocked();
  $('glSecRow').innerHTML = [['a', '🧊'], ['b', '🏔️']].map(([k, emo]) => `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-sec="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  // balance
  $('glAskBal').innerHTML = askBlock('balance', t.balAsk, t.balOpts, 1, t.balRight, t.balWrong);
  const bl = balLocked();
  $('glSnow').value = S.snowI; $('glWarm').value = S.warmI; $('glSnow').disabled = bl; $('glWarm').disabled = bl;
  $('glSnowE').innerHTML = t.snowOpts.map((o) => `<span>${esc(o)}</span>`).join(''); $('glWarmE').innerHTML = t.warmOpts.map((o) => `<span>${esc(o)}</span>`).join('');
  $('glRunRow').style.display = S.p.balance === null ? 'none' : 'flex';
  $('glRun').textContent = t.run; $('glRun').disabled = bl; $('glReset').textContent = '↺ ' + t.reset; $('glReset').disabled = !!S.run;
  // snow
  $('glAskSn').innerHTML = askBlock('snow', t.snowAsk, t.snowPick, 0, t.snowRight, t.snowWrong);
  $('glYr').value = Math.round(S.yr); $('glYr').disabled = snowLocked();
  // valley
  $('glAskVa').innerHTML = askBlock('valley', t.valAsk, t.valOpts, 1, t.valRight, t.valWrong);
  const il = iceLocked(); $('glIce').disabled = il; $('glIce').value = Math.round((S.auto ? S.ice : S.iceT) * 100);
  $('glVa').querySelector('.gl-sl').style.display = S.p.valley === null ? 'none' : 'block';
  labels();
  // state card and facts
  if (sec) {
    const k = sec, emo = k === 'a' ? '🧊' : '🏔️';
    lab.setState({ emo, title: t.secrets[k][0], lead: k === 'a' ? t.raceNote : t.secrets[k][1], body: '', extra: '' });
  } else {
    const [emo, title, lead, body] = t.st[v], done = S.p[v === 'snow' ? 'snow' : v === 'valley' ? 'valley' : 'balance'] !== null;
    lab.setState({ emo, title, lead: v === 'balance' || done ? lead : '', body: done ? body : '', extra: '' });
  }
  lab.setFacts(t.facts[v]);
  syncReadout(true);
}
const big = (s) => { const i = s.indexOf(' '); return i < 0 ? esc(s) : `${esc(s.slice(0, i))}<span class="gl-unit">${esc(s.slice(i))}</span>`; };
let roKey = '';
function syncReadout(force) {
  const t = T[lang], v = lab.view;
  let val, sub = '', pillTxt = '', col = '#4c9fd0';
  if (S.sec === 'a') { val = big(`${fmt(46 * clamp01((nowS() % 8) / 5), 0)} ${t.unitM}`); sub = t.raceNames[2]; col = '#4c9fd0'; }
  else if (S.sec === 'b') { val = big(t.km(23)); sub = t.secrets.b[0]; }
  else if (v === 'balance') {
    val = big(t.km(fmt(S.snout))); sub = t.endSub;
    if (S.p.balance !== null) { const b = balOf(); pillTxt = b > 0 ? t.grows : b < 0 ? t.shrinks : t.stays; col = b > 0 ? '#4c9fd0' : b < 0 ? '#c9774f' : '#7f93a6'; }
  } else if (v === 'snow') {
    const d = Dep(S.yrS), p = pOf(d); val = big(t.kgL(fmt(densOf(p)))); sub = `${t.years}: ${Math.round(S.yrS)}`; pillTxt = t.layers[zoneOf(d)]; col = '#7cb7d8';
  } else {
    const ok = S.e >= 0.5; val = ok ? 'U' : 'V'; sub = t.valSub; col = '#7d6f63';
    if (S.ice > 0.02) pillTxt = `${Math.round(S.ice * 100)} %`; else if (S.e > 0.9) pillTxt = t.boulder;
    if (S.ice > 0.02) col = '#7cb7d8';
  }
  const key = [lang, val, sub, pillTxt, col].join('|');
  if (!force && key === roKey) return;
  roKey = key; lab.setReadout(val, sub, pillTxt, col);
}

// --- the picture ---------------------------------------------------------------------------------------------------------
let lastSec = null;
canvasLoop($('cv'), (c, w, h, dt, time) => {
  const sc = Math.min(w / W, h / H), ox = (w - W * sc) / 2, oy = (h - H * sc) / 2, tnow = nowS();
  Object.assign(V, { sc, xl: -ox / sc, xr: (w - ox) / sc, yt: -oy / sc, yb: (h - oy) / sc });
  updateBal(dt, tnow); updateValley(dt, tnow);
  const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, C.sky1); g.addColorStop(1, C.sky2);
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  c.save(); c.translate(ox, oy); c.scale(sc, sc); c.lineJoin = 'round';
  if (S.sec === 'a') drawRace(c, tnow); else if (S.sec === 'b') drawAletsch(c, tnow);
  else if (lab.view === 'balance') drawBalance(c, tnow, dt);
  else if (lab.view === 'snow') drawSnow(c, tnow, dt);
  else drawValley(c, tnow);
  c.restore();
  syncReadout(false);
});
render();
</script>
