function spotTap(ev) {
  const sp = S.sp; if (sp.done || sp.i >= 6) return;
  const kind = TASKS[sp.i][1], hit = ev.target.closest('[data-part], [data-sp], .tf-l, .tf-pl, .tf-p, .tf-h, .tf-cast');
  if (!hit) return;
  const bad = (...els) => { els.forEach((el) => { el.classList.remove('tf-pick', 'tf-shake'); void el.offsetWidth; el.classList.add('tf-shake'); }); sp.miss++; sp.first = null; sfx.bad(); render(); };
  const win = (...els) => { els.forEach((el) => { el.classList.remove('tf-pick'); el.classList.add('tf-ok'); }); sp.done = true; sp.res[sp.i] = sp.miss === 0; sfx.good(); render(); };
  const part = hit.dataset.part, tgt = ev.target;
  if (kind === 'rhyme2') {
    if (part !== 'rhyme') return bad(hit);
    if (!sp.first) { sp.first = hit; hit.classList.add('tf-pick'); sfx.tick(); return render(); }
    if (hit === sp.first) return;
    if (hit.dataset.pair === sp.first.dataset.pair) return win(sp.first, hit);
    const f = sp.first; return bad(hit, f);
  }
  if (kind === 'verse2') { const el = tgt.closest('[data-sp=verse2]'); return el ? win(el) : bad(hit); }
  if (kind === 'parastart') { const el = tgt.closest('[data-sp=parastart]'); return el ? win(el) : bad(hit); }
  const want = kind; // dir, name, dial
  return part === want ? win(hit) : bad(hit);
}

// --- render --------------------------------------------------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view, D = STORY[lang];
  document.body.dataset.v = v;
  lab.setGlow('rgba(240, 170, 80, .26)');
  sheetEl.lang = lang;
  sheetEl.classList.toggle('fit', v === 'which');
  const puppets = v === 'morph' && S.form === 'play' && S.sec !== 'novel';
  sheetEl.style.bottom = puppets ? '162px' : '';
  sheetEl.dataset.pin = v === 'morph' && S.pin ? S.pin : '';
  const sc = (k, emo) => `<button class="chip secret ${secret.unlocked() ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${secret.unlocked() ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('tfSec').innerHTML = sc('novel', '📚') + sc('bear', '🐻');
  const F = FACT_SRC[v];
  lab.setFacts([{ emo: F.emo, text: t.facts[v], src: F.src }]);
  if (v === 'which') renderWhich(t, D); else if (v === 'morph') renderMorph(t, D); else renderSpot(t, D);
}
function renderWhich(t, D) {
  const w = S.w, end = w.i >= 6, k = w.res.filter(Boolean).length, body = $('tfBody');
  if (end) {
    setSheet(`wend:${lang}`, `<div class="tf-wrap"><p class="tf-end tf-a">${k}/6</p></div>`);
    body.innerHTML = `<div class="row2" style="margin-top:0">${B('go', 'wnext', t.which.again)}</div>`;
    lab.setReadout(`${k}/6`, '', '', '#e9a24a');
    lab.setState({ emo: '🏆', title: t.which.end(k), lead: t.which.endLead, body: '', extra: '' });
    return;
  }
  const fr = FR[lang][w.i], g = w.guess;
  setSheet(`w${w.i}:${g === null ? 'b' : 't'}:${lang}`, g === null ? barsHTML(fr) : sheetHTML(fr.f, null, { d: fr.f === 'play' ? fr.d : fr.d }), g === null ? '' : 'sharp');
  body.innerHTML = `<div class="row2" style="margin-top:0">${FORMS.map((f) => B(g === f ? 'on' : '', 'guess', `${t.emo[f]} ${t.forms[f]}`, `data-f="${f}"${g !== null ? ' disabled' : ''}`)).join('')}</div>
    ${g !== null ? `<div class="row2">${B('go', 'wnext', t.which.next)}</div>` : ''}`;
  if (g === null) {
    lab.setReadout('?', t.which.of(w.i + 1), '', '#e9a24a');
    lab.setState({ emo: '🤔', title: t.which.q, lead: t.which.lead, body: '', extra: '' });
  } else {
    lab.setReadout(`${t.emo[fr.f]} ${t.forms[fr.f]}`, t.which.of(w.i + 1), `✓ ${k}`, '#e9a24a');
    lab.setState({ emo: w.res[w.i] ? '✅' : '🤔', title: w.res[w.i] ? t.which.right : t.which.wrong(t.formIs[fr.f]), lead: t.clue[fr.f], body: '', extra: '' });
  }
}
function renderMorph(t, D) {
  const f = S.form, novel = S.sec === 'novel', body = $('tfBody');
  setSheet(novel ? `novel:${lang}` : `m:${f}:${lang}`, novel ? novelHTML(t) : sheetHTML(f, D, { title: true }));
  body.innerHTML = `<div class="row2" style="margin-top:0">${FORMS.map((x) => B(f === x && !novel ? 'on' : '', 'form', `${t.emo[x]} ${t.forms[x]}`, `data-f="${x}"`)).join('')}</div>
    ${novel ? '' : `<p class="tf-hint">${esc(t.pinHint)}</p><div class="row2" style="margin-top:6px">${PINS[f].map((p) => B(S.pin === p ? 'on' : '', 'pin', t.pins[p][0], `data-p="${p}"`)).join('')}</div>`}
    ${f === 'play' && !novel ? `<div class="row2">${B('', 'replay', t.replay)}</div>` : ''}`;
  const nl = D.poem.length, sub = f === 'poem' ? t.sub.poem(nl, Math.ceil(nl / 4)) : f === 'play' ? t.sub.play(D.play.lines.length, D.play.cast.length) : t.sub.story(D.prose.length);
  lab.setReadout(`${t.emo[f]} ${t.forms[f]}`, sub, '', '#e9a24a');
  if (novel) lab.setState({ emo: '📚', title: t.novel.title, lead: t.novel.lead, body: '', extra: '' });
  else if (S.sec === 'bear') lab.setState({ emo: '🐻', title: t.bear.title, lead: t.bear.lead, body: '', extra: '' });
  else if (S.pin) lab.setState({ emo: t.emo[PIN_FORM[S.pin]], title: t.pins[S.pin][0], lead: t.pins[S.pin][1], body: t.morph[f][1], extra: '' });
  else lab.setState({ emo: t.emo[f], title: t.morph[f][0], lead: t.morph[f][1], body: '', extra: '' });
}
function renderSpot(t, D) {
  const sp = S.sp, end = sp.i >= 6, body = $('tfBody'), k = sp.res.filter(Boolean).length;
  if (end) {
    setSheet(`send:${lang}`, `<div class="tf-wrap"><p class="tf-end tf-a">${k}/6</p></div>`);
    body.innerHTML = `<div class="row2" style="margin-top:0">${B('go', 'snext', t.spot.again)}</div>`;
    lab.setReadout(`${k}/6`, '', '', '#e9a24a');
    lab.setState({ emo: '🏆', title: t.spot.end(k), lead: t.spot.endLead, body: '', extra: '' });
    return;
  }
  const [form, kind, pin] = TASKS[sp.i], q = t.spot.q[kind];
  setSheet(`s${sp.i}:${form}:${lang}`, sheetHTML(form, D, { title: true }));
  body.innerHTML = `<p class="tf-q">${esc(q)}</p><div class="row2" style="margin-top:6px">${sp.done ? B('go', 'snext', t.spot.next) : ''}</div>`;
  lab.setReadout(`${k}/6`, t.spot.of(sp.i + 1), '', '#e9a24a');
  if (sp.done) lab.setState({ emo: '✅', title: t.spot.right, lead: t.pins[pin][1], body: '', extra: '' });
  else if (sp.first) lab.setState({ emo: '🤔', title: q, lead: t.spot.rhymeFirst, body: '', extra: '' });
  else if (sp.miss) lab.setState({ emo: '🤔', title: t.spot.wrong, lead: q, body: '', extra: '' });
  else lab.setState({ emo: '👆', title: q, lead: t.spot.hint, body: '', extra: '' });
}
render();
</script>
