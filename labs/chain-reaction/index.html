    $('sQ').textContent = s.sq; $('sOpts').innerHTML = opts(s.sopts, 'gs', S.gs, g);
    $('sCtl').hidden = !g;
    $('sTask').textContent = s.task;
    $('dL').textContent = s.dist; $('distV').textContent = s.meters(S.d); if (+$('distR').value !== S.d) $('distR').value = S.d;
    $('shL').textContent = s.shield; $('tmL').textContent = s.time;
    $('shChips').innerHTML = s.shields.map((x, i) => `<button type="button" class="cr-opt ${S.sh === i ? 'on' : ''}" data-act="sh" data-i="${i}">${esc(x)}</button>`).join('');
    $('tmChips').innerHTML = MINS.map((m) => `<button type="button" class="cr-opt ${S.mins === m ? 'on' : ''}" data-act="mins" data-i="${m}">${esc(s.mins(m))}</button>`).join('');
    if (!g) lab.setReadout(fmt(DOSE0), s.valSub0, '', '#bfff78');
    else lab.setReadout(fmt(dose, 1), s.valSub, s.rate(fmt(rate, 1)), dose <= LIMIT ? '#7be0a8' : '#ffb347');
    let st;
    if (!g) st = { emo: '☢️', title: s.spre[0], lead: s.spre[1], body: s.spre[2], extra: '' };
    else if (!S.moved) { const right = S.gs === 1; st = { emo: right ? '✅' : '🤔', title: right ? s.sright : s.swrong, lead: s.sres, body: s.task, extra: `<div class="cr-fine">${esc(s.sfine)}</div>` }; }
    else if (dose <= LIMIT) st = { emo: '🛡️', title: s.okT, lead: s.okL, body: s.task, extra: `<div class="cr-fine">${esc(s.sfine)}</div>` };
    else st = { emo: '☢️', title: s.badT(fmt(dose, 1)), lead: s.badL, body: s.task, extra: `<div class="cr-fine">${esc(s.sfine)}</div>` };
    lab.setState(st);
    lab.setFacts(g ? t.facts.safe1 : t.facts.safe0);
  }
}
render();
</script>
</body>
</html>
