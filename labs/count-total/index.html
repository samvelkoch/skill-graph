// --- constants and small helpers ---------------------------------------------------------------------------
const GOLD = '#FFC94A', CREAM = '#FFF3D6', INK = '#3A2A10', GOOD = '#5BD38A', BAD = '#FF6B6B';

const now = () => performance.now() / 1000;
const ease = (t) => (t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const back = (t) => { const k = t - 1; return 1 + 2.70158 * k * k * k + 1.70158 * k * k; }; // ease out with an overshoot

const dotsOf = (i, n) => Array.from({ length: n }, (_, k) => (k < i ? '●' : k === i ? '◉' : '○')).join(' ');

// the leaf: two Bézier curves from a round base (u = -0.5) to a point (u = 0.5), in units of the leaf length L
const bz = (t, a, b, c, d) => { const m = 1 - t; return m * m * m * a + 3 * m * m * t * b + 3 * m * t * t * c + t * t * t * d; };

const half = (u) => {
  for (let i = 1; i < EDGE.length; i++) if (EDGE[i][0] >= u) { const [u0, y0] = EDGE[i - 1], [u1, y1] = EDGE[i]; return u1 === u0 ? y1 : y0 + (y1 - y0) * (u - u0) / (u1 - u0); }

// n well-spread points inside the leaf (best-candidate sampling with a seeded generator)
function scatter(n, seed) {

function mkBug(i, p, rnd) {

}

// --- geometry ------------------------------------------------------------------------------------------------
function layout(w, h, v) {
  let rw = w, rh = h, jr = null;
  if (v === 'give') {
    if (w >= h * 1.15) { rw = w * .6; jr = { x: rw, y: 0, w: w - rw, h }; }

  }
  const L = Math.min(rw * (jr ? .9 : .84), rh * (jr ? 1.12 : 1.08));

  G = { w, h, cx: rw / 2 + L * .035, cy: rh / 2, L, bs: clamp(L * .085, 24, 34), jr, jar: null };

    const jw = Math.min(jr.w * .72, jr.h * .8), jh = Math.min(jr.h * .88, jw * 1.2);

  }
}
const leafPt = (u, v) => ({ x: G.cx + G.L * (u * COS - v * SIN), y: G.cy + G.L * (u * SIN + v * COS) });

  return { x: J.cx + (col - (cols - 1) / 2) * sp, y: J.y0 + J.jh - 9 - bj * .75 - row * rowH };
}
const target = (b) => (b.jar >= 0 && G.jar ? jarSlot(b.jar) : leafPt(b.nu, b.nv));

// --- backdrop: sky, bokeh and the leaf, painted once per size ------------------------------------------------
const bgc = document.createElement('canvas');
let bgKey = '';
function drawBg(c, w, h) {
  const d = c.getTransform().a, key = [w, h, d, G.cx | 0, G.cy | 0, G.L | 0].join();
  if (key !== bgKey) {
    bgKey = key; bgc.width = Math.round(w * d); bgc.height = Math.round(h * d);
    const b = bgc.getContext('2d'); b.setTransform(d, 0, 0, d, 0, 0); paintBg(b, w, h, d);

function paintBg(b, w, h, d) {
  b.save();

  inJar.forEach((b) => paintBadge(c, b, t, true, g.verdict === 'over' && b.jar >= n));
  jarFront(c, 0);
  c.restore();
  g.bugs.filter((b) => b.flying).forEach((b) => paintBug(c, b, t, b.jar >= 0));
  g.bugs.forEach((b) => { if (b.popAt > 1e9 && b.landAt && !b.fly) b.popAt = b.landAt; });
  g.conf = g.conf.filter((p) => p.life > 0);
  for (const p of g.conf) {
    p.vy += 520 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    c.save(); c.globalAlpha = clamp(p.life * 2, 0, 1); c.fillStyle = p.col; c.beginPath(); c.arc(p.x, p.y, p.r, 0, Math.PI * 2); c.fill(); c.restore();
  }
}

// --- the two secrets -------------------------------------------------------------------------------------------
function newFlash() {
  const order = [2, 3, 4, 5, 6]; for (let i = 4; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  return { order, r: 0, phase: 'ready', t0: 0, pick: null, score: 0 };
}
function drawFlash(c, t) {
  const F = S.fl, w = G.w, h = G.h, cs = Math.min(w, h) * .52, x = w / 2 - cs / 2, y = h / 2 - cs / 2 - 10, rad = cs * .16;
  if (F.phase === 'show' && t - F.t0 > 1) { F.phase = 'ask'; render(); }
  const face = F.phase === 'show' || F.phase === 'result', truth = F.order[F.r];
  c.save();
  c.shadowColor = 'rgba(0,0,0,.45)'; c.shadowBlur = 26; c.shadowOffsetY = 12;
  c.fillStyle = face ? CREAM : '#16243B'; c.beginPath(); c.roundRect(x, y, cs, cs, rad); c.fill();
  c.shadowColor = 'transparent';
  c.lineWidth = 3; c.strokeStyle = F.phase === 'result' ? (F.pick === truth ? GOOD : BAD) : face ? INK : GOLD; c.stroke();
  if (face) {
    const k = F.phase === 'show' ? ease(clamp((t - F.t0) / .12, 0, 1)) : 1, pr = cs * .095 * k;
    for (const [px, py] of PIPS[truth]) {
      const X = w / 2 + px * cs * .27, Y = y + cs / 2 + py * cs * .27, g = c.createRadialGradient(X - pr * .3, Y - pr * .3, pr * .1, X, Y, pr);
      g.addColorStop(0, '#FF6B5E'); g.addColorStop(1, '#D7261E');
      c.fillStyle = g; c.beginPath(); c.arc(X, Y, pr, 0, Math.PI * 2); c.fill(); c.lineWidth = 1.5; c.strokeStyle = 'rgba(70,8,8,.8)'; c.stroke();
    }
  } else if (F.phase === 'ready') {
    c.fillStyle = GOLD; c.beginPath(); c.moveTo(w / 2 - cs * .12, y + cs / 2 - cs * .17); c.lineTo(w / 2 - cs * .12, y + cs / 2 + cs * .17); c.lineTo(w / 2 + cs * .2, y + cs / 2); c.closePath(); c.fill();
  } else {
    c.fillStyle = GOLD; c.font = `900 ${cs * .56}px Nunito, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('?', w / 2, y + cs / 2 + cs * .03);
  }
  c.restore();
  if (F.phase === 'result') pill(c, String(truth), w / 2, y + cs + 34, '900 26px Nunito, sans-serif', GOLD);
}
function newAnts() {
  const r = rng(77);
  return { t0: now(), g: null, step: 0, ants: Array.from({ length: 47 }, (_, i) => ({ i, jx: (r() - .5) * 5, jy: (r() - .5) * 5, ph: r() * 6.28 })) };
}
function drawAnt(c, x, y, len, ang, ph, walk) {
  c.save(); c.translate(x, y); c.rotate(ang);
  const l = len;
  c.fillStyle = 'rgba(6,28,14,.3)'; c.beginPath(); c.ellipse(l * .08, l * .14, l * .24, l * .52, 0, 0, Math.PI * 2); c.fill();
  c.strokeStyle = '#1a110b'; c.lineWidth = Math.max(.9, l * .07); c.lineCap = 'round';
  for (let k = 0; k < 3; k++) for (const s of [-1, 1]) {
    const wg = walk ? Math.sin(ph + k * 2.1 + (s > 0 ? 3.14 : 0)) * l * .1 : 0, y0 = -l * .2 + k * l * .15;
    c.beginPath(); c.moveTo(0, y0); c.lineTo(s * l * .36, y0 + wg + (k - 1) * l * .08); c.stroke();
  }
  c.lineWidth = Math.max(.8, l * .05);
  for (const s of [-1, 1]) { c.beginPath(); c.moveTo(s * l * .05, -l * .38); c.lineTo(s * l * .22, -l * .62); c.stroke(); }
  const g = c.createRadialGradient(-l * .06, l * .18, l * .02, 0, l * .26, l * .3); g.addColorStop(0, '#5A3E2B'); g.addColorStop(1, '#241810');
  c.fillStyle = g; c.beginPath(); c.ellipse(0, l * .26, l * .17, l * .25, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#2B1B13'; c.beginPath(); c.ellipse(0, -l * .04, l * .11, l * .13, 0, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.arc(0, -l * .3, l * .12, 0, Math.PI * 2); c.fill();
  c.restore();
}
function drawAnts(c, t) {
  const A = S.A, w = G.w, h = G.h, g = A.g;
  const sp = w * .235, dxs = Math.min(15, sp * .13), dys = dxs * 1.5, au = clamp(dxs * 1.2, 9, 17);
  const slot = (i) => {
    if (i < 40) { const gr = i / 10 | 0, k = i % 10; return { x: w / 2 + (gr - 1.5) * sp + ((k % 5) - 2) * dxs, y: h * .34 + ((k / 5 | 0) - .5) * dys }; }
    return { x: w / 2 + (i - 40 - 3) * Math.min(30, w * .075), y: h * .68 };
  };
  const trail = (a, tt) => {
    const s = (a.i / 47 + (tt - A.t0) * .045) % 1, A2 = h * .2, ph = s * Math.PI * 3 + .6, dx = w + 16, dy = A2 * Math.cos(ph) * Math.PI * 3;
    return { x: -8 + dx * s + a.jx, y: h * .5 + A2 * Math.sin(ph) + a.jy, ang: Math.atan2(dx, -dy) };
  };
  const start = (i) => g.t0 + (i < 40 ? (i / 10 | 0) : 4) * 1.4 + (i < 40 ? i % 10 : i - 40) * .05;
  let step = 0;
  for (const a of A.ants) {
    let p = trail(a, t), walk = true;
    if (g) {
      const e = (t - start(a.i)) / .7;
      if (e > 0) {
        const f = trail(a, start(a.i)), sl = slot(a.i), q = ease(clamp(e, 0, 1)), dir = Math.atan2(sl.x - f.x, -(sl.y - f.y));
        p = { x: f.x + (sl.x - f.x) * q, y: f.y + (sl.y - f.y) * q, ang: e >= 1 ? 0 : dir * (1 - ease(clamp((e - .7) / .3, 0, 1))) };
        walk = e < 1;
      }
    }
    drawAnt(c, p.x, p.y, au, p.ang, t * 14 + a.ph, walk);
  }
  if (g) {
    const rdy = (k) => g.t0 + k * 1.4 + .45 + .7;
    for (let k = 0; k < 4; k++) {
      const pr = clamp((t - rdy(k)) / .6, 0, 1);
      if (pr > 0) {
        step = k + 1;
        const pts = Array.from({ length: 10 }, (_, j) => { const s = slot(k * 10 + j); return [s.x, s.y]; });
        rope(c, paddedHull(pts, au * .62), ease(pr), LASSO[k]);
        if (pr >= 1) pill(c, '10', w / 2 + (k - 1.5) * sp, h * .34 - dys - 16, '900 14px Nunito, sans-serif', '#fff', 'rgba(14,20,34,.8)');
      }
    }
    if (t >= g.t0 + 4 * 1.4 + 1.3) { step = 5; pill(c, '4 × 10 + 7 = 47', w / 2, h * .86, '900 22px Nunito, sans-serif', GOLD); }
  }
  if (A.step !== step) { A.step = step; render(); }
}

// --- main draw loop ----------------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt) => {
  const t = now(), v = lab.view;
  layout(w, h, v);
  drawBg(c, w, h);
  if (v === 'count' && S.sec === 'ants') return drawAnts(c, t);
  if (v === 'count' && S.sec === 'flash') return drawFlash(c, t);
  const R = v === 'count' ? S.c : v === 'move' ? S.m : S.g;
  updateBugs(R.bugs, dt, t);
  if (v === 'move') drawThreads(c, t, dt);
  if (v === 'count') drawCount(c, t); else if (v === 'move') drawMove(c, t); else drawGive(c, t, dt);
});

// --- input -------------------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function hit(bugs, x, y) {
  const lim = Math.max(22, G.bs * .75);
  let best = null, bd = lim;
  for (const b of bugs) { const d = Math.hypot((b.dx ?? b.x) - x, (b.dy ?? b.y) - y); if (d < bd) { bd = d; best = b; } }
  return best;
}
$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  if (lab.view === 'count' && !S.sec) tapCount(x, y); else if (lab.view === 'give') tapGive(x, y);
});
function tapCount(x, y) {
  const C = S.c;
  if (C.phase !== 'count') return;
  const b = hit(C.bugs, x, y); if (!b) return;
  if (b.counted) { // one number each: no second number
    b.shakeAt = now(); sfx.bad();
    $('valSub').textContent = T[lang].c.twice; clearTimeout(S.twT); S.twT = setTimeout(() => { $('valSub').textContent = ''; }, 1400);
    return;
  }
  C.count++; b.counted = true; b.num = C.count; b.flipAt = b.popAt = now(); sfx.tick();
  if (C.count === C.n) { C.phase = 'done'; setTimeout(() => { if (S.c === C && C.phase === 'done') { C.phase = 'ask'; render(); showStage(); } }, 700); }
  render();
}
function tapGive(x, y) {
  const g = S.g; if (g.locked) return;
  const b = hit(g.bugs, x, y); if (!b) return;
  if (b.jar < 0) {
    if (g.jar.length >= 30) return;
    b.jar = g.jar.length; g.jar.push(b); b.num = b.jar + 1; b.popAt = 9e9; b.landAt = 0; // the badge pops when it lands
    startFly(b, 0, .75, b.i % 2 ? 1 : -1); sfx.click();
  } else {
    g.jar.splice(g.jar.indexOf(b), 1); b.jar = -1; b.num = 0; g.jar.forEach((q, i) => { q.jar = i; q.num = i + 1; });
    startFly(b, 0, .7, b.i % 2 ? 1 : -1); sfx.tick();
  }
  g.verdict = null; render();
}

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, C = S.c, m = S.m, g = S.g, F = S.fl;
  if (a === 'sec') {
    const k = b.dataset.k;
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === k ? null : k;
    if (S.sec === 'flash') S.fl = newFlash(); else if (S.sec === 'ants') S.A = newAnts();
    sfx.click();
  } else if (a === 'pick') {
    if (C.phase !== 'ask') return;
    C.pick = b.dataset.k; C.phase = 'reveal'; C.revealAt = now(); S.ans.count = true; (C.pick === 'ok' ? sfx.good : sfx.bad)(); showStage();
  } else if (a === 'cnext') {
    S.cr = (S.cr + 1) % COUNTS.length; S.c = newCount(S.cr); sfx.click();
  } else if (a === 'mpick') {
    if (m.phase !== 'predict') return;
    const j = +b.dataset.j, right = j === (m.q === 2 ? 0 : 2);
    m.pick = j; m.phase = 'reveal'; S.ans.move = true; (right ? sfx.good : sfx.bad)();
    if (m.q === 0) { setLayout(m, 'scat'); m.thr = 1; } else if (m.q === 1) m.thr = 1;
    else { m.arrowAt = now(); m.ren = { t0: now() + .7, done: [] }; }
    showStage();
  } else if (a === 'mnext') {
    sfx.click();
    if (m.q < 2) { m.q++; m.thr = 0; setLayout(m, m.q === 1 ? 'bunch' : 'row'); }
    else { m.q = 0; m.ren = null; m.arrowAt = -9; m.bugs.forEach((q, i) => { q.num = i + 1; q.popAt = now() + i * .05; }); }
    m.pick = null; m.phase = 'predict';
  } else if (a === 'gdone') {
    const n = GN[g.r], k = g.jar.length;
    if (k === n) { g.verdict = 'ok'; g.locked = true; g.shakeAt = now(); confetti(g); sfx.good(); }
    else { g.verdict = k > n ? 'over' : 'under'; sfx.bad(); }
    showStage();
  } else if (a === 'gnext') {
    const r = (g.r + 1) % GN.length, old = g.bugs;
    S.g = newGive(r); S.g.bugs.forEach((q, i) => { q.x = old[i].x; q.y = old[i].y; q.da = old[i].da; startFly(q, i * .03, .8, i % 2 ? 1 : -1); }); sfx.click();
  } else if (a === 'fstart') {
    if (!F) return;
    if (F.phase === 'result' && F.r === 4) S.fl = newFlash(); else { if (F.phase === 'result') F.r++; F.phase = 'show'; F.t0 = now(); F.pick = null; }
    sfx.click();
  } else if (a === 'fnum') {
    if (F.phase !== 'ask') return;
    F.pick = +b.dataset.k; const ok = F.pick === F.order[F.r]; if (ok) F.score++; F.phase = 'result'; (ok ? sfx.good : sfx.bad)();
  } else if (a === 'agroup') {
    if (!S.A.g) S.A.g = { t0: now() }; sfx.click();
  }
  render();
});
function setLayout(m, name) {
  const P = name === 'row' ? ROW : name === 'scat' ? SCAT : BUNCH; m.layout = name;
  m.bugs.forEach((b, i) => { b.nu = P[i][0]; b.nv = P[i][1]; startFly(b, i * .07, .95 + (i % 3) * .08, i % 2 ? 1 : -1); });
}
function confetti(g) {
  const J = G.jar, cols = [GOLD, GOOD, '#FF6B5E', CREAM, '#8FD0FF'];
  for (let i = 0; i < 44; i++) {
    const a = -Math.PI / 2 + (Math.random() - .5) * 1.9, sp = 160 + Math.random() * 260;
    g.conf.push({ x: J.cx + (Math.random() - .5) * J.jw * .4, y: J.y0 + 6, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, col: cols[i % cols.length], r: 2.5 + Math.random() * 3, life: 1.1 + Math.random() * .6 });
  }
}

// --- one render per change: controls, readout and the state card -------------------------------------------------
const chips = () => {
  const t = T[lang], open = secret.unlocked();
  const sc = (k, emo) => `<button class="chip secret ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  return `<div class="chips" style="margin-top:14px">${sc('flash', '👀')}${sc('ants', '🐜')}</div>`;
};
const card = (arr) => lab.setState({ emo: arr[0], title: arr[1], lead: arr[2], body: arr[3], extra: `<div class="fine">${esc(T[lang].fine)}</div>` });

function render() {
  const v = lab.view;
  document.body.dataset.v = v;
  if (v === 'count') renderCount(); else if (v === 'move') renderMove(); else renderGive();
}

function renderCount() {
  const t = T[lang];
  lab.setGlow('rgba(91, 211, 138, .22)');
  if (S.sec === 'flash') return renderFlash(t);
  if (S.sec === 'ants') return renderAnts(t);
  const C = S.c, n = C.n, rv = C.phase === 'reveal', ask = C.phase === 'ask' || rv;
  let h = `<div class="rd">${dotsOf(C.r, COUNTS.length)}</div>`;
  if (!ask) h += `<p class="task">${esc(t.c.start)}</p>`;
  else {
    const lab_ = { ok: n, plus: n + 1, again: t.c.again };
    h += `<p class="task">${esc(t.c.q)}</p><div class="bigrow">${PICKS[C.r].map((k) => `<button class="big ${rv ? (k === 'ok' ? 'rt' : k === C.pick ? 'wr' : '') : ''}" data-act="pick" data-k="${k}"${rv ? ' disabled' : ''}>${esc(String(lab_[k]))}</button>`).join('')}</div>`;
  }
  if (rv) {
    const okp = C.pick === 'ok';
    h += `<div class="verdict ${okp ? 'ok' : 'no'}">${esc(okp ? t.right : C.pick === 'again' ? t.c.whyAgain : t.wrong)}</div>
      <p class="sub2 late" style="--d:1.3s">${esc(t.c.why)}</p><div class="late" style="--d:1.5s"><button class="big go" data-act="cnext">${esc(t.next)}</button></div>`;
  }
  $('ctrlBody').innerHTML = h + chips();
  lab.setReadout(C.count ? String(C.count) : '–', '', '', GOOD);
  card(t.st.count[S.ans.count ? 1 : 0]);
}
function renderFlash(t) {
  const F = S.fl, res = F.phase === 'result', last = res && F.r === 4, truth = F.order[F.r], busy = F.phase === 'show' || F.phase === 'ask';
  const btns = [1, 2, 3, 4, 5, 6].map((k) => `<button class="big ${res ? (k === truth ? 'rt' : k === F.pick ? 'wr' : '') : ''}" data-act="fnum" data-k="${k}"${F.phase === 'ask' ? '' : ' disabled'}>${k}</button>`).join('');
  $('ctrlBody').innerHTML = `<div class="rd">${dotsOf(F.r + (res ? 1 : 0), 5)}</div><div class="numrow">${btns}</div>
    <button class="big go" data-act="fstart"${busy ? ' disabled' : ''}>${last ? '↻' : res ? esc(t.next) : '▶'}</button>
    ${res ? `<div class="verdict ${F.pick === truth ? 'ok' : 'no'}">${esc(F.pick === truth ? t.right : t.wrong)}</div>` : ''}${chips()}`;
  lab.setReadout(last ? `${F.score}/5` : res ? String(truth) : '?', '', '', GOLD);
  card(['👀', t.secrets.flash[0], t.sec.flashText, '']);
}
function renderAnts(t) {
  const A = S.A, st = A.step;
  $('ctrlBody').innerHTML = `<button class="big go" data-act="agroup"${A.g ? ' disabled' : ''}>${esc(t.sec.group)}</button>${chips()}`;
  lab.setReadout(st === 5 ? '4 × 10 + 7 = 47' : st > 0 ? String(st * 10) : '?', '', '', GOLD);
  card(['🐜', t.secrets.ants[0], t.sec.antsText, '']);
}

function moveReadout() {
  const m = S.m, shown = m.phase === 'reveal' && (m.q < 2 || (m.ren && m.ren.done[5]));
  lab.setReadout(shown ? '6' : '?', '', '', GOLD);
}
function renderMove() {
  const t = T[lang], m = S.m, rv = m.phase === 'reveal', q = m.q, opts = q === 2 ? t.m.o3 : t.m.o1, right = q === 2 ? 0 : 2;
  lab.setGlow('rgba(255, 201, 74, .2)');
  let h = `<div class="rd">${dotsOf(q, 3)}</div><p class="task">${esc(t.m['q' + (q + 1)])}</p>
    <div class="bigrow">${opts.map((o, j) => `<button class="big ${rv ? (j === right ? 'rt' : j === m.pick ? 'wr' : '') : ''}" data-act="mpick" data-j="${j}"${rv ? ' disabled' : ''}>${esc(o)}</button>`).join('')}</div>`;
  if (rv) {
    const d = q === 2 ? '3.9s' : '1.6s';
    h += `<div class="verdict ${m.pick === right ? 'ok' : 'no'}">${esc(m.pick === right ? t.right : t.wrong)}</div>
      <p class="sub2 late" style="--d:${d}">${esc(t.m['r' + (q + 1)])}</p><div class="late" style="--d:${d}"><button class="big go" data-act="mnext">${esc(t.next)}</button></div>`;
  }
  $('ctrlBody').innerHTML = h;
  moveReadout();
  card(t.st.move[S.ans.move ? 1 : 0]);
}
function renderGive() {
  const t = T[lang], g = S.g, n = GN[g.r], v = g.verdict;
  lab.setGlow('rgba(143, 208, 255, .2)');
  let h = `<div class="rd">${dotsOf(g.r, GN.length)}</div><p class="task">${esc(t.g.task(n))}</p>`;
  if (v === 'ok') h += `<div class="verdict ok">${esc(t.g.yes(n))}</div><button class="big go" data-act="gnext" style="margin-top:8px">${esc(t.next)}</button>`;
  else h += `<button class="big go" data-act="gdone">${esc(t.g.done)}</button>${v ? `<div class="verdict no">${esc(v === 'over' ? t.g.over : t.g.under)}</div>` : ''}`;
  $('ctrlBody').innerHTML = h;
  lab.setReadout(String(g.jar.length), '', '', '#8FD0FF');
  card(t.st.give);
}
render();
</script>
