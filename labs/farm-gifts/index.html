  } else if (S.sel) { const [a, b] = w.pick(t.cards[S.sel]); st = { emo: '👆', title: a, lead: b, body: '', extra: '' }; }

  else if (placed > 0) { const [a, b] = w.prog(placed); st = { emo: '🧺', title: a, lead: b, body: '', extra: '' }; }
  else st = { emo: '🐄', title: w.start[0], lead: w.start[1], body: '', extra: '' };
  lab.setReadout(S.checked ? S.score : placed, S.checked ? `/ 7 ${w.right}` : `/ 7 ${w.unit}`, '', '#6fbf5f');
  lab.setState(st);
  lab.setFacts(S.checked ? w.facts : []);
}
function renderDay(t) {
  const d = t.d, R = S.res;
  lab.setGlow('rgba(240, 190, 80, .26)');
  const asked = S.pred !== null;
  $('ask2').hidden = asked; $('plan').hidden = !asked;
  $('ask2').innerHTML = asked ? '' : `<div class="q">${esc(d.q)}</div><div class="opts">${['same', 'less', 'more'].map((k) => `<button data-opt="${k}">${esc(d.opts[k])}</button>`).join('')}</div>`;
  const placedIds = Object.keys(S.slots);
  $('chTray').innerHTML = CHORES.filter((id) => S.slots[id] === undefined).map((id) => `<button type="button" class="fg-card ${S.sel === id ? 'sel' : ''}" data-drag="${id}" data-kind="chore" title="${esc(d.chores[id][1])}"><span class="ic">${CHORE_EMO[id]}</span><span>${esc(d.chores[id][0])}</span></button>`).join('');
  $('slots').innerHTML = d.slots.map((nm, i) => `<div class="fg-slot" data-slot="${i}"><h4><i>${SLOT_EMO[i]}</i>${esc(nm)}</h4><div class="items">${placedIds.filter((id) => S.slots[id] === i).map((id) => `<button type="button" class="fg-chip ${S.skip[id] ? 'skip' : ''}" data-drag="${id}" data-kind="chip" title="${esc(d.chores[id][1])}" aria-label="${esc(d.chores[id][1])}">${CHORE_EMO[id]}</button>`).join('')}</div></div>`).join('');
  $('play').textContent = S.played || S.playing ? d.replay : d.play; $('play').disabled = S.slots.milk === undefined || S.playing;
  $('clr2').textContent = d.clear; $('hint2').textContent = d.hint;
  let st;
  const show = S.played && !S.playing && R;
  if (!asked) st = { emo: '🤔', title: d.s0[0], lead: d.s0[1], body: '', extra: '' };
  else if (S.playing) st = { emo: '⏳', title: d.playing[0], lead: d.playing[1], body: '', extra: '' };
  else if (!show) st = S.slots.milk === undefined ? { emo: '📋', title: d.needMilk[0], lead: d.needMilk[1], body: '', extra: '' } : { emo: '📋', title: d.s1[0], lead: d.s1[1], body: '', extra: '' };
  else if (S.dirty) st = { emo: '📋', title: d.dirty[0], lead: d.dirty[1], body: '', extra: '' };
  else if (S.vNow) st = { emo: S.verdict ? '✅' : '🤔', title: S.verdict ? d.ok : d.no, lead: d.vlead, body: `${d.vbody} ${R.shorn ? d.sheared : ''}`.trim(), extra: `<div class="fine">${esc(d.fine)}</div>` };
  else if (R.perfect) st = { emo: '⭐', title: d.perfectT, lead: d.perfectL, body: d.sheared, extra: `<div class="fine">${esc(d.fine)}</div>` };
  else {
    const why = [!R.fed && 'feed', !R.wat && 'water', !R.cl && 'straw', !R.milked && 'milk', !R.collected && 'eggs', !R.shorn && 'shear'].filter(Boolean).map((k) => d.why[k]);
    st = { emo: '🌾', title: d.res(Math.round(R.milk * 100), R.eggs), lead: why[0] ?? '', body: `${why.slice(1).join(' ')} ${R.shorn ? d.sheared : ''}`.trim(), extra: `<div class="fine">${esc(d.fine)}</div>` };
  }
  lab.setState(st);
  lab.setReadout(show ? `🥛 ${Math.round(R.milk * 100)}%` : '–', show ? `🥚 ${R.eggs} · ${d.valSub}` : d.valSub0, show && R.perfect ? '⭐' : '', '#f0be50');
  lab.setFacts(show ? d.facts : []);
}
function renderMade(t) {
  const m = t.m, it = S.item, st = S.v3[it], locked = LOCKED.includes(it) && !S.checked, done = ITEMS.filter((k) => S.v3[k].c).length;
  lab.setGlow('rgba(200, 140, 90, .26)');
  $('itTray').innerHTML = ITEMS.map((k) => `<button type="button" class="fg-card ${S.item === k ? 'sel' : ''} ${LOCKED.includes(k) && !S.checked ? 'lock' : ''} ${S.v3[k].c ? 'done' : ''}" data-drag="${k}" data-kind="item"><span class="ic">${k === 'jumper' ? jumperSvg : ({ boots: '🥾', candle: '🕯️', yoghurt: '🥣', pancakes: '🥞' })[k]}</span><span>${esc(m.items[k])}</span>${LOCKED.includes(k) && !S.checked ? '<span>🔒</span>' : S.v3[k].c ? '<span>✓</span>' : ''}</button>`).join('');
  $('chk3').textContent = m.check; $('chk3').hidden = st.c; $('chk3').disabled = !Object.keys(st.g).length || locked;
  const em = STEP_EMO[it], labs = m.steps[it];
  $('chain').innerHTML = st.c ? `<div class="fg-chain">${labs.map((lb, i) => `${i ? `<span class="ar" style="animation-delay:${i * 0.35 - 0.15}s">→</span>` : ''}<div class="st" style="animation-delay:${i * 0.35}s"><i>${em[i] === 'J' ? jumperSvg : em[i]}</i><b>${esc(lb)}</b></div>`).join('')}</div>` : '';
  let s;
  if (S.note || locked) s = { emo: '🔒', title: m.lock[0], lead: m.lock[1], body: '', extra: '' };
  else if (!st.c) { const [a, b] = m.start(m.items[it]); s = { emo: '🤔', title: a, lead: b, body: '', extra: '' }; }
  else { const names = IT[it].groups.flat().map((a) => t.animals[a]); s = { emo: st.ok ? '✅' : '🤔', title: st.ok ? m.ok : m.no, lead: m.x[it], body: st.ok ? '' : m.from([...new Set(names)].join(', ')), extra: '' }; }
  lab.setState(s);
  lab.setReadout(`${done}/5`, m.valSub, '', '#c88c5a');
  lab.setFacts(st.c ? [m.facts[it]] : []);
}
function renderSecret(t) {
  const k = S.sec, sc = t.sec[k], f = S.secV;
  lab.setGlow(k === 'milk' ? 'rgba(220, 230, 255, .26)' : 'rgba(245, 180, 40, .28)');
  $('secR').value = Math.round(f * 100); $('secRL').textContent = sc.slider; $('secBack').textContent = t.sec.close;
  const val = k === 'milk' ? (MILK_L * f).toFixed(1).replace(/\.0$/, '') : Math.round(FLOWERS * f).toLocaleString(lang);
  lab.setReadout(val, k === 'milk' ? `${sc.unit} · ${sc.cnt(Math.floor(f * GLASSES))}` : sc.unit, '', k === 'milk' ? '#9fb8e0' : '#f2b02c');
  lab.setState({ emo: k === 'milk' ? '🥛' : '🍯', title: sc.title, lead: sc.lead, body: '', extra: '' });
  lab.setFacts([sc.fact]);
}
