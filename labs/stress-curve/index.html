  if (S.run) {

    while (R.nl < 12 && R.t >= T0 + R.nl * K.b + (K.n - 1) * K.b) { (R.out[R.nl] ? sfx.tick : sfx.bad)(); R.nl++; }

    const old = S.b.t; S.b.t = Math.min(7, S.b.t + dt / .55);

function startRun() {
  if (S.run) return; const task = taskNow(), K = PK[task], p = S.p, caught = Math.round(perfAt(task, p) * 12), out = [];
  for (let j = 0; j < 12; j++) out.push(Math.floor((j + 1) * caught / 12) - Math.floor(j * caught / 12) === 1);
  S.run = { task, p, t: 0, out, caught, nl: 0, dur: T0 + 11 * K.b + (K.n - 1) * K.b + .6, mood: moodOf(task, p) };
  sfx.click(); render();
}
function finishRun() {
  const R = S.run, arr = S.dots[R.task], y = R.caught / 12, ex = arr.find((d) => d.p === R.p);
  if (ex) { ex.y = y; ex.born = S.T; } else arr.push({ p: R.p, y, born: S.T });

}

  <div id="scBuck" hidden><div class="sc-lbl" id="scTL"></div><div class="chips sc-taps" id="scTaps"></div>
    <div class="sc-btns"><button type="button" class="btn ghost" id="scReplay" data-act="replay"></button></div></div>
  <div id="scA" hidden><div class="sc-lbl" id="scAL"></div><input id="scAP" class="big" type="range" min="0" max="100" step="10" value="90">
    <div class="chips" id="scFr" style="margin-top:8px"></div></div>
  <div id="scB" hidden><div class="sc-lbl" id="scBL"></div><input id="scBH" class="big" type="range" min="4" max="10" step="0.5" value="8" style="--track:linear-gradient(90deg,#ef4444,#3b82f6)"></div>
  <div class="chips" id="scSec"></div>`;
$('scP').style.setProperty('--track', 'linear-gradient(90deg, #3b82f6, #ef4444)');
$('scAP').style.setProperty('--track', 'linear-gradient(90deg, #3b82f6, #ef4444)');

$('ctrlBody').addEventListener('input', (ev) => {
  const id = ev.target.id;
  if (id === 'scP') { S.p = +ev.target.value; sfx.tick(); render(); }
  else if (id === 'scAP') { S.sp = +ev.target.value; render(); }
  else if (id === 'scBH') { S.sh = +ev.target.value; render(); }
});
$('ctrlBody').addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, v = lab.view;
  if (a === 'g1') { if (S.g1 === null) { S.g1 = el.dataset.k; sfx.click(); render(); } }
  else if (a === 'g2') { if (S.g2 === null) { S.g2 = el.dataset.k; sfx.click(); render(); } }
  else if (a === 'g3') { if (S.b.guess === null) { S.b.guess = el.dataset.k; S.b.t = 0; S.b.go = true; sfx.click(); render(); showStage(); } }
  else if (a === 'task') { if (!S.run) { S.task = el.dataset.k; sfx.click(); render(); } }
  else if (a === 'run') { startRun(); showStage(); }
  else if (a === 'skip') { if (S.run) S.run.t = S.run.dur; }
  else if (a === 'curve') { const k = taskNow(); if (S.dots[k].length >= 5 && !S.shown[k]) { S.shown[k] = true; sfx.snap(); render(); showStage(); } }
  else if (a === 'tap') setTap(el.dataset.k);
  else if (a === 'replay') { S.b.t = 0; S.b.go = true; S.b.done = false; sfx.click(); render(); }
  else if (a === 'frame') { S.frame = +el.dataset.k; sfx.click(); render(); }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === el.dataset.k ? null : el.dataset.k; S.run = null; sfx.click(); render(); showStage();
  }
  void v;
});

// --- render -------------------------------------------------------------------------------------------------
const show = (id, on) => { $(id).hidden = !on; };
const SHAPE = { up: 'M6 34 L54 8', down: 'M6 8 L54 34', hill: 'M6 36 Q30 -10 54 36' };
const svg = (k) => `<svg viewBox="0 0 60 44" aria-hidden="true"><path d="M5 40 H56 M5 4 V40" stroke="currentColor" stroke-opacity=".35" fill="none" stroke-width="1.5"/><path d="${SHAPE[k]}" stroke="currentColor" fill="none" stroke-width="3.2" stroke-linecap="round"/></svg>`;

function readout() {
  const t = T[lang], v = lab.view;
  if (S.sec === 'a') { lab.setReadout(String(Math.round(70 + S.sp * .6)), t.bpm, S.frame ? t.exc : t.fear, '#ff6b8b'); return; }
  if (S.sec === 'b') { lab.setReadout(`${Math.round(sleepF(S.sh) * 98)}%`, t.best, t.sleepL(nh(S.sh)), '#7a8cff'); return; }
  if (v === 'bucket') {
    if (S.b.guess === null) { lab.setReadout('?', '', '', '#5ab4ff'); return; }
    const r = curWeek(), A = bucketAt(r, S.b.t), od = r.findIndex((x) => x.sp > 0);
    lab.setReadout(String(Math.round(A.lvl)), t.lvl, od >= 0 && S.b.t >= 7 ? `💦 ${t.days[od]}` : '', '#5ab4ff'); return;
  }
  const asking = (v === 'curve' ? S.g1 : S.g2) === null;
  if (asking) { lab.setReadout('?', '', '', '#ffb347'); return; }
  const col = PK[taskNow()].col;
  if (S.run) { const R = S.run, cs = R.out.slice(0, R.nl).filter(Boolean).length; lab.setReadout(`${cs}/${R.nl}`, t.sub, t.pr(R.p), col); }
  else if (S.last) lab.setReadout(`${S.last.caught}/12`, t.sub, t.pr(S.last.p), col);
  else lab.setReadout('–', t.sub, '', col);
}

function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  document.body.dataset.v = v;
  const open = secret.unlocked();
  $('scSec').innerHTML = ['a', 'b'].map((k) => `<button type="button" class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${t.secEmo[k]} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  ['scAsk', 'scPlay', 'scBuck', 'scA', 'scB'].forEach((id) => show(id, false));
  if (sec === 'a') renderSecA(t); else if (sec === 'b') renderSecB(t); else if (v === 'bucket') renderBucket(t); else renderCurve(t, v);
  readout();
}

function renderSecA(t) {
  const p = S.sp; show('scA', true);
  $('scAL').innerHTML = `${esc(t.press(p))}`; if (+$('scAP').value !== p) $('scAP').value = p;
  $('scFr').innerHTML = [[0, t.fear], [1, t.exc]].map(([k, l]) => `<button type="button" class="chip${S.frame === k ? ' on' : ''}" data-act="frame" data-k="${k}">${esc(l)}</button>`).join('');
  lab.setGlow('rgba(255,110,140,.25)'); lab.setFacts([]);
  lab.setState(S.frame ? { emo: '🤩', title: t.sa.t2, lead: t.sa.l2, body: '' } : { emo: '🦋', title: t.sa.t1, lead: t.sa.l1, body: '' });
}
function renderSecB(t) {
  show('scB', true); $('scBL').innerHTML = esc(t.sleepL(nh(S.sh))); if (+$('scBH').value !== S.sh) $('scBH').value = S.sh;
  const d = Math.max(0, 9 - S.sh) * 5, sb = t.sb(d);
  lab.setGlow('rgba(110,120,255,.25)'); lab.setFacts([]); lab.setState({ emo: '🛌', title: sb[0], lead: sb[1], body: '' });
}

function renderCurve(t, v) {
  const first = v === 'curve', task = first ? 'easy' : S.task, g = first ? S.g1 : S.g2, asking = g === null;
  const done = S.shown[first ? 'easy' : 'hard'], correct = first ? 'hill' : 'less', col = PK[task].col;
  const keys = first ? ['up', 'down', 'hill'] : ['more', 'less', 'same'];
  const cls = (k) => (done ? (k === correct ? ' good' : k === g ? ' bad' : '') : k === g ? ' pick' : '');
  const dis = asking ? '' : ' disabled';
  let h = `<div class="sc-q">${esc(first ? t.ask1 : t.ask2)}</div>`;
  h += first ? `<div class="sc-shapes">${keys.map((k) => `<button type="button" class="sc-shape${cls(k)}" data-act="g1" data-k="${k}"${dis}>${svg(k)}<span>${esc(t.shapes[k])}</span></button>`).join('')}</div>`
    : `<div class="chips">${keys.map((k) => `<button type="button" class="chip sc-opt${cls(k)}" data-act="g2" data-k="${k}"${dis}>${esc(t.opts2[k])}</button>`).join('')}</div>`;
  const ok = g === correct;
  if (done) h += `<div class="sc-verdict ${ok ? 'ok' : 'no'}">${esc(ok ? (first ? t.s1right[0] : t.s2right[0]) : (first ? t.s1wrong('')[0] : t.s2wrong[0]))}</div>`;
  $('scAsk').innerHTML = h; show('scAsk', true);
  lab.setGlow('rgba(255,170,80,.25)');
  if (asking) {
    show('scPlay', false); lab.setState({ emo: '🤔', title: first ? t.ask1 : t.ask2, lead: '', body: '' }); lab.setFacts([]); return;
  }
  show('scPlay', true);
  $('scTask').style.display = first ? 'none' : '';
  $('scTask').innerHTML = first ? '' : ['hard', 'easy'].map((k) => `<button type="button" class="chip${S.task === k ? ' on' : ''}" data-act="task" data-k="${k}">${esc(t.tasks[k])}</button>`).join('');
  $('scPL').innerHTML = esc(t.press(S.p)); if (+$('scP').value !== S.p) $('scP').value = S.p;
  $('scLo').textContent = t.lo; $('scHi').textContent = t.hi;
  $('scRun').textContent = t.run; $('scRun').disabled = !!S.run; $('scSkip').textContent = t.skip; $('scSkip').hidden = !S.run;
  const n = S.dots[task].length, canShow = first || task === 'hard';
  $('scCurve').textContent = t.showCurve; $('scCurve').hidden = !canShow || S.shown[task] || !!S.run; $('scCurve').disabled = n < 5;
  $('scNote').textContent = S.shown[task] || !canShow ? '' : n >= 5 ? t.enough : t.need(5 - n);
  // state card
  let st;
  if (done) {
    st = first ? (ok ? t.s1right : t.s1wrong(t.shapeName[g])) : (ok ? t.s2right : t.s2wrong);
    st = { emo: ok ? '✅' : '⛰️', title: st[0], lead: st[1], body: '' };
  } else if (S.last && !S.run && S.last.task === task) {
    const m = moodOf(task, S.last.p); st = { emo: { bored: '🥱', flow: '😎', shaky: '😰' }[m], title: t.caught(S.last.caught), lead: t.moodLead[m], body: '' };
  } else { const s = first ? t.s1idle : t.s2idle; st = { emo: '🎪', title: s[0], lead: s[1], body: '' }; }
  lab.setState(st);
  if (done) lab.setFacts([{ emo: first ? '🐭' : '🧪', text: first ? t.facts1 : t.facts2, src: first ? SRC[1] : SRC[2] }]); else lab.setFacts([]);
  void col;
}

function renderBucket(t) {
  const b = S.b, asking = b.guess === null, r = curWeek(), od = r.findIndex((x) => x.sp > 0), correct = 'yes';
  const done = !asking && b.done;
  const cls = (k) => (done && !b.touched ? (k === correct ? ' good' : k === b.guess ? ' bad' : '') : k === b.guess ? ' pick' : '');
  let h = `<div class="sc-q">${esc(t.ask3)}</div><div class="chips">${['yes', 'no'].map((k) => `<button type="button" class="chip sc-opt${cls(k)}" data-act="g3" data-k="${k}"${asking ? '' : ' disabled'}>${esc(t.opts3[k])}</button>`).join('')}</div>`;
  h += `<div class="sc-key">${esc(t.keyL)} ${Object.keys(ST).map((k) => `${ST[k].e} ${esc(t.st[k])}`).join(' · ')}</div>`;
  if (done && !b.touched) h += `<div class="sc-verdict ${b.guess === correct ? 'ok' : 'no'}">${esc(b.guess === correct ? (lang === 'ru' ? 'Верно!' : lang === 'hu' ? 'Így van!' : 'Right!') : (lang === 'ru' ? 'Не совсем.' : lang === 'hu' ? 'Nem egészen.' : 'Not this time.'))}</div>`;
  $('scAsk').innerHTML = h; show('scAsk', true);
  lab.setGlow('rgba(90,180,255,.25)');
  if (asking) { show('scBuck', false); lab.setState({ emo: '🤔', title: t.ask3, lead: '', body: '' }); lab.setFacts([]); return; }
  show('scBuck', true);
  $('scTL').textContent = t.tapsL;
  $('scTaps').innerHTML = Object.keys(TAPD).map((k) => `<button type="button" class="chip${b.taps[k] ? ' on' : ''}" data-act="tap" data-k="${k}">${esc(t.taps[k])}</button>`).join('');
  $('scReplay').textContent = t.runWeek;
  if (!done) { lab.setState({ emo: '🪣', title: t.running[0], lead: t.running[1], body: '' }); lab.setFacts([]); return; }
  const mx = Math.round(Math.max(...r.map((x) => x.L1)));
  let st;
  if (!b.touched) st = b.guess === correct ? [t.spill(t.dayIn[od]), t.b1[0]] : [t.spill(t.dayIn[od]), t.b1[1]];
  else if (od >= 0) st = [t.spill(t.dayIn[od]), t.b3];
  else st = [t.noSpill, t.b2(mx)];
  const head = !b.touched ? (b.guess === correct ? (lang === 'ru' ? 'Верно! ' : lang === 'hu' ? 'Így van! ' : 'Right! ') : '') : '';
  lab.setState({ emo: od >= 0 ? '💦' : '😌', title: head + st[0], lead: st[1], body: '', extra: `<div class="sc-fine">${esc(t.safe)}</div>` });
  lab.setFacts([{ emo: '⚡', text: t.facts3, src: SRC[3] }]);
}
render();
</script>
</body>
</html>
