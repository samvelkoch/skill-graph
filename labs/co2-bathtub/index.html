// --- the simple model and its numbers (all from the Global Carbon Budget 2026, Friedlingstein et al., ESSD preprint essd-2026-895) --------
// 1 ppm = 2.124 GtC and 1 GtC = 3.664 GtCO2  ->  1 ppm = 7.78 GtCO2
const PPM_GT = 2.124 * 3.664;
const C_PRE = 278;          // ppm, "around 278 ppm in 1750"
const C0 = 425.6;           // ppm, global average over 2025
const E0 = 42.8;            // GtCO2 per year, total anthropogenic emissions 2025 (fossil fuels + land use), "42.8 ± 3.2 GtCO2"
const SINK_SHARE = 0.49;    // land 22% + ocean 27% of total emissions, decade 2016-2025
const OCEAN_PART = 27 / 49; // the ocean's part of the sinks
// drain = K * (level - C_PRE): K is chosen so that at today's level the sinks take 49% of today's emissions
const K = SINK_SHARE * E0 / (C0 - C_PRE);   // about 0.142 GtCO2 per year per ppm
const YEARS = 50, YEAR0 = 2025;
const sinkAt = (C) => K * (C - C_PRE);
// one simulated year: the level changes by (in - out) / 7.78 ppm
const stepC = (C, E) => C + (E - sinkAt(C)) / PPM_GT;

// three emission paths, from today's tap
const PATH_KEYS = ['flat', 'cut2', 'zero'];
const PATH_E = { flat: () => E0, cut2: (t) => E0 * 0.98 ** t, zero: (t) => E0 * Math.max(0, 1 - t / 25) };
const PATH_COL = { flat: '#f0a24a', cut2: '#f5d54c', zero: '#3ddc97' };
const PATH_DASH = { flat: [], cut2: [7, 4], zero: [2, 4] };
const PATHS = {};
for (const k of PATH_KEYS) {
  const E = [], C = [C0];
  for (let t = 0; t <= YEARS; t++) { E.push(PATH_E[k](t)); if (t < YEARS) C.push(stepC(C[t], E[t])); }
  const peak = C.indexOf(Math.max(...C));
  PATHS[k] = { E, C, peak, shape: peak >= YEARS - 2 ? 0 : 1 }; // 0 = keeps rising, 1 = peaks then falls (the sketch buttons: 0, 1, 2 = speeds up)
}
const ANS1 = E0 > sinkAt(C0) ? 1 : 0; // tap bigger than the drain -> the level keeps rising

// --- real data (every number fetched; see the fact sources) -----------------------------------------------------------------------
// CO2 level: NOAA GML, Mauna Loa annual means (gml.noaa.gov/ccgg/trends/data.html -> co2_annmean_mlo.txt)
// Emissions: fossil CO2, Global Carbon Budget 2026 via Our World in Data (ourworldindata.org/grapher/annual-co2-emissions-per-country), tonnes / 1e9
const RY = [1960, 1970, 1980, 1990, 2000, 2010, 2020, 2025];
const RM = [316.91, 325.68, 338.76, 354.45, 369.71, 390.10, 414.21, 427.35];
const RE = [9.384926, 14.693279, 19.228922, 22.779531, 25.507824, 33.323946, 35.095286, 38.995104];
const R_RISE = RM.slice(1).map((m, i) => (m - RM[i]) / (RY[i + 1] - RY[i]));  // ppm per year between two listed years
const E_RATIO = Math.round(RE[7] / RE[0]);                                     // about 4
const R_RATIO = Math.round(R_RISE[6] / R_RISE[0]);                             // about 3
const DIP = Math.round((37.060624 - RE[6]) / 37.060624 * 100);                 // 2019 -> 2020 emissions, about 5 %
const DIP_RISE = 414.21 - 411.65;                                              // Mauna Loa 2019 -> 2020, ppm
const SHARES = { air: 48, ocean: 27, land: 22 };                               // GCB 2026, decade 2016-2025, % of total emissions

function yearStep() {
  const out = sinkAt(S.C);
  S.hE[S.t] = S.E; S.hS[S.t] = out;

  S.hE[S.t] = S.E; S.hS[S.t] = sinkAt(S.C); S.hC[S.t] = S.C;
  if (S.t >= YEARS) { S.running = false; S.acc = 0; }
}

// --- drawing helpers ---------------------------------------------------------------------------------------------------------------
function pill(c, text, x, y, o = {}) {
  c.save(); c.font = '800 12px Nunito, sans-serif';
  const w = c.measureText(text).width + 14, h = 20;
  let px = o.al === 'l' ? x : o.al === 'r' ? x - w : x - w / 2;
  px = clamp(px, 3, Math.max(3, CW - w - 3));
  const py = clamp(y - h / 2, 3, Math.max(3, CH - h - 3));
  c.fillStyle = o.bg || 'rgba(10,12,20,.82)'; c.beginPath(); c.roundRect(px, py, w, h, 10); c.fill();
  if (o.stroke) { c.strokeStyle = o.stroke; c.lineWidth = 1; c.stroke(); }
  c.fillStyle = o.fg || COL.ink; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillText(text, px + 7, py + h / 2 + 0.5);
  c.restore();
}
function smooth(c, pts) { // a curve through the points (midpoint quadratic smoothing)
  if (pts.length < 2) return;
  c.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length - 1; i++) c.quadraticCurveTo(pts[i][0], pts[i][1], (pts[i][0] + pts[i + 1][0]) / 2, (pts[i][1] + pts[i + 1][1]) / 2);
  const l = pts[pts.length - 1]; c.lineTo(l[0], l[1]);
}
function stroke(c, pts, col, w = 2.5, dash = []) {
  if (pts.length < 2) return;
  c.save(); c.beginPath(); smooth(c, pts); c.setLineDash(dash); c.lineWidth = w; c.strokeStyle = col; c.lineCap = 'round'; c.lineJoin = 'round'; c.stroke(); c.restore();
}
// a plot panel: dark rounded box, title, y ticks, x labels; returns the scale functions
function frame(c, r, o) {
  const pad = { l: 34, r: 10, t: 20, b: 17 };
  const px = r.x + pad.l, py = r.y + pad.t, pw = r.w - pad.l - pad.r, ph = r.h - pad.t - pad.b;
  const X = (v) => px + (v - o.x0) / (o.x1 - o.x0) * pw, Y = (v) => py + ph - (v - o.y0) / (o.y1 - o.y0) * ph;
  c.save();
  const g = c.createLinearGradient(0, r.y, 0, r.y + r.h); g.addColorStop(0, 'rgba(22,27,44,.85)'); g.addColorStop(1, 'rgba(12,15,26,.85)');
  c.fillStyle = g; c.beginPath(); c.roundRect(r.x, r.y, r.w, r.h, 12); c.fill();
  c.strokeStyle = 'rgba(130,145,190,.2)'; c.lineWidth = 1; c.stroke();
  c.font = '700 12px Nunito, sans-serif'; c.textBaseline = 'middle';
  c.textAlign = 'right';
  for (const v of o.yt) { const y = Y(v); c.strokeStyle = 'rgba(130,145,190,.16)'; c.beginPath(); c.moveTo(px, y); c.lineTo(px + pw, y); c.stroke(); c.fillStyle = COL.mut; c.fillText(String(v), px - 5, y); }
  c.textAlign = 'center'; c.fillStyle = COL.mut;
  for (const [v, s] of o.xt) c.fillText(s, clamp(X(v), r.x + 14, r.x + r.w - 14), py + ph + 9);
  c.textAlign = 'left'; c.fillStyle = '#C6CDE0'; c.fillText(o.title, r.x + 10, r.y + 10);
  c.restore();
  return { X, Y, px, py, pw, ph };
}
const clipPlot = (c, f) => { c.beginPath(); c.rect(f.px - 1, f.py - 2, f.pw + 2, f.ph + 4); c.clip(); };

const DW = 340, DH = 296;
const yOf = (C) => 190 - (clamp(C, 250, 600) - 250) / 350 * 92;
function drawScene(c, R, time) {
  const s = Math.min(R.w / DW, R.h / DH), ox = R.x + (R.w - DW * s) / 2, oy = R.y + (R.h - DH * s) / 2;
  const P = (x, y) => [ox + x * s, oy + y * s];
  const E = S.E, out = sinkAt(S.vis), ys = yOf(S.vis);
  c.save(); c.translate(ox, oy); c.scale(s, s); c.lineJoin = 'round'; c.lineCap = 'round';

  // soft floor shadow under the tub
  let g = c.createRadialGradient(176, 218, 4, 176, 218, 140); g.addColorStop(0, 'rgba(0,0,0,.38)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = g; c.beginPath(); c.ellipse(176, 218, 140, 14, 0, 0, 7); c.fill();

  // drain pipes (behind the tub): trunk, then a branch to the ocean and a branch to the forests
  const wT = 1.5 + 17 * out / 60, wO = 1.5 + 17 * out * OCEAN_PART / 60, wL = 1.5 + 17 * out * (1 - OCEAN_PART) / 60;
  const pipe = (pts, w, wOuter) => {
    c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); c.quadraticCurveTo(pts[1][0], pts[1][1], pts[2][0], pts[2][1]);
    c.lineWidth = wOuter + 6; c.strokeStyle = '#59627a'; c.stroke();
    c.lineWidth = wOuter + 3; c.strokeStyle = '#8f98ae'; c.stroke();
    c.lineWidth = w; c.strokeStyle = '#4a9fd8'; c.stroke();
    c.save(); c.setLineDash([5, 9]); c.lineDashOffset = -time * 40; c.lineWidth = Math.max(1, w * 0.4); c.strokeStyle = 'rgba(210,235,255,.7)'; c.stroke(); c.restore();
  };
  pipe([[176, 196], [176, 210], [176, 226]], wT, wT);
  pipe([[176, 224], [176, 246], [128, 254]], wO, Math.max(wO, wL));
  pipe([[176, 224], [176, 246], [224, 254]], wL, Math.max(wO, wL));

  // ocean (bottom left) and forests (bottom right)
  g = c.createLinearGradient(0, 250, 0, 292); g.addColorStop(0, '#3d8fd0'); g.addColorStop(1, '#1d4f86');
  c.fillStyle = g; c.beginPath(); c.moveTo(14, 292); c.lineTo(14, 262);
  for (let x = 14; x <= 150; x += 6) c.lineTo(x, 258 + Math.sin(x * 0.12 + time * 1.8) * 2.2);
  c.lineTo(150, 292); c.closePath(); c.fill();
  c.strokeStyle = 'rgba(200,230,255,.5)'; c.lineWidth = 1.2; c.beginPath();
  for (let x = 14; x <= 150; x += 6) { const y = 258 + Math.sin(x * 0.12 + time * 1.8) * 2.2; x === 14 ? c.moveTo(x, y) : c.lineTo(x, y); } c.stroke();
  g = c.createLinearGradient(0, 262, 0, 292); g.addColorStop(0, '#4a9a5c'); g.addColorStop(1, '#25583a');
  c.fillStyle = g; c.beginPath(); c.moveTo(196, 292); c.quadraticCurveTo(210, 262, 250, 264); c.quadraticCurveTo(300, 262, 326, 292); c.closePath(); c.fill();
  for (const [tx, ty, tr] of [[222, 266, 9], [250, 260, 12], [284, 266, 10]]) {
    c.fillStyle = '#6b4a2e'; c.beginPath(); c.roundRect(tx - 2, ty, 4, 12, 2); c.fill();
    const cg = c.createRadialGradient(tx - tr * 0.3, ty - tr * 0.5, 1, tx, ty - tr * 0.2, tr * 1.3); cg.addColorStop(0, '#8fd18a'); cg.addColorStop(1, '#2f7d46');
    c.fillStyle = cg; c.beginPath(); c.arc(tx, ty - tr * 0.3, tr, 0, 7); c.fill();
    c.strokeStyle = 'rgba(15,40,25,.5)'; c.lineWidth = 1; c.stroke();
  }

  // tub body: porcelain with a gradient, rim and feet
  for (const fx of [84, 268]) {
    g = c.createLinearGradient(0, 204, 0, 216); g.addColorStop(0, '#e2c47a'); g.addColorStop(1, '#a07f35');
    c.fillStyle = g; c.beginPath(); c.roundRect(fx - 10, 202, 20, 13, 5); c.fill(); c.strokeStyle = '#6b5420'; c.lineWidth = 1; c.stroke();
  }
  g = c.createLinearGradient(52, 0, 300, 0); g.addColorStop(0, '#f6f2e9'); g.addColorStop(0.45, '#d9dde8'); g.addColorStop(1, '#9ea8c0');
  c.fillStyle = g; c.beginPath(); c.moveTo(52, 92); c.lineTo(300, 92); c.lineTo(300, 160); c.quadraticCurveTo(300, 206, 256, 206); c.lineTo(96, 206); c.quadraticCurveTo(52, 206, 52, 160); c.closePath(); c.fill();
  c.strokeStyle = '#6c758d'; c.lineWidth = 1.6; c.stroke();
  // the inside (a cut-away) and the water
  const cav = () => { c.beginPath(); c.moveTo(64, 96); c.lineTo(288, 96); c.lineTo(288, 160); c.quadraticCurveTo(288, 192, 256, 192); c.lineTo(96, 192); c.quadraticCurveTo(64, 192, 64, 160); c.closePath(); };
  cav(); g = c.createLinearGradient(0, 96, 0, 192); g.addColorStop(0, '#1b2236'); g.addColorStop(1, '#0d111f'); c.fillStyle = g; c.fill();
  c.save(); cav(); c.clip();
  for (const v of [300, 400, 500]) { const y = yOf(v); c.strokeStyle = 'rgba(255,255,255,.1)'; c.lineWidth = 1; c.setLineDash([3, 5]); c.beginPath(); c.moveTo(64, y); c.lineTo(288, y); c.stroke(); }
  c.setLineDash([]);
  g = c.createLinearGradient(0, ys, 0, 192); g.addColorStop(0, 'rgba(140,204,240,.96)'); g.addColorStop(1, 'rgba(38,94,158,.97)');
  c.fillStyle = g; c.beginPath(); c.moveTo(60, 200); c.lineTo(60, ys);
  for (let x = 60; x <= 292; x += 5) c.lineTo(x, ys + Math.sin(x * 0.07 + time * 2.2) * 1.8);
  c.lineTo(292, 200); c.closePath(); c.fill();
  if (S.sec === 'pre') { // the part below 278 ppm: the level before factories
    const yp = yOf(C_PRE);
    c.fillStyle = 'rgba(60,200,170,.38)'; c.fillRect(60, yp, 232, 200 - yp);
    c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 1.5; c.setLineDash([5, 4]); c.beginPath(); c.moveTo(64, yp); c.lineTo(288, yp); c.stroke(); c.setLineDash([]);
  }
  const span = Math.max(12, 192 - ys); // bubbles rise to the surface
  for (let i = 0; i < 12; i++) {
    const bx = 76 + ((i * 53) % 200), by = 192 - ((time * (9 + (i % 4) * 3) + i * 31) % span), br = 1.6 + (i % 3) * 0.8;
    c.fillStyle = 'rgba(255,255,255,.22)'; c.beginPath(); c.arc(bx, by, br, 0, 7); c.fill();
  }
  c.fillStyle = 'rgba(255,255,255,.07)'; c.fillRect(64, 96, 26, 100); // a soft light from the left
  if (E > 0.3 && S.vis < 600) { // the stream lands: ripples
    for (let k = 0; k < 3; k++) { const r = ((time * 16 + k * 9) % 27); c.strokeStyle = `rgba(255,215,160,${0.5 * (1 - r / 27)})`; c.lineWidth = 1.4; c.beginPath(); c.ellipse(118, ys + 1, 4 + r, 1.5 + r * 0.22, 0, 0, 7); c.stroke(); }
  }
  c.restore();
  // drain grate
  c.fillStyle = '#5b647c'; c.beginPath(); c.ellipse(176, 190, 11, 3, 0, 0, 7); c.fill();
  // rim
  g = c.createLinearGradient(0, 86, 0, 100); g.addColorStop(0, '#fffdf7'); g.addColorStop(1, '#c4cada');
  c.fillStyle = g; c.beginPath(); c.roundRect(46, 86, 260, 12, 6); c.fill(); c.strokeStyle = '#6c758d'; c.lineWidth = 1.2; c.stroke();

  // the tap: pipe, elbow, nozzle, red handle
  g = c.createLinearGradient(0, 12, 0, 34); g.addColorStop(0, '#d7dce8'); g.addColorStop(0.5, '#9aa3b8'); g.addColorStop(1, '#6b738a');
  c.fillStyle = g; c.strokeStyle = '#4c546b'; c.lineWidth = 1.2;
  c.beginPath(); c.roundRect(-6, 14, 124, 18, 6); c.fill(); c.stroke();
  c.beginPath(); c.roundRect(106, 14, 26, 36, 7); c.fill(); c.stroke();
  c.beginPath(); c.roundRect(109, 46, 20, 9, 4); c.fill(); c.stroke();
  c.fillStyle = '#6b738a'; c.fillRect(117, 6, 4, 9);
  g = c.createRadialGradient(117, 3, 1, 119, 5, 9); g.addColorStop(0, '#ff8a80'); g.addColorStop(1, '#b3261e');
  c.fillStyle = g; c.beginPath(); c.ellipse(119, 5, 10, 5, 0, 0, 7); c.fill(); c.strokeStyle = '#6e1712'; c.stroke();
  if (E > 0.3) { // stream: thickness = emissions
    const w = 1.5 + 17 * E / 60, y0 = 55;
    g = c.createLinearGradient(0, y0, 0, ys); g.addColorStop(0, '#f8c27a'); g.addColorStop(1, '#d78534');
    c.fillStyle = g; c.beginPath(); c.moveTo(119 - w * 0.55, y0); c.quadraticCurveTo(119 - w * 0.5, (y0 + ys) / 2, 119 - w * 0.62, ys + 2);
    c.lineTo(119 + w * 0.62, ys + 2); c.quadraticCurveTo(119 + w * 0.5, (y0 + ys) / 2, 119 + w * 0.55, y0); c.closePath(); c.fill();
    c.save(); c.setLineDash([6, 10]); c.lineDashOffset = -time * 55; c.lineWidth = Math.max(1, w * 0.3); c.strokeStyle = 'rgba(255,240,215,.75)';
    c.beginPath(); c.moveTo(119 - w * 0.12, y0); c.lineTo(119 - w * 0.12, ys); c.stroke(); c.restore();
  }
  c.restore();

  // labels in screen space (always 12 px)
  c.save(); c.font = '700 12px Nunito, sans-serif'; c.fillStyle = COL.mut; c.textBaseline = 'middle'; c.textAlign = 'right';
  for (const v of [300, 400, 500, 600]) { const [lx, ly] = P(42, yOf(v)); c.fillText(String(v), lx, ly); const [x1, y1] = P(44, yOf(v)), [x2] = P(50, yOf(v)); c.strokeStyle = 'rgba(152,160,184,.6)'; c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y1); c.stroke(); }
  c.textAlign = 'left'; const [ux, uy] = P(6, 82); c.fillText('ppm', ux, uy); c.restore();
  const t = T[lang];
  pill(c, `${t.L.tap} ${n(E)} ${t.gt}`, ...P(142, 32), { al: 'l', stroke: 'rgba(240,162,74,.7)' });
  pill(c, t.L.air, ...P(176, 76), { bg: 'rgba(240,244,255,.92)', fg: '#1a2030' });
  const [lx, ly] = P(284, ys + 13);
  pill(c, `${n(S.vis, 0)} ppm`, lx, ly, { al: 'r', bg: 'rgba(8,20,40,.78)' });
  pill(c, t.L.ocean, ...P(82, 276)); pill(c, t.L.forests, ...P(260, 280));
  if (S.sec === 'pre') pill(c, `${t.L.pre} · ${C_PRE} ppm`, ...P(176, yOf(C_PRE) + 14), { bg: 'rgba(8,60,56,.85)' });
  if (S.sec === 'book' && S.g1 !== null) {
    const d = E - sinkAt(S.C);
    pill(c, `${n(E)} − ${n(sinkAt(S.C))} = ${d >= 0 ? '+' : ''}${n(d)}`, ...P(176, 132), { bg: 'rgba(10,12,20,.9)', stroke: 'rgba(245,200,76,.8)' });
  }
}

// --- the tub's linked graph: tap and drain, level --------------------------------------------------------------------------------
function drawTubGraph(c, R) {
  const gap = 8, h = (R.h - gap) / 2, t = T[lang];
  const A = { x: R.x, y: R.y, w: R.w, h }, B = { x: R.x, y: R.y + h + gap, w: R.w, h };
  const xt = [[0, '2025'], [25, '2050'], [50, '2075']];
  const f1 = frame(c, A, { x0: 0, x1: YEARS, y0: 0, y1: 60, yt: [0, 20, 40, 60], xt, title: '' });
  c.save(); c.font = '800 12px Nunito, sans-serif'; c.textBaseline = 'middle'; c.textAlign = 'left';
  c.fillStyle = COL.tap; c.fillText(`● ${t.L.tap} (${t.gt})`, A.x + 10, A.y + 10);
  const lw = c.measureText(`● ${t.L.tap} (${t.gt})`).width;
  c.fillStyle = COL.drain; c.fillText(`   ● ${t.L.drain}`, A.x + 10 + lw, A.y + 10); c.restore();
  const m = S.t, E = S.hE, Sk = S.hS;
  c.save(); clipPlot(c, f1);
  for (let i = 0; i < m; i++) {
    const up = (E[i] + E[i + 1]) / 2 > (Sk[i] + Sk[i + 1]) / 2;
    c.fillStyle = up ? 'rgba(240,162,74,.3)' : 'rgba(91,181,234,.3)';
    c.beginPath(); c.moveTo(f1.X(i), f1.Y(E[i])); c.lineTo(f1.X(i + 1), f1.Y(E[i + 1])); c.lineTo(f1.X(i + 1), f1.Y(Sk[i + 1])); c.lineTo(f1.X(i), f1.Y(Sk[i])); c.closePath(); c.fill();
  }
  c.restore();
  const pe = [], ps = [];
  for (let i = 0; i <= m; i++) { pe.push([f1.X(i), f1.Y(E[i])]); ps.push([f1.X(i), f1.Y(Sk[i])]); }
  if (m === 0) { c.save(); c.lineWidth = 2.5; c.lineCap = 'round'; c.strokeStyle = COL.tap; c.beginPath(); c.arc(pe[0][0], pe[0][1], 3, 0, 7); c.stroke(); c.strokeStyle = COL.drain; c.beginPath(); c.arc(ps[0][0], ps[0][1], 3, 0, 7); c.stroke(); c.restore(); }
  stroke(c, pe, COL.tap, 2.6); stroke(c, ps, COL.drain, 2.6);

  const f2 = frame(c, B, { x0: 0, x1: YEARS, y0: 280, y1: 600, yt: [300, 400, 500, 600], xt, title: `CO₂ (ppm)` });
  if (S.sec === 'pre') { c.save(); c.strokeStyle = 'rgba(255,255,255,.55)'; c.setLineDash([4, 4]); c.beginPath(); c.moveTo(f2.px, f2.Y(C_PRE)); c.lineTo(f2.px + f2.pw, f2.Y(C_PRE)); c.stroke(); c.restore(); }
  const pc = []; for (let i = 0; i <= m; i++) pc.push([f2.X(i), f2.Y(S.hC[i])]);
  c.save(); clipPlot(c, f2); stroke(c, pc, '#7cc4f0', 3); c.restore();
  const lastC = pc[pc.length - 1]; c.fillStyle = '#fff'; c.beginPath(); c.arc(lastC[0], lastC[1], 3.5, 0, 7); c.fill();
}

// --- view 2: the three paths -------------------------------------------------------------------------------------------------------
function drawPaths(c, R, time) {
  const gap = 8, h = (R.h - gap) / 2, t = T[lang];
  const A = { x: R.x, y: R.y, w: R.w, h }, B = { x: R.x, y: R.y + h + gap, w: R.w, h };
  const xt = [[0, '2025'], [25, '2050'], [50, '2075']];
  const f1 = frame(c, A, { x0: 0, x1: YEARS, y0: 0, y1: 48, yt: [0, 20, 40], xt, title: `${t.L.tap} (${t.gt})` });
  const f2 = frame(c, B, { x0: 0, x1: YEARS, y0: 360, y1: 530, yt: [400, 450, 500], xt, title: 'CO₂ (ppm)' });
  G.p2 = { px: f1.px, pw: f1.pw };
  const shown = S.ran2 ? Math.min(YEARS, S.p2) : -1;
  for (const k of PATH_KEYS) {
    const pe = PATHS[k].E.map((e, i) => [f1.X(i), f1.Y(e)]);
    stroke(c, pe, PATH_COL[k], 2.6, PATH_DASH[k]);
    if (shown >= 0) {
      const m = Math.floor(shown), pts = PATHS[k].C.slice(0, m + 1).map((v, i) => [f2.X(i), f2.Y(v)]);
      if (shown > m && m < YEARS) pts.push([f2.X(shown), f2.Y(PATHS[k].C[m] + (PATHS[k].C[m + 1] - PATHS[k].C[m]) * (shown - m))]);
      c.save(); clipPlot(c, f2); stroke(c, pts, PATH_COL[k], 2.8, PATH_DASH[k]); c.restore();
      const l = pts[pts.length - 1]; c.fillStyle = PATH_COL[k]; c.beginPath(); c.arc(l[0], l[1], 3.5, 0, 7); c.fill();
    }
  }
  // direct labels at the right end of the emission lines
  const lab_ = { flat: [E0, -12], cut2: [PATHS.cut2.E[YEARS], -19], zero: [0, -11] };
  for (const k of PATH_KEYS) pill(c, t.paths.sh[k], f1.px + f1.pw - 4, f1.Y(lab_[k][0]) + lab_[k][1], { al: 'r', bg: 'rgba(10,12,20,.8)', fg: PATH_COL[k] });
  if (shown < 0) pill(c, t.real.after, f2.px + f2.pw / 2, f2.py + f2.ph / 2, { bg: 'rgba(10,12,20,.88)', fg: COL.mut });
  // the year the child taps
  const cx = f1.X(S.cur); c.save(); c.strokeStyle = 'rgba(255,255,255,.55)'; c.setLineDash([4, 4]); c.beginPath(); c.moveTo(cx, A.y + 20); c.lineTo(cx, B.y + B.h - 17); c.stroke(); c.restore();
  for (const k of PATH_KEYS) {
    c.fillStyle = PATH_COL[k]; c.strokeStyle = '#0A0C14'; c.lineWidth = 1.5;
    c.beginPath(); c.arc(cx, f1.Y(PATHS[k].E[S.cur]), 4, 0, 7); c.fill(); c.stroke();
    if (shown >= S.cur) { c.beginPath(); c.arc(cx, f2.Y(PATHS[k].C[S.cur]), 4, 0, 7); c.fill(); c.stroke(); }
  }
}

// --- view 3: the real numbers --------------------------------------------------------------------------------------------------------
function drawReal(c, R) {
  const gap = 8, h = (R.h - gap) / 2, t = T[lang];
  const A = { x: R.x, y: R.y, w: R.w, h }, B = { x: R.x, y: R.y + h + gap, w: R.w, h };
  const xt = RY.map((y, i) => [i + 0.5, String(y).slice(2)]);
  const f1 = frame(c, A, { x0: 0, x1: 8, y0: 0, y1: 48, yt: [0, 20, 40], xt, title: t.real.topT });
  const f2 = frame(c, B, { x0: 0, x1: 8, y0: 0, y1: 3.4, yt: [0, 1, 2, 3], xt, title: t.real.botT });
  G.p3 = { px: f1.px, pw: f1.pw };
  const bw = f1.pw / 8 * 0.58;
  RE.forEach((e, i) => {
    const x = f1.X(i + 0.5), y = f1.Y(e), sel = i === S.p3 || i === S.p3 + 1;
    const g = c.createLinearGradient(0, y, 0, f1.py + f1.ph); g.addColorStop(0, sel ? '#ffc680' : '#f0a24a'); g.addColorStop(1, '#9c5a1c');
    c.fillStyle = g; c.beginPath(); c.roundRect(x - bw / 2, y, bw, f1.py + f1.ph - y, [5, 5, 0, 0]); c.fill();
    if (sel) { c.strokeStyle = '#fff'; c.lineWidth = 1.5; c.stroke(); }
    c.fillStyle = '#EDEFF7'; c.font = '800 12px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'alphabetic'; c.fillText(n(e), x, Math.max(A.y + 30, y - 4));
  });
  if (S.g3 === null) { pill(c, t.real.after, f2.px + f2.pw / 2, f2.py + f2.ph / 2, { bg: 'rgba(10,12,20,.88)', fg: COL.mut }); return; }
  R_RISE.forEach((r, i) => {
    const x = f2.X(i + 1), y = f2.Y(r), sel = i === S.p3, w = f2.pw / 8 * 0.7;
    const g = c.createLinearGradient(0, y, 0, f2.py + f2.ph); g.addColorStop(0, sel ? '#a9dcff' : '#5bb5ea'); g.addColorStop(1, '#1f5f96');
    c.fillStyle = g; c.beginPath(); c.roundRect(x - w / 2, y, w, f2.py + f2.ph - y, [5, 5, 0, 0]); c.fill();
    if (sel) { c.strokeStyle = '#fff'; c.lineWidth = 1.5; c.stroke(); }
    c.fillStyle = '#EDEFF7'; c.font = '800 12px Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'alphabetic'; c.fillText(n(r, 2), x, Math.max(B.y + 30, y - 4));
  });
}

// --- one canvas, three views ---------------------------------------------------------------------------------------------------------
let lastKey = '';
canvasLoop($('cv'), (c, w, h, dt, time) => {
  CW = w; CH = h;
  const v = lab.view;
  if (v === 'tub') {
    if (S.running) { S.acc += dt * 5; while (S.acc >= 1 && S.running) { S.acc -= 1; yearStep(); } }
    S.hE[S.t] = S.E; S.hS[S.t] = sinkAt(S.C);
    S.vis += (S.C - S.vis) * (1 - Math.exp(-dt * 7));
    const wide = w >= 700;
    if (wide) { const sw = w * 0.5; drawScene(c, { x: 4, y: 6, w: sw - 8, h: h - 12 }, time); drawTubGraph(c, { x: sw + 4, y: 8, w: w - sw - 12, h: h - 16 }); }
    else { const gh = Math.min(h * 0.44, 200); drawScene(c, { x: 0, y: 2, w, h: h - gh - 4 }, time); drawTubGraph(c, { x: 8, y: h - gh, w: w - 16, h: gh - 6 }); }
    const key = `${S.t}|${trendOf()}|${S.running}`;
    if (key !== lastKey) { lastKey = key; update(); }
  } else if (v === 'paths') {
    if (S.ran2 && S.p2 < YEARS) { S.p2 = Math.min(YEARS, S.p2 + dt * 7); if (S.p2 >= YEARS) { S.p2 = YEARS; update(); } }
    drawPaths(c, { x: 8, y: 8, w: w - 16, h: h - 16 }, time);
  } else drawReal(c, { x: 8, y: 8, w: w - 16, h: h - 16 }, time);
});

// --- controls ------------------------------------------------------------------------------------------------------------------------
const icon = (k) => ['M3 19 C12 16 20 10 31 3', 'M3 19 C9 5 17 2 21 6 C26 10 28 15 31 19', 'M3 19 C15 18 24 15 31 3'].map((d) => `<svg viewBox="0 0 34 22" width="32" height="21" aria-hidden="true"><path d="${d}" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>`)[k];
const secChip = (k, emo) => `<button class="chip secret ${secret.unlocked() ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${secret.unlocked() ? `${emo} ${esc(T[lang].sec[k === 'book' ? 'a' : 'b'][0])}` : '🔒 ???'}</button>`;

function buildCtrl() {
  const t = T[lang], v = lab.view, cb = $('ctrlBody');
  if (v === 'tub') {
    if (S.g1 === null) cb.innerHTML = `<div class="cb-q">${esc(t.tub.q)}</div><div class="cb-opts">${t.tub.opts.map((o, i) => `<button class="chip cb-opt" data-act="g1" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
    else cb.innerHTML = `<label class="cb-lbl" id="tapLbl" for="tap"></label>
      <input id="tap" class="big" type="range" min="0" max="60" step="0.5" value="${S.E}" style="--track: linear-gradient(90deg, #5bb5ea, #f0a24a)">
      <div class="row2"><button class="btn" id="runB" data-act="run"></button><button class="chip" data-act="again">${esc(t.tub.again)}</button></div>
      <div class="row2">${secChip('book', '🧠')}${secChip('pre', '🕰️')}</div>`;
  } else if (v === 'paths') {
    if (S.g1 === null) cb.innerHTML = `<div class="row2" style="margin-top:0"><button class="btn" data-act="goTub">${esc(t.paths.go)}</button></div>`;
    else {
      const done = S.ran2, all = PATH_KEYS.every((k) => S.g2[k] !== null);
      cb.innerHTML = `<div class="cb-q" style="font-size:17px">${esc(t.paths.q)}</div>
        <div class="cb-legend">${t.paths.shape.map((s, i) => `<span>${icon(i)} ${esc(s)}</span>`).join('')}</div>
        ${PATH_KEYS.map((k) => `<div class="cb-row"><div class="cb-name"><i class="cb-dot" style="background:${PATH_COL[k]}"></i><span>${esc(t.paths.pn[k])}</span></div>
          ${[0, 1, 2].map((i) => `<button class="cb-sk ${S.g2[k] === i ? 'on' : ''} ${done && PATHS[k].shape === i ? 'good' : ''} ${done && S.g2[k] === i && PATHS[k].shape !== i ? 'bad' : ''}" data-act="g2" data-k="${k}" data-i="${i}" aria-label="${esc(t.paths.shape[i])}"${done ? ' disabled' : ''}>${icon(i)}</button>`).join('')}
          <span class="cb-mark" style="color:${done ? (S.g2[k] === PATHS[k].shape ? 'var(--ok)' : 'var(--wip)') : 'inherit'}">${done ? (S.g2[k] === PATHS[k].shape ? '✓' : '✗') : ''}</span></div>`).join('')}
        <div class="row2"><button class="btn" data-act="${done ? 'again2' : 'show2'}"${!done && !all ? ' disabled' : ''}>${esc(done ? t.paths.again : t.paths.show)}</button></div>`;
    }
  } else {
    const per = RY.slice(0, 7).map((y, i) => `<button class="chip ${i === S.p3 ? 'on' : ''}" data-act="per" data-i="${i}">${esc(`${String(y).slice(2)}–${String(RY[i + 1]).slice(2)}`)}</button>`).join('');
    if (S.g1 === null) { cb.innerHTML = `<div class="row2" style="margin-top:0"><button class="btn" data-act="goTub">${esc(t.paths.go)}</button></div>`; return; }
    cb.innerHTML = (S.g3 === null ? `<div class="cb-q">${esc(t.real.q(E_RATIO))}</div><div class="cb-opts" style="margin-bottom:10px">${t.real.opts.map((o, i) => `<button class="chip cb-opt" data-act="g3" data-i="${i}">${esc(o)}</button>`).join('')}</div>` : '')
      + `<div class="chips">${per}</div>`;
  }
}

function update() {
  const t = T[lang], v = lab.view, gtxt = n(PPM_GT);
  if (v === 'tub') {
    lab.setGlow('rgba(91, 181, 234, .28)');
    const tr = trendOf(), out = sinkAt(S.C), d = S.E - out, r = d / PPM_GT, pct = Math.round(S.E / E0 * 100);
    const tl = $('tapLbl'); if (tl) tl.textContent = t.tub.slider(n(S.E), pct);
    const rb = $('runB'); if (rb) rb.textContent = S.running ? t.tub.pause : t.tub.run;
    if (S.g1 === null) {
      lab.setReadout(n(C0), `ppm · ${YEAR0}`, '', '#5bb5ea'); lab.setFacts([]);
      lab.setState({ emo: '🛁', title: t.tub.askT, lead: t.tub.askL(n(E0)), body: t.tub.askB, extra: `<div class="fine">${esc(t.tub.fine(gtxt))}</div>` });
      return;
    }
    lab.setReadout(n(S.C), `ppm · ${YEAR0 + S.t}`, t.tub[tr === 0 ? 'holding' : tr > 0 ? 'rising' : 'falling'], '#5bb5ea');
    const i = n(S.E), o = n(out);
    let st;
    if (!S.moved) st = { emo: S.g1 === ANS1 ? '✅' : '🤔', title: S.g1 === ANS1 ? t.ok : t.no, lead: t.tub.upL(i, o, n(d), n(r)), body: S.t >= YEARS ? t.tub.doneB(n(S.C, 0)) : t.tub.watchB };
    else if (tr > 0) st = { emo: '🛁', title: t.tub.up, lead: t.tub.upL(i, o, n(d), n(r)), body: t.tub.moveB };
    else if (tr < 0) st = { emo: '🛁', title: t.tub.down, lead: t.tub.downL(i, o, n(-d), n(-r)), body: t.tub.moveB };
    else st = { emo: '🎯', title: t.tub.hold, lead: `${t.tub.holdL(i, o)} ${t.tub.holdF(pct)}`, body: t.tub.holdB };
    let extra = '';
    if (S.sec === 'book') extra += `<p class="cb-sub">${esc(t.tub.mit)}</p><p class="cb-sub"><b>${esc(t.tub.book(i, o, n(d), n(r)))}</b></p>`;
    if (S.sec === 'pre') extra += `<p class="cb-sub">${esc(t.tub.pre)}</p>`;
    extra += `<div class="fine">${esc(t.tub.fine(gtxt))}</div>`;
    lab.setState({ ...st, extra });
    lab.setFacts(t.facts.tub.map((f) => ({ emo: f.emo, text: f.text(gtxt), src: f.src })));
  } else if (v === 'paths') {
    lab.setGlow('rgba(245, 213, 76, .22)');
    const cur = S.cur, yr = YEAR0 + cur, done = S.ran2, fin = done && S.p2 >= YEARS;
    if (S.g1 === null) {
      lab.setReadout(String(yr), PATH_KEYS.map((k) => n(PATHS[k].E[cur], 0)).join(' · ') + ` ${t.gt}`, '', '#f5d54c'); lab.setFacts([]);
      lab.setState({ emo: '🔒', title: t.paths.gateT, lead: t.paths.gateL, body: '', extra: '' });
      return;
    }
    lab.setReadout(String(yr), done && S.p2 >= cur ? PATH_KEYS.map((k) => n(PATHS[k].C[cur], 0)).join(' · ') + ' ppm' : PATH_KEYS.map((k) => n(PATHS[k].E[cur], 0)).join(' · ') + ` ${t.gt}`, '', '#f5d54c');
    if (!fin) {
      lab.setState({ emo: '🛤️', title: t.paths.askT, lead: t.paths.askL, body: t.paths.askB, extra: '' }); lab.setFacts([]);
    } else {
      const k = PATH_KEYS.filter((q) => S.g2[q] === PATHS[q].shape).length;
      const lines = PATH_KEYS.map((q) => PATHS[q].shape === 0 ? t.paths.lineUp(n(PATHS[q].C[YEARS], 0)) : t.paths.linePeak(t.paths.sh[q], YEAR0 + PATHS[q].peak, n(PATHS[q].C[PATHS[q].peak], 0)));
      lab.setState({ emo: k === 3 ? '✅' : '🤔', title: t.paths.res(k), lead: t.paths.resL, body: lines.join(' '), extra: `<p class="cb-sub">${esc(t.paths.net)}</p><div class="fine">${esc(t.paths.fine)}</div>` });
      lab.setFacts(t.facts.paths.map((f) => ({ emo: f.emo, text: f.text(), src: f.src })));
    }
  } else {
    lab.setGlow('rgba(61, 220, 151, .2)');
    const p = S.p3, i0 = RY[p], i1 = RY[p + 1];
    if (S.g1 === null) {
      lab.setReadout(n(RE[p + 1]), `${t.gt} · ${i1}`, '', '#f0a24a'); lab.setFacts([]);
      lab.setState({ emo: '🔒', title: t.paths.gateT, lead: t.paths.gateL, body: '', extra: '' });
    } else if (S.g3 === null) {
      lab.setReadout(n(RE[p + 1]), `${t.gt} · ${i1}`, '', '#f0a24a'); lab.setFacts([]);
      lab.setState({ emo: '📊', title: t.real.askT, lead: t.real.askL(n(RE[0]), n(RE[7])), body: t.real.askB, extra: `<div class="fine">${esc(t.real.fine)}</div>` });
    } else {
      lab.setReadout(`+${n(R_RISE[p], 2)}`, `${t.yr} · ${i0}–${i1}`, '', '#5bb5ea');
      const right = S.g3 === 0, rest = 100 - SHARES.air - SHARES.ocean - SHARES.land;
      const bar = `<div class="cb-sub"><b>${esc(t.real.goes)}</b></div><div class="cb-bar"><span style="width:${SHARES.air}%;background:#5bb5ea"></span><span style="width:${SHARES.ocean}%;background:#3ddc97"></span><span style="width:${SHARES.land}%;background:#f5d54c"></span><span style="width:${rest}%;background:#98A0B8"></span></div><div class="cb-legend"><span><i class="cb-dot" style="background:#5bb5ea"></i>${esc(t.real.air)} ${SHARES.air}%</span><span><i class="cb-dot" style="background:#3ddc97"></i>${esc(t.real.ocean)} ${SHARES.ocean}%</span><span><i class="cb-dot" style="background:#f5d54c"></i>${esc(t.real.land)} ${SHARES.land}%</span></div><p class="cb-sub">${esc(t.real.goesN(rest))}</p>`;
      lab.setState({ emo: right ? '✅' : '🤔', title: right ? t.ok : t.no, lead: t.real.resL(n(R_RISE[0], 2), n(R_RISE[6], 2), R_RATIO, E_RATIO), body: t.real.resB(n(RM[0], 2), n(RM[7], 2)), extra: `${bar}<div class="fine">${esc(t.real.fine)}</div>` });
      lab.setFacts(t.facts.real.map((f, j) => ({ emo: f.emo, text: j === 1 ? f.text(DIP, n(DIP_RISE, 2)) : f.text(), src: f.src })));
    }
  }
}
function render() { buildCtrl(); update(); lastKey = ''; }

const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
const goTab = (v) => $('views').querySelector(`[data-view="${v}"]`)?.click();
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, i = +b.dataset.i;
  if (a === 'g1') { S.g1 = i; S.moved = false; resetTub(); S.running = true; (i === ANS1 ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'run') { if (S.t >= YEARS) resetTub(); S.running = !S.running; sfx.click(); }
  else if (a === 'again') { resetTub(); S.moved = true; sfx.click(); }
  else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === b.dataset.k ? null : b.dataset.k; sfx.click();
  } else if (a === 'goTub') goTab('tub');
  else if (a === 'g2') { S.g2[b.dataset.k] = i; sfx.tick(); }
  else if (a === 'show2') { S.ran2 = true; S.p2 = 0; const k = PATH_KEYS.filter((q) => S.g2[q] === PATHS[q].shape).length; (k === 3 ? sfx.good : sfx.click)(); showStage(); }
  else if (a === 'again2') { S.g2 = { flat: null, cut2: null, zero: null }; S.ran2 = false; S.p2 = 0; sfx.click(); }
  else if (a === 'g3') { S.g3 = i; (i === 0 ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'per') { S.p3 = i; sfx.tick(); }
  render();
});
$('ctrlBody').addEventListener('input', (ev) => {
  if (ev.target.id !== 'tap') return;
  S.E = +ev.target.value; S.moved = true; update();
});
$('stExtra').addEventListener('click', (ev) => { if (ev.target.closest('[data-act=goTub]')) goTab('tub'); });
// tapping the graphs: view 2 reads a year, view 3 picks a period
let down = false;
const pick = (ev) => {
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left;
  if (lab.view === 'paths' && G.p2) { const y = clamp(Math.round((x - G.p2.px) / G.p2.pw * YEARS), 0, YEARS); if (y !== S.cur) { S.cur = y; update(); } }
  else if (lab.view === 'real' && G.p3) { const p = clamp(Math.round((x - G.p3.px) / G.p3.pw * 8 - 1), 0, 6); if (p !== S.p3) { S.p3 = p; buildCtrl(); update(); sfx.tick(); } }
};
$('cv').addEventListener('pointerdown', (ev) => { down = true; pick(ev); });
$('cv').addEventListener('pointermove', (ev) => { if (down) pick(ev); });
addEventListener('pointerup', () => { down = false; });
addEventListener('pointercancel', () => { down = false; });
render();
</script>
</body>
</html>
