  else if (S.fal !== null) st = { emo: '🌱', title: f.fal.ttl, lead: done ? f.fal.done : f.fal.lead(Math.floor(S.fal)), body: f.fal.body };
  else if (S.st === 0) st = { emo: p === 1 ? '✅' : '🤔', title: p === 1 ? f.ok : f.no, lead: f.t1, body: f.t2 };
  else if (S.st === 1) st = { emo: '🔥', title: f.s1.ttl, lead: f.s1.lead, body: f.s1.body };
  else if (S.y === 0) st = { emo: '🌽', title: f.s2.ttl, lead: f.s2.lead, body: f.s2.body };
  else if (S.y >= 8) st = { emo: '🌧️', title: f.end(good), lead: f.endl, body: f.endb };
  else st = { emo: '🌧️', title: f.yr(S.y, H[S.y - 1] >= 50), lead: f.yl, body: f.yb(good) };
  lab.setState({ ...st, extra: '' });
  lab.setFacts(S.tp ? f.tpFacts : f.facts);
}
render();
</script>
