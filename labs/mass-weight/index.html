function answerJump(j) {
  if (!S.jAsk) return;
  const w = S.jw, ok = j === (G[w] < 9.8 ? 0 : 1);
  S.jAsk = false; S.jDone[w] = true; S.jPend[w] = ok; (ok ? sfx.good : sfx.bad)(); startJump(w); showStage();
}
function fOptions() {
  const m = S.m, g = G[S.fw], right = Math.round(m * g * 10) / 10;
  let d1 = m * 10; if (Math.abs(d1 - right) < 0.06 * right) d1 = Math.round(m * G[2] * 10) / 10;
  const arr = [right, d1, m], perm = [[0, 1, 2], [1, 2, 0], [2, 0, 1], [0, 2, 1], [2, 1, 0], [1, 0, 2]][(m * 3 + S.fw * 5) % 6];
  return { right, list: perm.map((i) => arr[i]) };
}
function answerFormula(v) {
  const key = `${S.m}|${S.fw}`; if (!fAsking()) return;
  const { right } = fOptions(); S.fKey = key; S.fAns = v; S.fOk = v === right; S.fh = [0, 0, 0, 0]; (S.fOk ? sfx.good : sfx.bad)(); showStage();
}
function openSec(k) {
  if (!secret.unlocked()) return secret.open();
  if (S.sec === k) { S.sec = null; if (lab.view === 'scales') snapSpring(); }
  else if (k === 'a') { cancelAsk(); S.sec = 'sun'; lab.view = 'scales'; S.sc.sp.tgt = EXT_SUN; S.sc.sp.v = 0; S.sc.tt = -1; lab.renderChrome(); }
  else { S.sec = 'space'; lab.view = 'jump'; S.pu = -1; lab.renderChrome(); }
  sfx.click(); render(); showStage();
}
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.w !== undefined) return pickWorld(+b.dataset.w);
  if (b.dataset.sec) return openSec(b.dataset.sec === 'a' ? 'a' : 'b');
  if (b.id === 'mwJb') { if (!S.jAsk && !S.j) { startJump(S.jw); render(); } return; }
  if (b.id === 'mwPb') { S.pu = 0; sfx.push(); render(); return; }
  if (b.id === 'mwPred') { S.pred = !S.pred; if (S.pred) { S.fKey = `${S.m}|${S.fw}`; S.fAns = null; } sfx.click(); render(); }
});
$('mwM').addEventListener('input', (ev) => { S.m = clamp(Math.round(+ev.target.value), 1, 100); S.fAns = null; render(); });
$('mwAsk').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b || b.disabled) return;
  const d = b.dataset, v = lab.view;
  if (v === 'scales') {
    const sc = S.sc; if (sc.phase !== 'ask') return;
    if (d.a !== undefined) sc.a = +d.a; if (d.b !== undefined) sc.b = +d.b; sfx.tick();
    if (sc.a !== null && sc.b !== null) {
      const ok = sc.a === (G[sc.to] > G[sc.prev] ? 0 : 1), okB = sc.b === 0;
      sc.res = { a: ok, b: okB, ga: sc.a, gb: sc.b }; sc.phase = 'lift'; sc.rt = 0; sc.lifted = false; (ok && okB ? sfx.good : sfx.bad)();
    }
  } else if (v === 'jump') answerJump(+d.j); else answerFormula(+d.f);
  render();
});

// --- render: chips, controls, readout, state card ---------------------------------------------------------------------
let askHtml = null;
function setAsk(html) { const el = $('mwAsk'); el.hidden = !html; if (html !== askHtml) { askHtml = html; el.innerHTML = html || ''; } }
const gTxt = (u, i) => `g = ${num(G[i])} ${u.g}`;
function render() {
  const t = T[lang], u = t.u, v = lab.view, sec = S.sec, sc = S.sc;
  const asking = sec ? false : v === 'scales' ? sc.phase === 'ask' || sc.phase === 'lift' : v === 'jump' ? S.jAsk : fAsking();
  const sel = sec ? -1 : v === 'scales' ? (asking ? sc.to : sc.w) : v === 'jump' ? S.jw : S.fw;
  $('mwWorlds').innerHTML = t.worlds.map((n, i) => `<button class="chip ${i === sel ? 'on' : ''}" data-w="${i}" type="button">${EMO[i]} ${esc(n)}</button>`).join('');
  const open = secret.unlocked();
  $('mwSecs').innerHTML = [['a', '☀️'], ['b', '🌌']].map(([k, e]) => `<button class="chip secret ${open ? 'open' : ''} ${(sec === 'sun' && k === 'a') || (sec === 'space' && k === 'b') ? 'on' : ''}" data-sec="${k}" type="button">${open ? `${e} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`).join('');
  $('mwF').hidden = !(v === 'formula' && !sec); $('mwJ').hidden = !(v === 'jump' && !sec); $('mwP').hidden = sec !== 'space';
  $('mwMl').textContent = t.fm.ml; $('mwMv').textContent = `${S.m} ${u.kg}`; $('mwM').value = S.m;
  $('mwE1').textContent = t.fm.ends[0]; $('mwE2').textContent = t.fm.ends[1];
  $('mwPred').textContent = `${S.pred ? '✓ ' : ''}${t.fm.pred}`; $('mwPred').classList.toggle('on', S.pred);
  $('mwJb').textContent = t.jp.btn; $('mwJb').disabled = S.jAsk || !!S.j;
  $('mwPb').textContent = S.pu >= 0 ? t.sp.again : t.sp.push;
  lab.setFacts(t.facts[sec === 'space' ? 'jump' : v]);
  let ask = '';
  if (sec === 'sun') {
    lab.setReadout(`${num(CRATE * G_SUN)} ${u.n}`, `${t.mass} ${CRATE} ${u.kg}`, `g = ${num(G_SUN)} ${u.g}`, ACC[4]);
    lab.setState({ emo: '☀️', title: t.secrets.a[0], lead: t.secrets.a[1], body: t.sc.sunB });
  } else if (sec === 'space') {
    lab.setReadout(`0 ${u.n}`, `${t.mass} ${CRATE} ${u.kg}`, '', ACC[5]);
    lab.setState({ emo: '🌌', title: t.secrets.b[0], lead: t.secrets.b[1], body: t.sp.body });
  } else if (v === 'scales') {
    const w = sc.w;
    if (asking) {
      lab.setReadout('?', '', '', ACC[sc.to]);
      lab.setState({ emo: '🎭', title: t.sc.askT, lead: t.sc.askL, body: '' });
      const lift = sc.phase === 'lift', dis = lift ? ' disabled' : '';
      ask = `<p class="mw-cap">${esc(t.sc.cmp(t.worlds[sc.prev]))}</p>
        <p class="mw-q">${esc(t.sc.q1)}</p><div class="mw-opts">${t.sc.o1.map((o, i) => `<button type="button" data-a="${i}"${dis} class="${sc.a === i ? 'on' : ''}">${esc(o)}</button>`).join('')}</div>
        <p class="mw-q">${esc(t.sc.q2)}</p><div class="mw-opts">${sc.ord.map((id) => `<button type="button" data-b="${id}"${dis} class="${sc.b === id ? 'on' : ''}">${esc(t.sc.o2[id])}</button>`).join('')}</div>`;
    } else {
      const W = CRATE * G[w], Ws = `${num(W)} ${u.n}`;
      lab.setReadout(Ws, `${t.mass} ${CRATE} ${u.kg}`, gTxt(u, w), ACC[w]);
      if (sc.res) {
        const r = sc.res, both = r.a && r.b;
        lab.setState({ emo: both ? '✅' : '🤔', title: both ? t.right : t.notq, lead: t.sc.resL(Ws), body: `${t.sc.resB(num(G[w]), num(W))} ${t.sc.bal}`,
          extra: `<div>${r.a ? '✓' : '✗'} ${esc(t.sc.gA(t.sc.o1[r.ga]))}</div><div>${r.b ? '✓' : '✗'} ${esc(t.sc.gB(t.sc.o2[r.gb]))}</div>` });
      } else lab.setState({ emo: '⚖️', title: t.sc.idleT, lead: t.sc.idleL, body: t.sc.idleB });
    }
  } else if (v === 'jump') {
    const w = S.jw, g = G[w], h = 0.5 * 9.8 / g, shown = S.jShown[w];
    if (asking) ask = `<p class="mw-q">${esc(t.jp.q)}</p><div class="mw-opts">${t.jp.o.map((o, i) => `<button type="button" data-j="${i}">${esc(o)}</button>`).join('')}</div>`;
    if (shown) lab.setReadout(`${num(h)} ${u.m}`, `${t.mass} ${MASS_ASTRO} ${u.kg} · ${t.weight} ${num(MASS_ASTRO * g)} ${u.n}`, gTxt(u, w), ACC[w]);
    else lab.setReadout('?', '', '', ACC[w]);
    if (w !== 0 && !shown) lab.setState({ emo: '🚀', title: t.jp.askT, lead: t.jp.askL, body: '' });
    else if (w !== 0 && S.jRes[w] !== null) lab.setState({ emo: S.jRes[w] ? '✅' : '🤔', title: S.jRes[w] ? t.right : t.notq, lead: t.jp.resL(num(h)), body: t.jp.resB(num(9.8)) });
    else lab.setState({ emo: '🚀', title: t.jp.idleT, lead: t.jp.idleL, body: '' });
  } else {
    const w = S.fw, g = G[w], W = S.m * g, key = `${S.m}|${w}`;
    if (asking) {
      const { list } = fOptions();
      ask = `<p class="mw-q">${esc(t.fm.q(S.m, t.worlds[w]))}</p><div class="mw-opts">${list.map((o) => `<button type="button" data-f="${o}">${esc(num(o))} ${esc(u.n)}</button>`).join('')}</div>`;
      lab.setReadout('?', `${t.mass} ${S.m} ${u.kg}`, '', ACC[w]);
      lab.setState({ emo: '🔮', title: t.fm.askT, lead: t.fm.askL, body: '' });
    } else {
      const line = `${t.wl} = ${S.m} ${u.kg} × ${num(g)} ${u.g} = ${num(W)} ${u.n}`, got = S.pred && S.fAns !== null && S.fKey === key;
      lab.setReadout(`${num(W)} ${u.n}`, `${t.mass} ${S.m} ${u.kg}`, gTxt(u, w), ACC[w]);
      lab.setState(got ? { emo: S.fOk ? '✅' : '🤔', title: S.fOk ? t.right : t.notq, lead: line, body: t.fm.guess(`${num(S.fAns)} ${u.n}`) }
        : { emo: '📐', title: t.fm.title, lead: line, body: t.fm.body(S.m) });
    }
  }
  setAsk(ask);
}
render();
</script>
