});

// --- render: controls, readout and state card ----------------------------------------------------------------------
const cl = (a, n = 3) => [0, 1, 2].slice(0, n).map((q) => `${nm(q)} ${a[q]}`).join(', ');
function render() {
  const t = T[lang], v = lab.view, sec = S.sec;
  $('c1').style.display = !sec && v === 'count' ? '' : 'none';
  $('c2').style.display = !sec && v === 'secret' ? '' : 'none';
  $('c3').style.display = !sec && v === 'turn' ? '' : 'none';
  $('cg').style.display = sec === 'gerry' ? '' : 'none';
  $('ct').style.display = sec === 'tie' ? '' : 'none';
  const open = secret.unlocked();
  $('secs').innerHTML = [['gerry', '🗺️', t.secrets.a[0]], ['tie', '🎲', t.secrets.b[0]]].map(([k, e, n]) =>
    `<button class="chip secret ${open ? 'open' : ''} ${sec === k ? 'on' : ''}" data-a="sec" data-k="${k}">${open ? `${e} ${esc(n)}` : '🔒 ???'}</button>`).join('');
  if (sec === 'gerry') rGerry(t); else if (sec === 'tie') rTie(t); else if (v === 'count') rCount(t); else if (v === 'secret') rSecret(t); else rTurn(t);
  lab.setFacts([{ emo: v === 'count' ? '🗳️' : v === 'secret' ? '🤫' : '🚶', text: t.facts[v === 'turn' ? 'turn' : v], src: t.srcs[v === 'turn' ? 'turn' : v] }]);
}
const optBtns = (act, labels, pick, locked, good) => labels.map((l, i) => `<button class="cv-opt ${pick === i ? 'on' : ''} ${locked && good === i ? 'ok' : ''} ${locked && pick === i && good !== i ? 'no' : ''}" data-a="${act}" data-i="${i}" ${locked ? 'disabled' : ''}>${l}</button>`).join('');

function rCount(t) {
  const k = S.c, n = t.cnt, rule = n.rules[k.rule], ph = k.phase, win = WIN1[k.rule], cts = CNT1[k.rule];
  lab.setGlow('rgba(154, 130, 224, .28)');
  $('r1').innerHTML = `<b>${esc(rule[0])}</b> ${esc(rule[1])}`;
  $('q1').textContent = ph === 'predict' ? n.q : n.note;
  $('o1').innerHTML = optBtns('pick1', [0, 1, 2].map((q) => `${EMO[q]} ${esc(nm(q))}`), k.pick, ph !== 'predict', ph === 'done' ? win : -1);
  $('m1').textContent = ph === 'predict' ? n.count : ph === 'count' ? n.counting : k.rule === 0 ? n.next : n.again;
  $('m1').disabled = (ph === 'predict' && k.pick === null) || ph === 'count';
  $('c1').querySelector('.cv-q').style.display = '';
  if (ph === 'predict') {
    lab.setReadout('?', n.sub(k.rule + 1), '', COL[0]);
    lab.setState({ emo: '🗳️', title: rule[0].replace(/\.$/, ''), lead: rule[1], body: n.note, extra: '' });
  } else if (ph === 'count') {
    lab.setReadout('…', n.sub(k.rule + 1), '', COL[0]);
    lab.setState({ emo: '⏳', title: n.counting, lead: rule[1], body: '', extra: '' });
  } else {
    const ok = k.pick === win;
    lab.setReadout(`${EMO[win]} ${cts[win]}`, n.of, n.pill(nm(win)), COL[win]);
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? n.right : n.miss(nm(k.pick)),
      lead: n.win(nm(win), cts[win]) + ' ' + (k.rule ? n.moved(cl(cts)) : n.first(cl(cts))), body: k.rule ? n.same : '', extra: '' });
  }
}
function rSecret(t) {
  const k = S.s, n = t.sec, ph = k.phase, ch = CHANGED.filter(Boolean).length;
  lab.setGlow('rgba(238, 123, 88, .24)');
  $('q2').textContent = n.q;
  $('o2').innerHTML = optBtns('pick2', ['0', '3', '6', '9'].map((x) => x), k.pick === null ? null : k.pick, ph !== 'predict', [0, 3, 6, 9].indexOf(ch));
  $('m2').textContent = ph === 'predict' ? n.raise : ph === 'open' ? n.curtain : n.again;
  $('m2').disabled = ph === 'predict' && k.pick === null;
  const cn = (a) => cl(a);
  if (ph === 'predict') { lab.setReadout('?', t.x.voters + ': 12', '', COL[1]); lab.setState({ emo: '👀', title: n.t0, lead: n.l0, body: n.note, extra: '' }); }
  else if (ph === 'open') {
    const a = tally(SHOW), w = a.indexOf(Math.max(...a));
    lab.setReadout(`${EMO[w]} ${a[w]}`, `/ 12`, nm(w), COL[w]);
    lab.setState({ emo: k.right ? '✅' : '🤔', title: k.right ? n.right : n.miss([0, 3, 6, 9][k.pick], ch), lead: n.openT(nm(w)) + ' ' + n.open(ch, cn(a)), body: '', extra: '' });
  } else {
    const a = tally(FAV), w = a.indexOf(Math.max(...a));
    lab.setReadout(`${EMO[w]} ${a[w]}`, `/ 12`, nm(w), COL[w]);
    lab.setState({ emo: '🤫', title: n.secT(nm(w)), lead: n.secL(cn(a)), body: n.secB, extra: '' });
  }
}
function rTurn(t) {
  const U = S.u, n = t.tur, rev = U.revealed;
  lab.setGlow('rgba(79, 181, 168, .26)');
  $('q3').textContent = n.q;
  $('o3').innerHTML = optBtns('pick3', ['3', '5', '7', '9'], U.pick, rev, [3, 5, 7, 9].indexOf(NEED));
  $('o3').style.display = rev ? 'none' : '';
  $('q3').style.display = rev ? 'none' : '';
  $('m3').style.display = rev ? 'none' : ''; $('m3').textContent = n.show; $('m3').disabled = U.pick === null;
  $('sl3').innerHTML = GR.map((g, gi) => {
    const stops = [...Array(11).keys()].map((kk) => { const kv = U.k.slice(); kv[gi] = kk; const w = win3(kv), col = w < 0 ? '#8a90a8' : COL[w]; return `${col} ${Math.max(0, (kk - .5) * 10)}%, ${col} ${Math.min(100, (kk + .5) * 10)}%`; }).join(',');
    return `<div class="cv-sl"><span>${esc(n.groups[gi])}</span><input class="big" type="range" min="0" max="10" step="1" value="${U.k[gi]}" data-g="${gi}" ${rev ? '' : 'disabled'} style="${rev ? `--track:linear-gradient(90deg,${stops})` : ''}" aria-label="${esc(n.groups[gi])}"><b>${U.k[gi]}/10</b></div>`;
  }).join('');
  if (!rev) {
    lab.setReadout('?', n.sub, '', COL[2]);
    lab.setState({ emo: '🚶', title: n.t0, lead: n.l0, body: n.note, extra: '' });
  } else {
    const [o, f] = votes3(U.k), w = win3(U.k), tot = U.k[0] + U.k[1] + U.k[2], ok = U.pick !== null && [3, 5, 7, 9][U.pick] === NEED;
    lab.setReadout(`${f} : ${o}`, n.sub, n.pill(w), w < 0 ? '#8a90a8' : COL[w]);
    lab.setState({ emo: w < 0 ? '🤝' : '🗳️', title: n.res(w, f, o).replace(/(\d+) : (\d+)/, (m) => m), lead: n.lead(tot, 30), body: `${ok ? n.right : n.miss([3, 5, 7, 9][U.pick], NEED)} ${n.needs(NEED)}`, extra: '' });
  }
}
function rGerry(t) {
  const G = S.g, n = t.sc, sc = seatsOf(G.lay);
  lab.setGlow('rgba(255, 180, 84, .24)');
  $('og').innerHTML = [0, 1].map((i) => `<button class="cv-opt ${G.lay === i ? 'on' : ''}" data-a="lay" data-i="${i}">${esc(n.lay[i])}</button>`).join('');
  lab.setReadout(`${sc[0]} : ${sc[1]}`, `${EMO[0]} ${nm(0)} : ${EMO[1]} ${nm(1)}`, t.x.seats, COL[sc[1] > sc[0] ? 1 : 0]);
  lab.setState({ emo: '🗺️', title: n.gT(G.lay + 1, sc[0], sc[1]), lead: n.gL, body: G.lay ? n.g2 : n.g1, extra: '' });
}
function rTie(t) {
  const L = S.ti, n = t.sc, drawn = L.phase === 'draw' && L.t > 1.2;
  lab.setGlow('rgba(154, 130, 224, .24)');
  $('mt').textContent = L.phase === 'draw' ? n.again : n.lots;
  lab.setReadout('6 : 6', `${EMO[0]} ${nm(0)} : ${EMO[1]} ${nm(1)}`, t.x.tie, '#8a90a8');
  lab.setState(drawn ? { emo: '🎲', title: n.tW(nm(L.win)), lead: n.tWL, body: '', extra: '' } : { emo: '🤝', title: n.tT, lead: n.tL, body: '', extra: '' });
}
// the tie animation finishes by itself: refresh the card once the slip is unfolded
setInterval(() => { if (S.sec === 'tie' && S.ti.phase === 'draw' && S.ti.t > 1.2 && !S.ti.done) { S.ti.done = true; sfx.good(); render(); } }, 200);
render();
</script>
</body>
