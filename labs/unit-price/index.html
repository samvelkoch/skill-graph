  const gx = 24 + tw * (20 / scale); c.fillStyle = '#fff'; c.fillRect(gx - 1, ty2 - 5, 2.5, 26); txt(c, '20', gx, ty2 - 12, 12.5, '#fff', { wt: 800 });
  let mx = 28; ITEMS.forEach((it) => { if (S.bsel.has(it.k)) { it.draw(c, mx + 18, by + bh * .55, 34); mx += 40; } });
  pill(c, `${total} / 20 🪙`, W - 70, by + bh * .22, { size: 13.5, stroke: S.bchk ? (total <= 20 ? '#3ddc97' : '#ff5a4d') : '' });
}

// --- loop and input ----------------------------------------------------------------------------------------
canvasLoop($('cv'), (c, w, h, dt, t) => {
  W = w; H = h; hits = []; S.t = t;
  c.save();
  try {
    rr(c, 0, 0, w, h, 18); c.clip(); wall(c, t);
    if (S.sec === 'a') drawSA(c, dt, t); else if (S.sec === 'b') drawSB(c, dt, t);
    else if (lab.view === 'compare') drawCompare(c, dt, t); else if (lab.view === 'tricks') drawTricks(c, dt, t); else drawAd(c, dt, t);
  } catch (err) { console.error(err); }
  c.restore();
});
$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  for (let i = hits.length - 1; i >= 0; i--) { const q = hits[i]; if (x >= q.x && x <= q.x + q.w && y >= q.y && y <= q.y + q.h) { q.fn(); return; } }
});

// --- actions -----------------------------------------------------------------------------------------------
const showStage = () => {
  const r = $('stage').getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
};
function selPair(i) { if (i === S.pi && !S.revealed) return; S.pi = i; S.guess = null; S.revealed = false; S.e = 0; sfx.click(); render(); }
function adToggle(id) { if (S.adRev) return; S.adSel.has(id) ? S.adSel.delete(id) : S.adSel.add(id); sfx.tick(); render(); }
function bToggle(k) { if (S.bchk) { S.bchk = false; } S.bsel.has(k) ? S.bsel.delete(k) : S.bsel.add(k); sfx.tick(); render(); }
$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, i = +b.dataset.i, k = b.dataset.k;
  if (a === 'pair') selPair(i);
  else if (a === 'opt') { S.guess = i; S.revealed = true; S.e = 0; (i === cmp(PAIRS[S.pi]).win ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'next') { selPair((S.pi + 1) % PAIRS.length); return; }
  else if (a === 'card') { S.ti = i; S.tg = null; S.te = 0; sfx.click(); }
  else if (a === 'topt') { S.tg = i; S.te = 0; S.tres[S.ti] = i === CARDS[S.ti].ans; (S.tres[S.ti] ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'tnext') { S.ti = (S.ti + 1) % CARDS.length; S.tg = null; S.te = 0; sfx.click(); }
  else if (a === 'achk') { S.adRev = true; S.ae = 0; S.adOk = AD.facts.length === S.adSel.size && AD.facts.every((f) => S.adSel.has(f)); (S.adOk ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'aagain') { S.adSel = new Set(); S.adRev = false; S.ae = 0; sfx.click(); }
  else if (a === 'sec') { if (!secret.unlocked()) return secret.open(); S.sec = S.sec === k ? null : k; if (k === 'a') { S.sa0 = S.t; } if (k === 'b') { S.bsel = new Set(); S.bchk = false; } sfx.click(); }
  else if (a === 'back') { S.sec = null; sfx.click(); }
  else if (a === 'sapair') { S.sa = i; S.sa0 = S.t; sfx.click(); }
  else if (a === 'sread') { S.sa0 = S.t; sfx.click(); }
  else if (a === 'bitem') { bToggle(k); return; }
  else if (a === 'bchk') { S.bchk = true; S.be = 0; (bOk() ? sfx.good : sfx.bad)(); showStage(); }
  else if (a === 'bclear') { S.bsel = new Set(); S.bchk = false; sfx.click(); }
  render();
});
const bTotal = () => ITEMS.reduce((s, it) => s + (S.bsel.has(it.k) ? it.price : 0), 0);
const bHas = () => ['eat', 'drink', 'extra'].every((g) => ITEMS.some((it) => it.g === g && S.bsel.has(it.k)));
const bOk = () => bHas() && bTotal() <= 20;

// --- render: controls, readout, state card and facts --------------------------------------------------------
function render() {
  const t = T[lang], v = lab.view;
  document.body.dataset.v = S.sec ? 'sec' : v;
  let html;
  if (S.sec === 'a') html = rSecA(t); else if (S.sec === 'b') html = rSecB(t);
  else if (v === 'compare') html = rCompare(t); else if (v === 'tricks') html = rTricks(t); else html = rAd(t);
  const open = secret.unlocked(), sc = (k, emo) => `<button class="up-c up-sec ${open ? 'open' : ''} ${S.sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${open ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  $('ctrlBody').innerHTML = `${html}<div class="up-row up-sep">${sc('a', '🧮')}${sc('b', '🛒')}${S.sec ? `<button class="up-c" data-act="back">← ${esc(t.back)}</button>` : ''}</div>`;
  lab.setFacts([{ emo: FACT[v].emo, text: t.facts[v], src: FACT[v].src }]);
}
function opts(list, act, rev, win, guess) {
  return `<div class="up-opts">${list.map((o, i) => `<button class="up-opt ${i === guess ? 'up-pick' : ''} ${rev ? (i === win ? 'up-good' : i === guess ? 'up-bad' : '') : ''}" data-act="${act}" data-i="${i}" ${rev ? 'disabled' : ''}>${esc(o)}</button>`).join('')}</div>`;
}
function rCompare(t) {
  const p = PAIRS[S.pi], { uL, uR, win } = cmp(p), rev = S.revealed, ok = rev && S.guess === win, name = t.pairs[p.k], per = t.per[p.per];
  if (!rev) {
    lab.setReadout(esc(name), '', '', '#f08a24');
    lab.setState({ emo: p.emo, title: name, lead: t.coinNote, body: t.look });
  } else {
    lab.setReadout(`${fmt(uL)} · ${fmt(uR)}`, per, ok ? t.right : t.no, ok ? '#2fb67c' : '#d9534f');
    lab.setState({ emo: ok ? '✅' : '🔎', title: ok ? t.right : t.no, lead: t.perLine(fmt(uL), fmt(uR), per), body: win === 0 ? t.winL : t.winR });
  }
  const chips = PAIRS.map((q, i) => `<button class="up-c ${i === S.pi ? 'on' : ''}" data-act="pair" data-i="${i}">${q.emo} ${esc(t.pairs[q.k])}</button>`).join('');
  return `<div class="up-row" style="margin-top:0">${chips}</div><div class="up-q">${esc(t.cq)}</div>${opts(t.copts, 'opt', rev, win, S.guess)}
    ${rev ? `<div class="up-v ${ok ? 'ok' : 'no'}">${esc(ok ? t.right : t.no)}</div><button class="btn" data-act="next">${esc(t.next)}</button>` : ''}`;
}
function rTricks(t) {
  const i = S.ti, cd = t.cards[i], rev = S.tg !== null, ans = CARDS[i].ans, ok = rev && S.tg === ans;
  if (!rev) {
    lab.setReadout(`${i + 1} / ${CARDS.length}`, cd.t, '', '#f08a24');
    lab.setState({ emo: CARDS[i].emo, title: cd.t, lead: t.tTip, body: '' });
  } else {
    lab.setReadout(esc(ok ? t.right : t.no), cd.t, ok ? '✓' : '', ok ? '#2fb67c' : '#d9534f');
    lab.setState({ emo: ok ? '✅' : '🔎', title: ok ? t.right : t.no, lead: cd.why, body: '' });
  }
  const dots = CARDS.map((_, k) => `<button class="up-dot ${k === i ? 'on' : ''} ${S.tres[k] === true ? 'ok' : S.tres[k] === false ? 'no' : ''}" data-act="card" data-i="${k}">${k + 1}</button>`).join('');
  return `<div class="up-row" style="margin-top:0">${dots}</div><p class="up-claim" style="margin-top:12px">${esc(cd.claim)}</p><div class="up-q">${esc(t.tq)}</div>${opts(t.topts, 'topt', rev, ans, S.tg)}
    ${rev ? `<div class="up-v ${ok ? 'ok' : 'no'}">${esc(ok ? t.right : t.no)}</div><button class="btn" data-act="tnext">${esc(t.next)}</button>` : ''}`;
}
function rAd(t) {
  const rev = S.adRev, n = S.adSel.size;
  if (!rev) {
    lab.setReadout('Super Crunch', t.tapped(n), '', '#7C4DFF');
    lab.setState({ emo: '📺', title: 'Super Crunch', lead: t.adq, body: t.adTip });
  } else {
    lab.setReadout(esc(S.adOk ? t.right : t.no), 'Super Crunch', S.adOk ? '✓' : '', S.adOk ? '#2fb67c' : '#d9534f');
    lab.setState({ emo: S.adOk ? '✅' : '🔎', title: S.adOk ? t.right : t.no, lead: t.adLead, body: t.adBody });
  }
  return `<div class="up-q" style="margin-top:0">${esc(t.adq)}</div>
    ${rev ? `<div class="up-leg"><span><i style="background:#00B8D9"></i>${esc(t.legF)}</span><span><i style="background:#EC4899"></i>${esc(t.legS)}</span></div>
      <div class="up-v ${S.adOk ? 'ok' : 'no'}">${esc(S.adOk ? t.right : t.no)}</div><button class="btn" data-act="aagain">${esc(t.again)}</button>`
      : `<button class="btn" data-act="achk" ${n ? '' : 'disabled'}>${esc(t.chk)}</button>`}`;
}
function rSecA(t) {
  const [a, b] = SECA[S.sa], f = String(a)[0];
  lab.setReadout(`${fmt2(a)} · ${fmt2(b)}`, '', '', '#f5a400');
  lab.setState({ emo: '🧮', title: t.secrets.a[0], lead: t.secrets.a[1], body: t.saBody(fmt2(a), fmt2(b), f) });
  return `<div class="up-row" style="margin-top:0">${SECA.map((p, i) => `<button class="up-c ${i === S.sa ? 'on' : ''}" data-act="sapair" data-i="${i}">${fmt2(p[0])} · ${fmt2(p[1])}</button>`).join('')}<button class="up-c" data-act="sread">↻ ${esc(t.readAgain)}</button></div>`;
}
function rSecB(t) {
  const tot = bTotal(), chk = S.bchk, ok = bOk();
  lab.setReadout(`${tot} / 20`, '🪙', chk ? (ok ? '✓' : '✗') : '', chk ? (ok ? '#2fb67c' : '#d9534f') : '#f08a24');
  if (!chk) lab.setState({ emo: '🛒', title: t.secrets.b[0], lead: t.secrets.b[1], body: t.bRule });
  else lab.setState({ emo: ok ? '✅' : '🔎', title: t.secrets.b[0], lead: !bHas() ? t.bMiss : tot > 20 ? t.bOver(tot) : t.bOk(tot), body: t.bGlow });
  const chips = ITEMS.map((it) => `<button class="up-c ${S.bsel.has(it.k) ? 'on' : ''}" data-act="bitem" data-k="${it.k}">${esc(t.items[it.k])} · ${it.price}</button>`).join('');
  const grp = `<div class="up-claim" style="margin-top:10px">${['eat', 'drink', 'extra'].map((g) => `${esc(t.grp[g])}: ${ITEMS.filter((it) => it.g === g).map((it) => esc(t.items[it.k])).join(' / ')}`).join(' · ')}</div>`;
  return `<div class="up-row" style="margin-top:0">${chips}</div>${grp}<div class="up-row"><button class="btn" data-act="bchk" ${S.bsel.size ? '' : 'disabled'}>${esc(t.chk)}</button><button class="up-c" data-act="bclear">${esc(t.clear)}</button></div>`;
}
render();
</script>
</body>
</html>
