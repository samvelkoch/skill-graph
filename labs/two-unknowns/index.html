function layout(w, h, n) {
  const stack = (x, y, ww, hh) => Array.from({ length: n }, (_, i) => ({ x, y: y + (i * hh) / n, w: ww, h: hh / n }));
  if (w >= 600) return { sc: stack(10, 10, w * 0.52 - 14, h - 20), grid: { x: w * 0.52 + 4, y: 10, w: w * 0.48 - 14, h: h - 20 } };
  const sh = h * (n === 1 ? 0.46 : 0.38), cw = (w - 16) / n;
  return { sc: Array.from({ length: n }, (_, i) => ({ x: 8 + i * cw, y: 6, w: cw, h: sh - 6 })), grid: { x: 8, y: sh + 2, w: w - 16, h: h - sh - 8 } };
}
function stepSpring(sp, tgt, dt) {
  const n = Math.max(1, Math.ceil(dt / 0.008)), h = dt / n;
  for (let i = 0; i < n; i++) { sp.vel += (-70 * (sp.ang - tgt) - 6.5 * sp.vel) * h; sp.ang += sp.vel * h; }
}
function drawBalance(c, w, h, dt, time) {
  const k = key(), p = PZ[k], st = PS[k], t = T[lang], L = layout(w, h, p.sc.length);
  p.sc.forEach((s, i) => { stepSpring(S.sp[i], -0.34 * Math.tanh(bal(s, S.a, S.b) / 5), dt); drawScale(c, L.sc[i], s, i, p.th, time, t, w); });
  drawGrid(c, L.grid, p, st, p.th, time);
}

$('cv').addEventListener('pointerdown', (ev) => { // tap a cell of the grid to set the dials

  const r = $('cv').getBoundingClientRect(), a = Math.floor((ev.clientX - r.left - GEO.gx) / GEO.cell) + 1, b = 9 - Math.floor((ev.clientY - r.top - GEO.gy) / GEO.cell);

// --- controls ------------------------------------------------------------------------------------------------
function pickPairs(i) { S.g1 = i; S.vd = false; sfx.click(); }
function pickS0(i) {
  S.g2 = i; [S.a, S.b] = OPT2[i]; S.vd = true; touch(); reveal(PS.s0); PS.s0.done = i === OPT2_OK || PS.s0.done;
  (i === OPT2_OK ? sfx.good : sfx.bad)(); showStage();
}
function pickCage(i) { S.gc = i; S.r = 1; S.hop = { i: 0, t: now() }; S.vd = true; (i === CAGE_OK ? sfx.good : sfx.bad)(); showStage(); }

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act], [data-d]'); if (!b) return;
  const act = b.dataset.act, v = lab.view;
  if (b.dataset.d) { const d = b.dataset.d; sfx.tick(); setAB(d === 'a' ? S.a + +b.dataset.s : S.a, d === 'b' ? S.b + +b.dataset.s : S.b); }
  else if (act === 'ans') { const i = +b.dataset.i; if (inCage()) pickCage(i); else if (key() === 'pairs') pickPairs(i); else pickS0(i); }
  else if (act === 'all') { reveal(PS[key()]); S.vd = true; sfx.click(); showStage(); }
  else if (act === 'again') {
    sfx.click();
    if (inCage()) { S.gc = null; S.r = 0; S.vd = false; } else if (key() === 'pairs') { PS.pairs = newState(PZ.pairs); S.g1 = null; S.vd = false; S.a = S.b = 1; }
    else { PS.s0 = newState(PZ.s0); S.g2 = null; S.vd = false; S.a = S.b = 1; }
  } else if (act === 'pz') { S.p2 = +b.dataset.i; S.vd = false; sfx.click(); if (dialsOn()) touch(); }
  else if (act === 'next') { S.p2 = (S.p2 + 1) % 3; S.vd = false; sfx.click(); if (dialsOn()) touch(); }
  else if (act === 'sub') { S.sub = b.dataset.k; sfx.click(); if (!inCage()) touch(); }
  else if (act === 'dio') {
    if (!secret.unlocked()) return secret.open();
    S.dio = S.dio === null ? 0 : S.dio === 0 ? 1 : null; S.vd = false; sfx.click(); touch();
  } else if (act === 'chick') {
    if (!secret.unlocked()) return secret.open();
    S.cage = (S.cage + 1) % CAGES.length; S.r = 0; S.vd = false; sfx.click();
  } else if (act === 'r-') setR(S.r - 1); else if (act === 'r+') setR(S.r + 1);
  render();
});
$('tuRange').addEventListener('input', (ev) => { setR(+ev.target.value); render(); });

    <button class="tu-sb" data-d="${k}" data-s="1" aria-label="+"${val >= 9 ? ' disabled' : ''}>+</button></div></div>`;
};
const secChip = (act, label, on) => `<button class="chip secret ${secret.unlocked() ? 'open' : ''} ${on ? 'on' : ''}" data-act="${act}">${secret.unlocked() ? esc(label) : '🔒 ???'}</button>`;

function renderBal(t) {
  const v = lab.view, k = key(), p = PZ[k], st = PS[k], n = p.sc.length, thk = p.th, th = TH[thk], tt = t[thk];
  const asking = (k === 'pairs' && S.g1 === null) || (k === 's0' && S.g2 === null);
  const lvl = p.sc.map((s) => bal(s, S.a, S.b)), sm = p.sc.map((s) => sums(s, S.a, S.b)), N = p.sol[0].length;
  $('tuSlide').hidden = true;
  $('tuAsk').hidden = !asking; $('tuDials').hidden = asking;
  $('tuAsk').innerHTML = !asking ? '' : k === 'pairs'
    ? t.optsPairs.map((o, i) => `<button class="tu-opt" data-act="ans" data-i="${i}">${esc(o)}</button>`).join('')
    : OPT2.map(([a, b], i) => `<button class="tu-opt" data-act="ans" data-i="${i}">🍎 ${a} · 🍐 ${b}</button>`).join('');
  $('tuDials').innerHTML = asking ? '' : dialHtml('a', th, t) + dialHtml('b', th, t);
  $('tuTask').textContent = k === 'pairs' ? (asking ? t.qPairs : t.taskPairs(t.optsPairs[S.g1])) : k.startsWith('dio') ? t.dioTask[S.dio]
    : k === 's0' ? (asking ? t.qS0 : t.taskS(1)) : k === 's1' ? t.taskS(2) : k === 's2' ? t.taskS(3) : t.taskTix;
  // segment row: the three puzzles of "Scales", or Cinema / Cage in "Tickets"
  $('tuSeg').innerHTML = v === 'scales'
    ? `<div class="card seg small">${[0, 1, 2].map((i) => `<button data-act="pz" data-i="${i}" class="${S.p2 === i ? 'on' : ''}">${PS['s' + i].done ? '✓ ' : ''}${i + 1}</button>`).join('')}</div>`
    : v === 'tickets' ? `<div class="card seg small">${['tix', 'cage'].map((q) => `<button data-act="sub" data-k="${q}" class="${S.sub === q ? 'on' : ''}">${esc(t.subs[q])}</button>`).join('')}</div>` : '';
  // pairs found so far, sorted by the apple
  const list = [...st.found[0].keys()].map((id) => id.split(',').map(Number)).sort((x, y) => x[0] - y[0]);
  $('tuFound').innerHTML = n === 1 && !asking && list.length ? `<span>${esc(t.foundLbl)}</span>${list.map(([a, b]) => `<span class="tu-pill">${th.A}${a} ${th.B}${b}</span>`).join('')}` : '';
  let acts = '';
  if (n === 1 && !asking && !st.rev) acts += `<button class="chip tu-act" data-act="all">${esc(t.showAll)}</button>`;
  if (k === 'pairs' && st.rev || k === 's0' && S.g2 !== null && S.g2 !== OPT2_OK) acts += `<button class="chip tu-act" data-act="again">${esc(t.again)}</button>`;
  if (v === 'scales') acts += `<button class="btn tu-act" data-act="next">${esc(t.next)}</button>`;
  if (v === 'pairs') acts += secChip('dio', t.dioChip[S.dio === null ? 0 : S.dio === 0 ? 1 : 2], S.dio !== null);
  $('tuActs').innerHTML = acts;
  // state card
  let sc;
  if (asking) sc = { emo: '🤔', title: t.guessT, lead: k === 'pairs' ? t.askLead : t.askLead2, body: '' };
  else if (n === 1) {
    const tip = st.found[0].size >= 2 && !st.rev && N > 3 ? t.tip : '';
    if (st.rev && (S.vd || k !== 'pairs')) {
      if (k === 'pairs') { const ok = VALP[S.g1] === N; sc = { emo: ok ? '✅' : '🤔', title: ok ? t.right : t.revWrong(t.optsPairs[S.g1], N), lead: t.revLead(N), body: VALP[S.g1] === Infinity ? t.infBody : t.revBody }; }
      else sc = { emo: N ? '🏛️' : '🤔', title: N ? t.nPairs(N) : t.noPair, lead: t.dioRev[S.dio], body: '' };
    } else if (lvl[0] === 0) sc = { emo: '✅', title: tt.lvl, lead: tt.both(sm[0][0]), body: tip };
    else sc = { emo: '⚖️', title: lvl[0] > 0 ? tt.more : tt.less, lead: tt.sums(sm[0][0], sm[0][1]), body: tip };
  } else {
    const kk = lvl.filter((x) => x === 0).length, both = kk === n;
    if (k === 's0' && S.vd) {
      const [a, b] = OPT2[S.g2], ok = S.g2 === OPT2_OK, [ca, cb] = p.both[0];
      sc = ok ? { emo: '✅', title: t.right, lead: t.s0Lead(a, b), body: t.s0Body } : { emo: '🤔', title: t.s0Wrong(a, b), lead: t.s0WrongLead(ca, cb), body: t.s0WrongBody };
    } else if (both) {
      sc = { emo: '✅', title: t.right, lead: k === 'tix' ? t.tixLead(t.coins(S.a), t.coins(S.b)) : t.s0Lead(S.a, S.b), body: `${p.sc.map((s) => exprN(s, S.a, S.b)).join('; ')}. ${t.solvedBody}` };
    } else sc = { emo: '⚖️', title: t.lvlCount(kk), lead: t.scLead(sm[0], sm[1]), body: '' };
  }
  lab.setState({ ...sc, extra: '' });
  // readout
  if (asking) lab.setReadout('?', '', '', '#e5484d');
  else {
    const sub = n === 1 ? `${sm[0][0]} | ${sm[0][1]}` : `${sm[0][0]} | ${sm[0][1]}  ·  ${sm[1][0]} | ${sm[1][1]}`;
    const pillT = n === 1 ? t.pill(st.found[0].size, N, st.rev) : lvl.every((x) => x === 0) ? '✓' : `${lvl.filter((x) => x === 0).length} / 2`;
    lab.setReadout(`${th.A} ${S.a} · ${th.B} ${S.b}`, sub, pillT, v === 'pairs' ? '#e5484d' : v === 'scales' ? '#4fd1c5' : '#f5c84c');
  }
  lab.setFacts(v === 'pairs' ? [t.facts.dio] : v === 'scales' ? [t.facts.arith] : [t.facts.epi]);
  lab.checkStage();
}

function renderCage(t) {
  const g = CAGES[S.cage], N = g.heads, r = S.r, c_ = N - r, legs = 2 * N + 2 * r, tg = g.legs, ok = legs === tg, ans = rabbitsFor(g);
  const asking = S.cage === 0 && S.gc === null;
  $('tuAsk').hidden = !asking; $('tuDials').hidden = true; $('tuSlide').hidden = asking; $('tuFound').innerHTML = '';
  $('tuAsk').innerHTML = !asking ? '' : t.optsCage.map((o, i) => `<button class="tu-opt" data-act="ans" data-i="${i}">${esc(o)}</button>`).join('');
  $('tuTask').textContent = asking ? t.qCage : t.taskCage(t.heads(N), t.legs(tg));
  const rg = $('tuRange'); rg.max = N; if (+rg.value !== r) rg.value = r; rg.setAttribute('aria-label', t.rabLbl);
  $('tuSeg').innerHTML = `<div class="card seg small">${['tix', 'cage'].map((q) => `<button data-act="sub" data-k="${q}" class="${S.sub === q ? 'on' : ''}">${esc(t.subs[q])}</button>`).join('')}</div>`;
  let acts = '';
  if (S.cage === 0 && S.gc !== null && S.gc !== CAGE_OK && r <= 1) acts += `<button class="chip tu-act" data-act="again">${esc(t.again)}</button>`;
  acts += secChip('chick', t.chickChip[S.cage === 0 ? 0 : S.cage === CAGES.length - 1 ? 2 : 1], S.cage !== 0);
  $('tuActs').innerHTML = acts;
  let sc;
  if (asking) sc = { emo: '🤔', title: t.guessT, lead: t.askLead, body: '' };
  else if (S.cage === 0 && S.vd && S.gc !== null) {
    const okg = S.gc === CAGE_OK; sc = { emo: okg ? '✅' : '🤔', title: okg ? t.right : t.cageWrong(t.optsCage[S.gc]), lead: t.cageLead, body: '' };
  } else if (ok) sc = { emo: '✅', title: t.right, lead: t.cSolved(t.rabbits(r), t.chickens(c_), r, c_, legs), body: '' };
  else if (ans === null && Math.abs(legs - tg) === 1) sc = { emo: '🤔', title: t.close, lead: t.closeLead(tg), body: '' };
  else sc = { emo: '🐔', title: legs < tg ? t.few : t.many, lead: t.cLead(t.rabbits(r), t.chickens(c_), t.legs(legs), tg), body: '' };
  lab.setState({ ...sc, extra: '' });
  if (asking) lab.setReadout('?', '', '', '#f5c84c');
  else lab.setReadout(t.legs(legs), `${t.rabbits(r)} + ${t.chickens(c_)}`, ok ? t.pillOk : legs < tg ? t.pillFew : t.pillMany, '#f5c84c');
  lab.setFacts([t.facts.sunzi]);
  lab.checkStage();
}
render();
</script>
</body>
