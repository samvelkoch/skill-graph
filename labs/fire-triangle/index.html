// --- secret 2: Lavoisier's scales ----------------------------------------------------------------------------
function drawLav(c, rg, dt, time) {

  const wob = L.phase === 'burn' ? Math.sin(e * 5) * 0.02 * (1 - clamp01(e / 3)) : 0;
  // stand
  const sgr = c.createLinearGradient(cx - 6, 0, cx + 6, 0); sgr.addColorStop(0, '#6f5538'); sgr.addColorStop(0.5, '#b08d5c'); sgr.addColorStop(1, '#5a432b');
  c.fillStyle = sgr; c.beginPath(); c.roundRect(cx - 6, piv, 12, R.y + R.h * 0.9 - piv, 4); c.fill(); c.beginPath(); c.roundRect(cx - R.w * 0.2, R.y + R.h * 0.88, R.w * 0.4, R.h * 0.06, 6); c.fill();

  c.fillStyle = '#f0d59c'; c.beginPath(); c.arc(cx, piv, 7, 0, 6.3); c.fill();
  const lx = cx - bw / 2, rx = cx + bw / 2;
  // strings and pans
  [lx, rx].forEach((x) => {
    c.strokeStyle = 'rgba(220,200,160,.7)'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(x, piv); c.lineTo(x - R.w * 0.11, panY); c.moveTo(x, piv); c.lineTo(x + R.w * 0.11, panY); c.stroke();
    const pg = c.createLinearGradient(0, panY, 0, panY + 10); pg.addColorStop(0, '#d9bd88'); pg.addColorStop(1, '#8c7048'); c.fillStyle = pg; c.beginPath(); c.ellipse(x, panY + 3, R.w * 0.12, 6, 0, 0, 6.3); c.fill();
  });
  // weights on the right pan
  for (let i = 0; i < 3; i++) { const wg = c.createLinearGradient(rx - 14, 0, rx + 14, 0); wg.addColorStop(0, '#6f7790'); wg.addColorStop(0.4, '#c3c9da'); wg.addColorStop(1, '#5b627a'); c.fillStyle = wg; c.beginPath(); c.roundRect(rx - 15 + i * 2, panY - 12 - i * 10, 30 - i * 4, 10, 4); c.fill(); }
  // sealed jar with the phosphorus
  const jw = R.w * 0.2, jh = R.h * 0.36, jb = panY;
  const pile = 0.55 + 0.3 * prog;
  glow(c, lx, jb - 8, jw * 0.7, 0.35 * (e > 0.3 ? (1 - ease((e - 2.8) / 1.2)) : 0), '255,250,220');
  const pg2 = c.createRadialGradient(lx - 3, jb - 9, 1, lx, jb - 6, 14 * pile); pg2.addColorStop(0, '#f6a08a'); pg2.addColorStop(1, '#b43c2c'); c.fillStyle = pg2; c.beginPath(); c.ellipse(lx, jb - 5, 12 * pile + 2, 6 * pile + 1, 0, 0, 6.3); c.fill();

  if (L.phase !== 'ask') { const sm_ = Math.min(1, prog * 2) * (1 - ease((e - 3.2) / 1.4) * 0.6); for (let i = 0; i < 6; i++) { const sx = lx + Math.sin(time * 1.2 + i * 1.7) * jw * 0.3, sy = jb - 12 - (i / 6) * jh * 0.7 - Math.sin(time + i) * 4; const g = c.createRadialGradient(sx, sy, 0, sx, sy, R0(jw * 0.3)); g.addColorStop(0, `rgba(240,240,245,${0.38 * sm_})`); g.addColorStop(1, 'rgba(240,240,245,0)'); c.fillStyle = g; c.fillRect(sx - jw * 0.3, sy - jw * 0.3, jw * 0.6, jw * 0.6); } }
  jarGlass(c, lx, jb, jw, jh, 0);
  // the burning glass: sunlight into the jar

  $('sFb').hidden = false; lab.setGlow('rgba(255, 130, 50, .26)');
  $('fL1').textContent = f.gap; $('fL2').textContent = f.wind;
  $('fGap').innerHTML = [0, 1, 2, 3, 4, 5].map((n) => chip('gap', n, String(n), F.gap === n, F.phase === 'burn' ? ' disabled' : '')).join('');
  $('fWind').innerHTML = chip('wind', 'calm', `🍃 ${esc(f.calm)}`, F.wind === 'calm', F.phase === 'burn' ? ' disabled' : '') + chip('wind', 'strong', `💨 ${esc(f.windy)}`, F.wind === 'strong', F.phase === 'burn' ? ' disabled' : '');
  $('fRow').innerHTML = F.phase === 'set' ? `<button class="btn" data-act="go">${esc(f.go)}</button>` : F.phase === 'done' ? `<button class="btn" data-act="freset">${esc(f.reset)}</button>` : '';
  lab.setReadout(String(F.gap), f.gap, '', '#ff7a45');
  lab.setFacts(factList(['london', 'cedar', 'vanness']));
  const fine = `<div class="fine" style="font-size:11px;color:var(--faint)">${esc(f.model)}</div>`;
  if (F.phase === 'set') lab.setState({ emo: '🌲', title: f.t0, lead: f.l0, body: '', extra: fine });
  else if (F.phase === 'burn') lab.setState({ emo: '🔥', title: f.runT, lead: f.runL, body: '', extra: fine });
  else lab.setState({ emo: cross ? '🔥' : '🌲', title: cross ? f.jumpT : f.stopT, lead: cross ? f.jumpL : f.stopL, body: '', extra: fine });
}
function renderLav(t) {
  const L = S.l, l = t.lav;
  $('sLav').hidden = false; lab.setGlow('rgba(255, 220, 140, .24)');
  $('lQ').textContent = l.q;
  $('lOpt').innerHTML = L.phase === 'ask' ? ['less', 'same', 'more'].map((k) => chip('lav', k, esc(l.opts[k]))).join('') : '';
  $('lRow').innerHTML = L.phase === 'done' ? `<button class="btn" data-act="lagain">${esc(l.again)}</button>` : '';
  lab.setFacts(factList(['p1772', 'phlog', 'oxname']));
  lab.setReadout('?', '', '', '#ffdc8c');
  if (L.phase === 'ask') lab.setState({ emo: '⚖️', title: l.q, lead: '', body: '', extra: '' });
  else if (L.phase === 'burn') { lab.setReadout('⚖️', '', '', '#ffdc8c'); lab.setState({ emo: '🔬', title: l.runT, lead: l.runL, body: '', extra: '' }); }
  else {
    const ok = L.guess === 'more';
    lab.setReadout('⚖️', '', '', '#ffdc8c');
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.right : t.wrong, lead: l.doneL, body: l.doneB, extra: `<div class="fine" style="font-size:11px;color:var(--faint)">${esc(l.fine)}</div>` });
  }
}

canvasLoop($('cv'), frame);
render();
</script>
