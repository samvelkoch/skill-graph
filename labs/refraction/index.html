function fresnelR(n1, n2, i) {
  const st = n1 / n2 * Math.sin(i);

  const ct = Math.sqrt(1 - st * st), ci = Math.cos(i);

const graphOn = () => {

};

});

// --- render: controls, readout, state card, facts, the prediction card ---------------------------------------------
const setHTML = (el, html) => { if (el._h !== html) { el._h = html; el.innerHTML = html; } };
const cardOn = () => {
  const m = mode();
  if (m === 'mirror') return S.ph.mir !== 'done';
  if (m === 'bend') return S.ph.bend !== 'done';
  if (predPool() || (m === 'tricks' && S.trk === 'pool' && S.ph.pool === 'verdict')) return true;
  return false;
};
function verdictCard(title, ok, text, act, rowHtml = '') {
  return `<div class="rf-vh"><span class="verdict" style="color:${ok ? 'var(--ok)' : 'var(--wip)'}">${esc(title)}</span><button class="rf-go" data-a="${act}">${esc(T[lang].next)}</button></div>${rowHtml}<p>${esc(text)}</p>`;
}
function cardHTML(t) {
  const m = mode();
  if (m === 'mirror') {
    const peri = S.mMode === 'peri';
    if (S.ph.mir === 'ask') return `<div class="q">${esc(peri ? t.mir.qp : t.mir.q)}</div><p>${esc(peri ? t.mir.leadp : t.mir.lead)}</p><div class="opts"><button class="rf-go" data-a="mgo"${S.mMark == null ? ' disabled' : ''}>${esc(t.mir.go)}</button></div>`;
    if (S.ph.mir === 'verdict') { const ok = S.mVerd === 'ok'; return verdictCard(ok ? t.mir.ok : t.mir.no, ok, peri ? t.mir.pT : S.mVerd === 'ok' ? t.mir.okT : S.mVerd === 'surf' ? t.mir.surfT : t.mir.noT, 'mnext'); }
  } else if (m === 'bend') {
    const keys = ['towards', 'away', 'none'];
    if (S.ph.bend === 'ask') return `<div class="q">${esc(t.bend.q)}</div><p>${esc(t.bend.lead)}</p><div class="opts">${keys.map((k) => `<button data-g="${k}">${esc(t.bend.opts[k])}</button>`).join('')}</div>`;
    if (S.ph.bend === 'verdict') {
      const ok = S.bGuess === 'towards', row = `<div class="opts">${keys.map((k) => `<button disabled class="${k === 'towards' ? 'good' : k === S.bGuess ? 'bad' : ''}">${esc(t.bend.opts[k])}</button>`).join('')}</div>`;
      return verdictCard(ok ? t.bend.ok : t.bend.no, ok, ok ? t.bend.tOk : S.bGuess === 'away' ? t.bend.tAway : t.bend.tNone, 'bnext', row);
    }
  } else if (m === 'tricks' && S.trk === 'pool') {
    const vals = ['1.5', '2', '2.7'].map((v) => `${dec(v)} m`);
    if (S.ph.pool === 'ask') return `<div class="q">${esc(t.tr.pool.q)}</div><p>${esc(t.tr.pool.lead)}</p><div class="opts">${vals.map((v, i) => `<button data-p="${i}">${esc(v)}</button>`).join('')}</div>`;
    if (S.ph.pool === 'verdict') {
      const ok = S.pGuess === 0, row = `<div class="opts">${vals.map((v, i) => `<button disabled class="${i === 0 ? 'good' : i === S.pGuess ? 'bad' : ''}">${esc(v)}</button>`).join('')}</div>`;
      return verdictCard(ok ? t.tr.pool.ok : t.tr.pool.no, ok, ok ? t.tr.pool.tOk : t.tr.pool.tNo, 'pnext', row);
    }
  }
  return '';
}
function syncSlider(cfg) {
  const el = $('rfSl');
  S[cfg.k] = clamp(S[cfg.k], cfg.min, cfg.max);
  if (+el.min !== cfg.min) el.min = cfg.min;
  if (+el.max !== cfg.max) el.max = cfg.max;
  if (+el.step !== cfg.step) el.step = cfg.step;
  if (+el.value !== S[cfg.k]) el.value = S[cfg.k];
  $('rfSlName').textContent = cfg.label; $('rfSlVal').textContent = cfg.fmt(S[cfg.k]);
}
function render() {
  const t = T[lang], m = mode(), v = lab.view, sec = S.sec;
  const cfg = slCfg(); syncSlider(cfg);
  $('rfMir').style.display = !sec && v === 'mirror' ? '' : 'none';
  $('rfBend').style.display = !sec && v === 'bend' ? '' : 'none';
  $('rfTrk').style.display = !sec && v === 'tricks' ? '' : 'none';
  $('rfTr').style.display = sec === 'trapped' ? '' : 'none';
  $('rfSl2W').style.display = sec === 'diamond' ? '' : 'none';
  $('rfAgain').style.display = S.ph.mir !== 'ask' ? '' : 'none';
  $('rfAgain').textContent = t.again;
  setHTML($('rfMode'), [['single', t.mir.modes[0]], ['peri', t.mir.modes[1]]].map(([k, l]) => `<button data-act="mmode" data-v="${k}" class="${S.mMode === k ? 'on' : ''}">${esc(l)}</button>`).join(''));
  const pb = predBend();
  setHTML($('rfMats'), ['water', 'glass', 'diamond'].map((k) => `<button class="chip rf-c ${S.mat === k ? 'on' : ''}" data-act="mat" data-v="${k}">${esc(t.bend.mats[k])}</button>`).join(''));
  setHTML($('rfDir'), ['in', 'out'].map((k, i) => `<button data-act="dir" data-v="${k}" class="${S.dir === k ? 'on' : ''}"${pb ? ' disabled' : ''}>${esc(t.bend.dirs[i])}</button>`).join(''));
  setHTML($('rfTrkChips'), ['straw', 'coin', 'pool'].map((k) => `<button class="chip rf-c ${S.trk === k ? 'on' : ''}" data-act="trk" data-v="${k}">${esc(t.tr.chips[k])}</button>`).join(''));
  setHTML($('rfSub'), [['water', t.sec.subs[0]], ['fibre', t.sec.subs[1]]].map(([k, l]) => `<button data-act="sub" data-v="${k}" class="${S.trSub === k ? 'on' : ''}">${esc(l)}</button>`).join(''));
  const op = secret.unlocked(), sc = (k, emo) => `<button class="chip rf-c secret ${op ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${op ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
  setHTML($('rfSec'), sc('trapped', '🔦') + sc('diamond', '💎'));
  if (sec === 'diamond') { $('rfSl2Name').textContent = t.sl.pos; $('rfSl2Val').textContent = `${Math.round(S.dPos * 100)}%`; if (+$('rfSl2').value !== S.dPos) $('rfSl2').value = S.dPos; }
  const card = cardOn(); askEl.hidden = !card; setHTML(askEl, card ? cardHTML(t) : '');
  if (m === 'mirror') renderMirror(t); else if (m === 'bend') renderBend(t); else if (m === 'tricks') renderTricks(t);
  else if (m === 'trapped') renderTrapped(t); else renderDiamond(t);
}
function renderMirror(t) {
  const mm = t.mir, peri = S.mMode === 'peri', pred = S.ph.mir === 'ask';
  lab.setGlow('rgba(255, 70, 90, .22)'); lab.setFacts(t.facts.mirror);
  if (peri) {
    const d = 2 * (S.mTilt - 45);
    lab.setReadout(`${S.mTilt}°`, mm.tilt, pred ? '' : `${d > 0 ? '↗' : '↘'} ${Math.abs(d)}°`, '#ff4a5c');
    if (pred) lab.setState({ emo: '🎯', title: mm.qp, lead: mm.leadp, body: '', extra: '' });
    else lab.setState({ emo: '🔭', title: mm.tP, lead: mm.lP(d, S.mTilt), body: mm.bP, extra: '' });
    return;
  }
  lab.setReadout(`i = ${S.mTh}°`, pred ? 'r = ?' : `r = ${S.mTh}°`, '', '#ff4a5c');
  if (pred) lab.setState({ emo: '🎯', title: mm.q, lead: mm.lead, body: '', extra: '' });
  else lab.setState({ emo: '🪞', title: mm.tI, lead: mm.lI(S.mTh), body: mm.bI, extra: '' });
}
function renderBend(t) {
  const b = t.bend, pred = S.ph.bend === 'ask' && !S.sec, k = bendCalc(), r = Math.round(deg(k.r)), v = sp(SPEED[k.mat]);
  lab.setGlow('rgba(70, 150, 240, .26)');
  if (pred) {
    lab.setFacts([]); lab.setReadout(`i = ${S.bI}°`, 'r = ?', '', '#4ea8ff');
    lab.setState({ emo: '🤔', title: b.q, lead: b.lead, body: '', extra: '' }); return;
  }
  lab.setFacts(t.facts.bend);
  lab.setReadout(k.tir ? `i = ${S.bI}°` : `i = ${S.bI}° → r = ${r}°`, `n = ${k.n.toFixed(2)} · ${v} ${t.km}`, k.tir ? b.pTir : k.out ? b.pAway : b.pTo, k.tir ? '#ff6b78' : '#4ea8ff');
  if (k.tir) lab.setState({ emo: '🪞', title: b.tTir, lead: b.lTir(k.crit.toFixed(1)), body: b.bTir, extra: '' });
  else if (k.out) lab.setState({ emo: '🌬️', title: b.tOut, lead: b.lOut(r, S.bI), body: b.bOut, extra: '' });
  else lab.setState({ emo: '💧', title: b.tIn, lead: b.lIn(r, S.bI, v), body: b.bIn, extra: '' });
}
function renderTricks(t) {
  const x = t.tr;
  lab.setGlow('rgba(255, 190, 90, .2)');
  if (S.trk === 'straw') {
    lab.setFacts(t.facts.tricks); lab.setReadout(`${S.sAng}°`, t.sl.look, '', '#ff4a5c');
    lab.setState({ emo: '🥤', title: x.straw.t, lead: x.straw.l, body: x.straw.b, extra: '' });
  } else if (S.trk === 'coin') {
    const g = coinGeo(LAST.w, LAST.h), vis = coinVis(g, S.pour / 100).vis, pc = Math.round(vis * 100);
    lab.setFacts(t.facts.tricks); lab.setReadout(`${S.pour}%`, x.coin.sub, x.coin.pill(pc), '#e0b050');
    const [ti, le] = vis < 0.03 ? [x.coin.t0, x.coin.l0] : vis < 0.97 ? [x.coin.t1, x.coin.l1] : [x.coin.t2, x.coin.l2];
    lab.setState({ emo: '🪙', title: ti, lead: le, body: x.coin.b, extra: '' });
  } else {
    lab.setFacts(t.facts.tricks);
    if (S.ph.pool === 'ask') { lab.setReadout('2 m', t.real, '', '#4ea8ff'); lab.setState({ emo: '🤔', title: x.pool.q, lead: x.pool.lead, body: '', extra: '' }); return; }
    const a = dec(poolCalc(LAST.w, LAST.h).app.toFixed(1));
    lab.setReadout(`≈ ${a} m`, `${x.looks} · ${t.real} 2 m`, '', '#4ea8ff');
    lab.setState({ emo: '🏊', title: x.pool.t(a), lead: x.pool.l, body: x.pool.b, extra: '' });
  }
}
function renderTrapped(t) {
  const s = t.sec;
  lab.setGlow('rgba(110, 200, 255, .24)');
  if (S.trSub === 'water') {
    const k = bendCalc(), r = Math.round(deg(k.r));
    lab.setFacts([]);
    lab.setReadout(`i = ${S.bI}°`, s.critP(k.crit.toFixed(1)), k.tir ? t.bend.pTir : '', k.tir ? '#ff6b78' : '#4ea8ff');
    if (k.tir) lab.setState({ emo: '🔦', title: s.wt, lead: s.wl(k.crit.toFixed(1)), body: s.wb, extra: '' });
    else lab.setState({ emo: '🔦', title: s.ws, lead: s.wsl, body: s.wsb, extra: '' });
    void r; return;
  }
  const res = traceFibre(fibreGeo(LAST.w, LAST.h), S.fib);
  lab.setFacts(t.facts.tricks);
  lab.setReadout(`${S.fib}°`, s.entry, res.leak ? s.leaking : s.trapped, res.leak ? '#ff9a5a' : '#6fe0ff');
  if (res.leak) lab.setState({ emo: '🧵', title: s.fx, lead: s.fxl, body: s.fxb, extra: '' });
  else lab.setState({ emo: '🧵', title: s.ft, lead: s.fl, body: s.fb, extra: '' });
}
function renderDiamond(t) {
  const s = t.sec, k = diamondCalc(LAST.w, LAST.h), r = { bounces: k.tr.hits.filter((h) => h.tir).length, top: !!k.tr.exit && k.tr.exit.p[1] < k.top + k.Wd * 0.17 };
  lab.setGlow('rgba(150, 190, 255, .26)'); lab.setFacts([]);
  lab.setReadout(s.bn(r.bounces), s.critP(crit(N.diamond).toFixed(1)), r.top ? s.exitTop : s.exitBack, '#8fb8ff');
  lab.setState({ emo: '💎', title: r.top ? s.dt : s.dtx, lead: r.top ? s.dl(r.bounces) : s.dlx, body: s.db, extra: '' });
}
render();
</script>
