    <div class="row2"><button class="btn sp-go" id="sGo" data-act="sgo"></button><span class="sp-sel" id="sSel"></span></div>
  </div>
  <div id="secLock"><button class="btn" data-act="gosort" id="lockGo"></button></div>
  <div id="secCycle">
    <div class="sp-lab" id="cLab"></div>
    <input class="sp-range" id="cRange" type="range" min="0" max="5" step="1" value="0">
    <div class="row2"><button class="chip" data-act="play" id="cPlay"></button><button class="chip" data-act="dry" id="cDry" hidden></button></div>
    <div class="row2" id="cAsk"></div>
  </div>
  <div id="secTime">
    <div id="tMain">
      <div class="chips" id="tChips"></div>
      <div id="tPre" style="margin-top:12px">
        <p class="sp-q" id="tQ"></p><div class="sp-cards" id="tCards"></div>
        <div class="row2" style="margin-top:0"><button class="btn sp-go" id="tGo" data-act="tgo"></button></div>
      </div>
      <div id="tPost">
        <div class="sp-cards" id="tDone"></div>
        <div class="sp-lab" id="tLab"></div>
        <input class="sp-range" id="tRange" type="range" min="0" max="100" step="1" value="0">
      </div>
    </div>
    <div id="tSec">
      <div id="tRain"><div class="sp-lab" id="rLab"></div><input class="sp-range" id="rRange" type="range" min="0" max="100" step="1" value="0"></div>
      <div id="tShow" class="row2" style="margin-top:0"><button class="btn sp-go" data-act="blow" id="blowB"></button></div>
    </div>
    <div class="row2" id="secRow" hidden></div>
  </div>`;

// on a phone the controls sit below the picture: bring the reveal into view
const showStage = () => { const r = $('stage').getBoundingClientRect(); if (r.top < 0 || r.bottom > innerHeight) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
const nextUnsorted = () => ORG.find((k) => !S.sort[k]);
function checkSort() {
  S.checked = true; S.unlocked = true; store.set(GKEY, true);
  const ok = ORG.filter((k) => S.sort[k] === TRUTH[k]).length; (ok === 6 ? sfx.good : sfx.snap)(); showStage();
}

$('ctrlBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  const d = b.dataset, a = d.act;
  if (d.bin) { if (S.checked) return; S.sort[S.pick] = d.bin; sfx.click(); const nx = nextUnsorted(); if (nx) S.pick = nx; }
  else if (a === 'sgo') { if (S.checked) { S.sort = {}; S.checked = false; S.pick = ORG[0]; sfx.click(); } else if (ORG.every((k) => S.sort[k])) checkSort(); }
  else if (a === 'gosort') { sfx.click(); $('views').querySelector('[data-view="sort"]')?.click(); return; }
  else if (a === 'play') { S.play = !S.play; S.playT = 0; sfx.click(); }
  else if (a === 'dry') { S.dry = !S.dry; S.stage = 4; sfx.click(); showStage(); }
  else if (d.g) { if (S.g2 !== null) return; S.g2 = d.g; S.dry = true; S.stage = 4; S.play = false; (d.g === 'no' ? sfx.good : sfx.bad)(); showStage(); }
  else if (d.plant) { S.plant = d.plant; sfx.tick(); }
  else if (d.card !== undefined) {
    if (S.t3) return; const id = CARD_ORDER[+d.card], at = S.order.indexOf(id);
    if (at >= 0) S.order.splice(at, 1); else if (S.order.length < 4) S.order.push(id); sfx.tick();
  } else if (a === 'tgo') {
    if (S.t3 || S.order.length < 4) return;
    S.t3 = true; S.t3ok = S.order.every((id, i) => id === i); S.p = 0; S.anim = true; S.st = 0; (S.t3ok ? sfx.good : sfx.snap)(); showStage();
  } else if (a === 'sec') {
    if (!secret.unlocked()) return secret.open();
    S.sec = S.sec === d.k ? null : d.k; sfx.click();
    if (S.sec === 'shower') S.sh = { sp: [], damp: 0, landed: 0 };
    if (S.sec === 'sponge') S.rain = 0;
  } else if (a === 'blow') { const { w, h } = cvl.size(); blow(w, h); sfx.push(); }
  render();
});
$('cRange').addEventListener('input', (ev) => { S.stage = +ev.target.value; S.play = false; sfx.tick(); render(); });
$('tRange').addEventListener('input', (ev) => { S.anim = false; S.p = +ev.target.value / 100; render(); });
$('rRange').addEventListener('input', (ev) => { S.rain = +ev.target.value / 100; render(); });
$('cv').addEventListener('pointerdown', (ev) => {
  const r = $('cv').getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  if (lab.view === 'sort' && geoS) {
    const hit = geoS.find((g) => x >= g.x && x <= g.x + g.w && y >= g.y && y <= g.y + g.h);
    if (hit) { S.pick = hit.k; sfx.tick(); render(); }
  } else if (lab.view === 'cycle' && geoC && S.unlocked) {
    let best = -1, bd = (geoC.nr * 1.5) ** 2;
    geoC.nodes.forEach((n, i) => { const dd = (n.x - x) ** 2 + (n.y - y) ** 2; if (dd < bd) { bd = dd; best = i; } });
    if (best >= 0) { S.stage = best; S.play = false; sfx.tick(); render(); }
  }
});

// --- one render per change: controls, readout and the state card ---------------------------------------------
function render() {
  const t = T[lang], v = lab.view, locked = v !== 'sort' && !S.unlocked;
  $('secSort').hidden = v !== 'sort';
  $('secLock').hidden = !locked;
  $('secCycle').hidden = !(v === 'cycle' && !locked);
  $('secTime').hidden = !(v === 'time' && !locked);
  if (locked) {
    $('lockGo').textContent = t.lock.go;
    lab.setReadout('🔒', '', '', '#6fcf8a'); lab.setGlow('rgba(80, 150, 110, .22)');
    lab.setState({ emo: '🔒', title: t.lock.title, lead: t.lock.lead, body: '', extra: '' }); lab.setFacts([]); return;
  }
  if (v === 'sort') renderSort(t); else if (v === 'cycle') renderCycle(t); else renderTime(t);
}

function renderSort(t) {
  const s = t.sort, n = ORG.filter((k) => S.sort[k]).length, all = n === 6;
  lab.setGlow('rgba(80, 170, 110, .26)');
  $('sQ').hidden = S.checked; $('sBins').hidden = S.checked;
  $('sQ').textContent = `${s.q} ${s.hint}`;
  $('sBins').innerHTML = ['seed', 'spore'].map((k) => `<button class="chip sp-bin${S.sort[S.pick] === k ? ' on' : ''}" data-bin="${k}">${esc(s[k])}</button>`).join('');
  $('sSel').textContent = S.checked ? s.learn : s.sel(s.orgs[S.pick]);
  $('sGo').textContent = S.checked ? s.again : s.check; $('sGo').disabled = !S.checked && !all;
  lab.setReadout(`${n}/6`, s.sub, '', '#6fcf8a');
  if (!S.checked) {
    const [ti, le] = n === 0 ? s.pre : all ? s.ready : s.part(n);
    lab.setState({ emo: '🌿', title: ti, lead: le, body: '', extra: `<div class="fine">${esc(s.preFine)}</div>` }); lab.setFacts([t.facts.sphag]);
  } else {
    const k = ORG.filter((o) => S.sort[o] === TRUTH[o]).length, [ti, le] = s.res(k);
    lab.setState({ emo: k === 6 ? '🎉' : '🌿', title: ti, lead: le, body: `${s.orgs[S.pick]} · ${s.tag[TRUTH[S.pick]]}. ${s.prof[S.pick]}`, extra: `<div class="fine">${esc(s.fine)}</div>` });
    lab.setFacts([t.facts.sphag, t.facts.moss, t.facts.kelp]);
  }
}

function renderCycle(t) {
  const c = t.cyc, st = clamp(S.stage, 0, 5), asked = S.g2 !== null, dryNow = asked && S.dry;
  lab.setGlow('rgba(90, 190, 120, .26)');
  $('cLab').textContent = `${c.range} ${st + 1} / 6`; $('cRange').value = String(st);
  $('cPlay').textContent = S.play ? c.pause : c.play;
  $('cDry').hidden = !asked; $('cDry').textContent = dryNow ? c.wet : c.dryB;
  $('cAsk').innerHTML = !asked
    ? `<div style="width:100%"><p class="sp-q">${esc(c.q)}</p><div class="sp-bins"><button class="chip sp-bin" data-g="yes">${esc(c.yes)}</button><button class="chip sp-bin" data-g="no">${esc(c.no)}</button></div></div>`
    : `<div style="width:100%"><p class="sp-v ${S.g2 === 'no' ? 'ok' : 'bad'}">${esc(S.g2 === 'no' ? c.right : c.wrong)}</p><p class="sp-q">${esc(c.why)}</p></div>`;
  lab.setReadout(`${st + 1}/6`, c.names[st], asked ? (dryNow ? c.dryPill : c.wetPill) : '', '#8be08a');
  const [ti, le] = dryNow && st === 4 ? c.dry4 : dryNow && st === 5 ? c.dry5 : c.st[st];
  lab.setState({ emo: dryNow && st >= 4 ? '☀️' : ['🌿', '💨', '🟤', '💚', '🔬', '🌱'][st], title: ti, lead: le, body: '', extra: `<div class="fine">${esc(c.fine)}</div>` });
  lab.setFacts(asked ? [t.facts.eaten, t.facts.mossWater] : [t.facts.eaten, t.facts.species]);
}

function renderTime(t) {
  const m = t.tm, p = S.p, st = stageOf(p), done = allDone(), sec = S.sec;
  lab.setGlow('rgba(190, 150, 80, .24)');
  $('tMain').hidden = !!sec; $('tSec').hidden = !sec;
  $('tRain').hidden = sec !== 'sponge'; $('tShow').hidden = sec !== 'shower';
  $('secRow').hidden = !done;
  if (done) {
    const has = secret.unlocked(), mk = (k, emo) => `<button class="chip secret ${has ? 'open' : ''} ${sec === k ? 'on' : ''}" data-act="sec" data-k="${k}">${has ? `${emo} ${esc(t.secrets[k][0])}` : '🔒 ???'}</button>`;
    $('secRow').innerHTML = mk('sponge', '🧽') + mk('shower', '🌬️');
  }
  if (sec === 'sponge') {
    const sp = t.sp, n = Math.round(16 * S.rain);
    $('rLab').textContent = sp.rain; $('rRange').value = String(Math.round(S.rain * 100));
    lab.setReadout(S.rain >= 0.995 ? '16–26×' : `${n}×`, sp.sub, '', '#6cc2f0');
    lab.setState({ emo: '🧽', title: sp.title, lead: sp.lead, body: sp.body, extra: '' }); lab.setFacts([t.facts.sphag]); return;
  }
  if (sec === 'shower') {
    const sh = t.sh;
    $('blowB').textContent = sh.blow;
    lab.setReadout(`${S.sh.damp}/${S.sh.landed}`, sh.sub, '', '#8be08a');
    lab.setState({ emo: '🌬️', title: S.sh.sp.length ? sh.title : sh.blow, lead: S.sh.sp.length ? sh.lead : sh.pre, body: '', extra: `<div class="fine">${esc(sh.fine)}</div>` }); lab.setFacts([t.facts.eaten]); return;
  }
  $('tChips').innerHTML = ['tree', 'horsetail', 'fern'].map((k) => `<button class="chip${S.plant === k && p < 0.05 && !S.t3 ? ' on' : ''}" data-plant="${k}">${esc(m.plants[k])}</button>`).join('');
  $('tChips').hidden = S.t3;
  $('tPre').hidden = S.t3; $('tPost').hidden = !S.t3;
  $('tQ').textContent = `${m.q} ${m.hint}`;
  $('tCards').innerHTML = CARD_ORDER.map((id, d) => { const pos = S.order.indexOf(id); return `<button class="sp-card${pos >= 0 ? ' on' : ''}" data-card="${d}"><span class="n">${pos >= 0 ? pos + 1 : ''}</span><span>${esc(m.steps[id])}</span></button>`; }).join('');
  $('tGo').textContent = m.check; $('tGo').disabled = S.order.length < 4;
  if (!S.t3) {
    const pl = m.pl[S.plant];
    lab.setReadout('359–299', m.sub, m.carb, '#c9a05a');
    lab.setState({ emo: '🌲', title: m.pre[0], lead: m.pre[1], body: `${m.plants[S.plant]}: ${pl[1]}`, extra: `<div class="fine">${esc(m.fine)}</div>` }); lab.setFacts([t.facts.lepi]); return;
  }
  $('tDone').innerHTML = [0, 1, 2, 3].map((id) => { const ok = S.order.indexOf(id) === id; return `<div class="sp-card ${ok ? 'ok' : 'bad'}"><span class="n">${id + 1}</span><span>${esc(m.steps[id])}</span><span style="margin-left:auto">${ok ? '✓' : '✗'}</span></div>`; }).join('');
  $('tLab').textContent = m.slide; $('tRange').value = String(Math.round(p * 100));
  lab.setReadout(`${st + 1}/4`, m.sn[st], p > 0.94 ? m.pills[2] : '', '#c9a05a');
  const [ti, le] = m.stages[st], verdict = p < 0.02 ? (S.t3ok ? m.right : m.wrong) : null;
  lab.setState({ emo: ['🌲', '🟤', '⛰️', '⚫'][st], title: verdict ? verdict[0] : ti, lead: verdict ? verdict[1] : le, body: verdict ? `${ti}. ${le}` : '', extra: `<div class="fine">${esc(m.fine)}</div>` });
  lab.setFacts([t.facts.lepi, t.facts.coal]);
}

// --- the loop --------------------------------------------------------------------------------------------------
const cvl = canvasLoop($('cv'), (c, w, h, dt, time) => {
  CW = w;
  const v = lab.view;
  if (v !== 'sort') geoS = null; if (v !== 'cycle') geoC = null;
  if (v !== 'sort' && !S.unlocked) return drawLocked(c, w, h, time);
  if (v === 'sort') drawSort(c, w, h, time);
  else if (v === 'cycle') {
    if (S.play) { S.playT += dt; if (S.playT > 2.4) { S.playT = 0; S.stage = (S.stage + 1) % 6; render(); } }
    drawCycle(c, w, h, time);
  } else {
    if (S.anim && S.t3 && !S.sec) {
      S.p = Math.min(1, S.p + dt / 10); $('tRange').value = String(Math.round(S.p * 100));
      if (stageOf(S.p) !== S.st) { S.st = stageOf(S.p); render(); }
      if (S.p >= 1) { S.anim = false; render(); }
    }
    if (S.sec === 'sponge') drawSponge(c, w, h, time); else if (S.sec === 'shower') drawShower(c, w, h, time, dt); else drawTime(c, w, h, time);
  }
});
render();
</script>
</body>
</html>
