    $('hr0').textContent = t.sec.hour(0); $('hr1').textContent = t.sec.hour(24);
    $('midSeg').innerHTML = [[0, t.sec.summer], [1, t.sec.winter]].map(([w, l]) => `<button data-act="season" data-w="${w}" class="${!!w === S.mid.winter ? 'on' : ''}">${esc(l)}</button>`).join('');
    syncMid();
    lab.setState({ emo: S.mid.winter ? '🌑' : '☀️', title: t.secrets.midnight[0], lead: t.sec.midText, body: '', extra: FINE(t) });
    return;
  }
  if (S.sec === 'thick') {
    lab.setGlow('rgba(127, 214, 255, .2)');
    lab.setReadout('📏', t.sec.big, '', '#7fd6ff');
    lab.setState({ emo: '📏', title: t.secrets.thick[0], lead: t.sec.thickText, body: '', extra: FINE(t) });
    return;
  }
  lab.setGlow('rgba(60, 110, 200, .32)');
  // nav: look from above at either pole, and back to the globe
  $('gNav').innerHTML = `<span class="lbl">${esc(g.look)}</span>
    <button class="chip ${p === 'N' ? 'on' : ''}" data-act="look" data-p="N">📍 ${esc(g.north)}</button>
    <button class="chip ${p === 'S' ? 'on' : ''}" data-act="look" data-p="S">📍 ${esc(g.south)}</button>
    ${p ? `<button class="chip" data-act="back">🌍 ${esc(g.back)}</button>` : ''}`;
  const [emo, ti, le, bo] = t.st.globe, cmp = both ? `<div class="cmp-t">${esc(g.compare)}</div><table class="cmp"><thead><tr>${g.head.map((x) => `<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${g.rows.map((r) => `<tr><th>${esc(r[0])}</th><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}</tbody></table>` : '';
  if (p === null) {
    $('gPredict').innerHTML = '';
    lab.setReadout('🌍', '', '', '#4ea8ff');
    lab.setState({ emo, title: ti, lead: le, body: both ? bo : '', extra: cmp + FINE(t) });
    return;
  }
  const st = S.po[p], right = RIGHT[p], other = p === 'N' ? 'S' : 'N';
  $('gPredict').innerHTML = `<div class="q">${esc(p === 'N' ? g.qN : g.qS)}</div><div class="opts">${['land', 'water'].map((k) => {
    const cls = st.done ? (k === right ? 'good' : k === st.ans ? 'bad' : '') : st.ans === k ? 'sel' : '';
    return `<button class="opt ${cls}" data-act="ans" data-v="${k}"${st.ans ? ' disabled' : ''}>${esc(g[k])}</button>`;
  }).join('')}${st.done && !S.po[other].done ? `<button class="btn push" data-act="next">${esc(t.next)}</button>` : ''}</div>`;
  // nothing about the answer shows until the ice has lifted
  lab.setReadout(`🧭 ${p}`, st.done ? g.coldest[p] : '', '', '#4ea8ff');
  if (st.done) {
    const ok = st.ans === right;
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.right : t.wrong, lead: p === 'N' ? g.rN : g.rS, body: both ? bo : '', extra: cmp + FINE(t) });
  } else lab.setState({ emo, title: ti, lead: le, body: '', extra: FINE(t) });
}

function renderAnimals(t) {
  const a = t.a, z = S.z, placed = Object.keys(z.place).length, [emo, ti, le, bo] = t.st.animals;
  const card = (k) => {
    const cls = ['pc', z.sel === k ? 'sel' : '', z.checked ? (z.fix[k] ? `fix ${TRUTH[k] === 's' ? 'tos' : 'ton'}` : 'ok') : ''].join(' ');
    return `<button class="${cls}" data-k="${k}"><span class="e">${EMO[k]}</span><span class="nm">${esc(a.names[k])}</span></button>`;
  };
  const inZone = (zn) => TRAY.filter((k) => z.place[k] === zn).map(card).join('');
  zoo.innerHTML = `<div class="half n" data-z="n"><h4>❄️ ${esc(a.north)}</h4><div class="cards">${inZone('n')}</div></div>
    <div class="half s" data-z="s"><h4>🧊 ${esc(a.south)}</h4><div class="cards">${inZone('s')}</div></div>
    ${z.checked ? '' : `<div class="tray"><div class="how">${esc(a.how)}</div><div class="cards">${TRAY.filter((k) => !z.place[k]).map(card).join('')}</div></div>`}`;
  $('zMain').textContent = z.checked ? t.again : t.check;
  $('zMain').disabled = !z.checked && placed < TRAY.length;
  if (!z.checked) {
    lab.setReadout('?', a.q, '', '#7fd3e8');
    lab.setState({ emo, title: ti, lead: a.q, body: '', extra: FINE(t) });
    return;
  }
  lab.setReadout(`${z.score}/9`, '', '', '#7fd3e8');
  const k = z.feat, feat = k ? `<div class="feat"><b>${EMO[k]} ${esc(a.names[k])}:</b> ${esc(a.feat[k])}</div>` : '';
  lab.setState({ emo: z.score === TRAY.length ? '🎉' : emo, title: a.never, lead: a.score(z.score), body: `${z.fix.sci ? `${a.sci} ` : ''}${le} ${bo}`,
    extra: `${feat}<div class="fine" style="margin-top:0">${esc(a.tap)}</div>${FINE(t)}` });
}

function renderMelt(t) {
  const m = S.melt, q = t.m, [emo, ti, le, bo] = t.st.melt;
  lab.setGlow('rgba(110, 180, 255, .26)');
  $('mPredict').innerHTML = `<div class="q">${esc(q.q)}</div><div class="opts">${[['sea', q.sea], ['land', q.land], ['both', q.both]].map(([k, l]) => {
    const cls = m.done ? (k === 'land' ? 'good' : k === m.ans ? 'bad' : '') : m.ans === k ? 'sel' : '';
    return `<button class="opt ${cls}" data-act="mans" data-v="${k}"${m.ans ? ' disabled' : ''}>${esc(l)}</button>`;
  }).join('')}${m.done ? `<button class="btn push" data-act="mreset">${esc(t.again)}</button>` : ''}</div>`;
  lab.setReadout('🧊', '', '', '#6fb5ff');
  if (m.done) {
    const ok = m.ans === 'land';
    lab.setState({ emo: ok ? '✅' : '🤔', title: ok ? t.right : q.wrong, lead: q.r, body: '', extra: FINE(t) });
  } else lab.setState({ emo, title: ti, lead: le, body: bo, extra: FINE(t) });
}
render();
</script>
</body>
</html>
